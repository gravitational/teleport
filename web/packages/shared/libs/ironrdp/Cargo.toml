[package]
name = "ironrdp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1.7"
# Every getrandom major that lands in this crate's graph needs its wasm backend feature turned on, otherwise the
# wasm32-unknown-unknown build refuses to pick a backend. The vendored ironrdp-session reaches sspi and picky through
# ironrdp-connector, and those are what drag 0.3 and 0.4 in alongside 0.2.
getrandom1 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom2 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom3 = { package = "getrandom", version = "0.4.2", features = ["wasm_js"] }
ironrdp-session.workspace = true
ironrdp-pdu.workspace = true
ironrdp-core.workspace = true
ironrdp-graphics.workspace = true
js-sys = "0.3.76"
log = "0.4.30"
time = { version = "0.3", features = ["wasm-bindgen"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["time"] }
tracing-web = "0.1.2"
# Mirrors the bound in lib/srv/desktop/rdp/rdpclient/Cargo.toml, see the note there.
uuid = { version = ">=1.16, <1.24", features = ["js"] }
wasm-bindgen = "0.2.95"
web-sys = { version = "0.3.95", features = ["ImageData"] }

[features]
default = []
qoiz = ["ironrdp-session/qoiz"]