# Defines a workflow that, given a major version of Teleport:
#  1. Finds the newest released version of that series of Teleport
#  2. Rebuilds all the `teleport-plugin-*` oci container images for that
#     build of Teleport, and
#  3. Pushes them to production
#
# This is intended to be run on a schedule from a parent workflow.

name: Rebuild Teleport plugins OCI Images
on:
  workflow_dispatch:
    inputs:
      oss-teleport-repo:
        description: |
          The name of the OSS teleport repo to checkout
        required: false
        type: string
        default: gravitational/core

      teleport-release-tag:
        description: |
          The semver version of the teleport release to rebuild, including
          the leading `v`
        type: string

      environment:
        description: |
          GitHub Actions environment in which to run the rebuild. Can be either
          `stage/oci-rebuild` or `prod/oci-rebuild`.
        type: string
        default: stage/oci-rebuild

  workflow_call:
    inputs:
      oss-teleport-repo:
        description: |
          The name of the OSS teleport repo to checkout
        required: false
        type: string
        default: gravitational/core

      teleport-release-tag:
        description: |
          The semver version of the teleport release to rebuild, including
          the leading `v`
        type: string

      environment:
        description: |
          GitHub Actions environment in which to run the rebuild. Can be either
          `stage/oci-rebuild` or `prod/oci-rebuild`.
        type: string
        default: stage/oci-rebuild

run-name: Rebuild Distroless Plugin Images for Teleport ${{ inputs.teleport-release-tag }}

jobs:
  configure:
    name: Configure Build
    runs-on: ubuntu-latest
    outputs:
      teleport-version: ${{ steps.version.outputs.full }}
      image_tags: ${{ steps.version.outputs.labels }}
    steps:
      - name: Parse version
        id: version
        uses: gravitational/core/.github/actions/parse-version@master
        with:
          version: ${{ inputs.teleport-release-tag }}

  rebuild-image:
    name: Rebuild OCI plugin container images for ${{ inputs.teleport-release-tag }}
    needs: configure
    permissions:
      id-token: write  # required for aws-actions/configure-aws-credentials
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 2 # temp limit until we get limits increased on teleport-prod
      matrix:
        plugins:
          # Access plugins
          - name: discord
            artifact-name: access-discord
            dockerfile-path: integrations/access/Dockerfile
          - name: email
            artifact-name: access-email
            dockerfile-path: integrations/access/Dockerfile
          - name: jira
            artifact-name: access-jira
            dockerfile-path: integrations/access/Dockerfile
          - name: mattermost
            artifact-name: access-mattermost
            dockerfile-path: integrations/access/Dockerfile
          - name: msteams
            artifact-name: access-msteams
            dockerfile-path: integrations/access/Dockerfile
          - name: pagerduty
            artifact-name: access-pagerduty
            dockerfile-path: integrations/access/Dockerfile
          - name: slack
            artifact-name: access-slack
            dockerfile-path: integrations/access/Dockerfile
          - name: datadog
            artifact-name: access-datadog
            dockerfile-path: integrations/access/Dockerfile
          # Event handler
          - name: event-handler
            artifact-name: event-handler
            dockerfile-path: integrations/event-handler/Dockerfile
        image-type:
          - name: production  # The `name` field is just here for documentation
            repo-suffix: ''
            base-image-tag: latest
          - name: debug
            repo-suffix: '-debug'
            base-image-tag: debug

    uses: ./.github/workflows/oci-image-build.yml
    with:
      teleport-release: oss
      base-image: 'gcr.io/distroless/static-debian12:${{ matrix.image-type.base-image-tag }}'
      oss-teleport-repo: ${{ inputs.oss-teleport-repo }}
      oss-teleport-ref: ${{ inputs.teleport-release-tag }}
      source-tag: ${{ inputs.teleport-release-tag }}
      teleport-version: ${{ needs.configure.outputs.teleport-version }}
      dest-image-registry-region: us-east-1
      dest-image-repo: teleport-plugin-${{ matrix.plugins.name }}${{ matrix.image-type.repo-suffix }}
      dest-image-tags: ${{ needs.configure.outputs.image_tags }}
      environment: ${{ inputs.environment }}
      architectures: |
        arm64
        amd64
      # Used to reconstruct tarball name
      image-build-args: |
        ARTIFACT_NAME=${{ matrix.plugins.artifact-name }}
        TELEPORT_VERSION=${{ needs.configure.outputs.teleport-version }}
      s3-file-name-override: |-
        teleport-plugins/tag/${{ needs.configure.outputs.teleport-version }}/teleport-${{ matrix.plugins.artifact-name }}-v${{ needs.configure.outputs.teleport-version }}-linux-{arch}-bin.tar.gz
      image-build-context: ./teleport/. # Teleport repo directory
      image-build-dockerfile: ${{ matrix.plugins.dockerfile-path }}
    secrets:
      deploy-access-app-id: ${{ secrets.DEPLOY_APP_ID }}
      deploy-access-app-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
