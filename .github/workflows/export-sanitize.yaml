name: Export Sanitized Branch

on:
# TODO: Uncomment after testing via workflow_dispatch
#  push:
#    branches:
#      - master
#      - branch/v18
#      - branch/v17
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to sanitize.
        required: true
        type: choice
        options:
          - master
          - branch/v18
          - branch/v17

permissions:
  id-token: write

concurrency:
  group: export-sanitize-${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  sanitize:
    name: Sanitize Export Branch
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Get runtime values from kvstore
        id: kvstore
        uses: gravitational/shared-workflows/tools/env-kvstore@tools/env-kvstore/v1.0.2
        with:
          cognito-identity-pool-id: "us-west-2:da53389e-a459-4a28-bd54-43eeb8e4b579"
          cognito-role-arn: "arn:aws:iam::247230412011:role/github-actions-cognito-oidc"
          values: |
            REVIEWERS_APP_ID,variable
            REVIEWERS_PRIVATE_KEY,secret
      - name: Generate GitHub Token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ env.REVIEWERS_APP_ID }}
          private-key: ${{ env.REVIEWERS_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Clear runtime values
        run: |
          echo "REVIEWERS_PRIVATE_KEY=" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}
      - name: Install git-filter-repo
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL \
            https://raw.githubusercontent.com/gravitational/git-filter-repo/da90cb247d3c544e7a76f032ed0457666b24bbb4/git-filter-repo \
            -o "$RUNNER_TEMP/bin/git-filter-repo"
          chmod +x "$RUNNER_TEMP/bin/git-filter-repo"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Get GitHub App User ID
        id: get-user-id
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: echo "user-id=$(gh api "/users/${{ steps.generate_token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
      - name: Configure git identity
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          git config --global user.name '${{ steps.generate_token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.generate_token.outputs.app-slug }}[bot]@users.noreply.github.com'
          gh auth setup-git
      - name: Sanitize export branch
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          e/scripts/export-pipeline/export-sanitize.sh \
            --branch "$BRANCH" \
            --push-stage \
            --create-pr
