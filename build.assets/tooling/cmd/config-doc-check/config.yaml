source_path: "../../../../"
service_sections:
  - name: Instance-wide settings
    example_path: docs/pages/includes/config-reference/instance-wide.yaml
    key_type_pairs:
      - section_key: teleport
        type_name: Global
    dismissed_keys:
      - teleport.auth_connection_config # it is included in the example as a comment
      - teleport.auth_servers # deprecated
      - teleport.ca_signature_algo # deprecated
      - teleport.kex_algos # auth service specific, not instance-wide
      - teleport.mac_algos # auth service specific, not instance-wide
      - teleport.pid_file # it is included in the example as a comment
      - teleport.shutdown_delay # it is included in the example as a comment
      - teleport.cache # auth service specific, not instance-wide
      - teleport.ciphers # auth service specific, not instance-wide
      - teleport.ciphersuites # auth service specific, not instance-wide
      - teleport.storage # auth service specific, not instance-wide
      - teleport.connection_limits.max_users # deprecated
  - name: Auth Service
    example_path: docs/pages/includes/config-reference/auth-service.yaml
    key_type_pairs:
      - section_key: teleport
        type_name: Global
      - section_key: auth_service
        type_name: Auth
    dismissed_keys:
      - teleport.advertise_ip # instance-wide, not auth service specific
      - teleport.auth_connection_config # instance-wide, not auth service specific
      - teleport.auth_server # instance-wide, not auth service specific
      - teleport.auth_servers # instance-wide, not auth service specific
      - teleport.auth_token # instance-wide, not auth service specific
      - teleport.ca_pin # instance-wide, not auth service specific
      - teleport.ca_signature_algo # instance-wide, not auth service specific
      - teleport.cache # instance-wide, not auth service specific
      - teleport.connection_limits # instance-wide, not auth service specific
      - teleport.data_dir # instance-wide, not auth service specific
      - teleport.diag_addr # instance-wide, not auth service specific
      - teleport.join_params # instance-wide, not auth service specific
      - teleport.log # instance-wide, not auth service specific
      - teleport.nodename # instance-wide, not auth service specific
      - teleport.pid_file # instance-wide, not auth service specific
      - teleport.proxy_server # instance-wide, not auth service specific
      - teleport.relay_server # instance-wide, not auth service specific
      - teleport.shutdown_delay # instance-wide, not auth service specific
      - auth_service.reverse_tunnels # for internal use only
      - auth_service.authentication.piv_slot # deprecated
      - auth_service.authentication.stable_unix_user_config.first_uid # it is included in the example as a comment
      - auth_service.authentication.stable_unix_user_config.last_uid # it is included in the example as a comment
      - auth_service.authentication.u2f.device_attestation_cas # deprecated
      - auth_service.authentication.u2f.facets # deprecated
      - auth_service.ca_key_params.pkcs11.pin_path # it is included in the example as a comment
      - auth_service.tunnel_strategy.strategy # Not allowed to be set
      - auth_service.tunnel_strategy.agent_connection_count # it is included in the example TODO: detect protobuf field presence
      - auth_service.tunnel_strategy.type # it is included in the example TODO: detect protobuf field presence
  - name: SSH Service
    example_path: docs/pages/includes/config-reference/ssh-service.yaml
    key_type_pairs:
      - section_key: ssh_service
        type_name: SSH
  - name: Proxy Service
    example_path: docs/pages/includes/config-reference/proxy-service.yaml
    key_type_pairs:
      - section_key: proxy_service
        type_name: Proxy
    dismissed_keys:
      - proxy_service.acme # it is included in the example as a comment
      - proxy_service
  - name: Kubernetes Service
    example_path: docs/pages/includes/config-reference/kubernetes-config.yaml
    key_type_pairs:
      - section_key: kubernetes_service
        type_name: Kube
  - name: Application Service
    example_path: docs/pages/includes/config-reference/app-service.yaml
    key_type_pairs:
      - section_key: app_service
        type_name: Apps
    dismissed_keys:
      - app_service.apps.required_apps # it is included in the example as a comment
      - app_service.apps.rewrite # it is included in the example as a comment
      - app_service.apps.cors # it is included in the example as a comment
  - name: Database Service
    example_path: docs/pages/includes/config-reference/database-config.yaml
    key_type_pairs:
      - section_key: db_service
        type_name: Databases
    dismissed_keys:
      - db_service.databases.ca_cert_file # deprecated
  - name: Discovery Service
    example_path: docs/pages/includes/discovery/discovery-config.yaml
    key_type_pairs:
      - section_key: discovery_service
        type_name: Discovery
    dismissed_keys:
      - discovery_service.gcp.tags # deprecated
  - name: Windows Desktop Service
    example_path: docs/pages/includes/config-reference/desktop-config.yaml
    key_type_pairs:
      - section_key: windows_desktop_service
        type_name: WindowsDesktopService
    dismissed_keys:
      - windows_desktop_service.discovery # deprecated
      - windows_desktop_service.hosts # deprecated
      - windows_desktop_service.non_ad_hosts # deprecated
  - name: Jamf Service
    example_path: docs/pages/includes/config-reference/jamf-service.yaml
    key_type_pairs:
      - section_key: jamf_service
        type_name: JamfService
  - name: Relay Service
    example_path: docs/pages/includes/config-reference/relay-service.yaml
    key_type_pairs:
      - section_key: relay_service
        type_name: Relay
    dismissed_keys:
      - relay_service.peer_public_addr # it is included in the example as a comment
      - relay_service.transport_proxy_protocol # it is included in the example as a comment
      - relay_service.tunnel_proxy_protocol # it is included in the example as a comment
  - name: Debug Service
    example_path: docs/pages/includes/config-reference/debug-service.yaml
    key_type_pairs:
      - section_key: debug_service
        type_name: DebugService
