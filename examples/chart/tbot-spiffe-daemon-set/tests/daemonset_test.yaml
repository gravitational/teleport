suite: Test Daemonset
templates:
  - daemonset.yaml
# Override chart version so snapshots are stable across releases.
chart:
  version: "99.0.0"
  appVersion: "99.0.0"
tests:
  - it: should match the snapshot (simple)
    template: daemonset.yaml
    values:
      - ../.lint/simple.yaml
    asserts:
      - matchSnapshot: {}
  - it: should match the snapshot (full)
    template: daemonset.yaml
    values:
      - ../.lint/full.yaml
    asserts:
      - matchSnapshot: {}
  - it: should not set dnsConfig or dnsPolicy when not set in values
    template: daemonset.yaml
    values:
      - ../.lint/simple.yaml
    asserts:
      - notExists:
          path: spec.template.spec.dnsConfig
      - notExists:
          path: spec.template.spec.dnsPolicy
  - it: should set dnsConfig when set in values
    template: daemonset.yaml
    values:
      - ../.lint/dnsconfig.yaml
    asserts:
      - notEqual:
          path: spec.template.spec.dnsConfig
          value: null
      - matchSnapshot:
          path: spec.template.spec.dnsConfig
  - it: should set dnsPolicy when set in values
    template: daemonset.yaml
    values:
      - ../.lint/dnsconfig.yaml
    asserts:
      - equal:
          path: spec.template.spec.dnsPolicy
          value: None
