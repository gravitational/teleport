suite: Test ClusterRole
templates:
  - clusterrole.yaml
# Override chart version so snapshots are stable across releases.
chart:
  version: "99.0.0"
  appVersion: "99.0.0"
tests:
  - it: should match the snapshot (simple)
    template: clusterrole.yaml
    values:
      - ../.lint/simple.yaml
    asserts:
      - matchSnapshot: {}
  - it: should match the snapshot (full)
    template: clusterrole.yaml
    values:
      - ../.lint/full.yaml
    asserts:
      - matchSnapshot: {}
