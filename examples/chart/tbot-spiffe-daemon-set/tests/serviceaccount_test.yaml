suite: Test ServiceAccount
templates:
  - serviceaccount.yaml
# Override chart version so snapshots are stable across releases.
chart:
  version: "18.0.0"
  appVersion: "18.0.0"
tests:
  - it: should match the snapshot (simple)
    template: serviceaccount.yaml
    values:
      - ../.lint/simple.yaml
    asserts:
      - matchSnapshot: {}
  - it: should match the snapshot (full)
    template: serviceaccount.yaml
    values:
      - ../.lint/full.yaml
    asserts:
      - matchSnapshot: {}
