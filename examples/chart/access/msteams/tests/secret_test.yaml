suite: Test secret
templates:
  - secret.yaml
# Override chart version so snapshots are stable across releases.
chart:
  version: "18.0.0"
  appVersion: "18.0.0"
tests:
  - it: should contain the api key
    set:
      msTeams:
        appSecret: my-app-secret
    asserts:
      - matchSnapshot: {}

  - it: should not exist when using external secret
    set:
      msTeams:
        appSecretFromSecret: my-msteams-secret
    asserts:
      - hasDocuments:
          count: 0
