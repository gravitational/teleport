suite: Test secret
templates:
  - secret.yaml
# Override chart version so snapshots are stable across releases.
chart:
  version: "99.0.0"
  appVersion: "99.0.0"
tests:
  - it: should match snapshot
    set:
      jira:
        apiToken: jiraapitoken
    asserts:
      - matchSnapshot: {}

  - it: should not exist when using external secret
    set:
      jira:
        apiTokenFromSecret: my-jira-secret
    asserts:
      - hasDocuments:
          count: 0
