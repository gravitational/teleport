suite: Test configmap
templates:
  - configmap.yaml
# Override chart version so snapshots are stable across releases.
chart:
  version: "99.0.0"
  appVersion: "99.0.0"
tests:
  - it: should match the snapshot (smtp on)
    set:
      teleport:
        address: teleport.example.com:1234
      jira:
        url: https://jira.example.com
        username: user@example.com
        apiToken: examplejiratoken
        project: ACC
        Task: Bug
      http:
        listenAddress: ":1234"
        publicAddress: "jira-plugin.example.com"
        tlsFromSecret: "jira-tls-secret"

        basicAuth:
          user: "testuser"
          password: "testpassword"
      log:
        output: /var/log/teleport-jira.log
        severity: DEBUG
    asserts:
      - matchSnapshot: {}
