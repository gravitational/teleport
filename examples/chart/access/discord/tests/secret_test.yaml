suite: Test secret
templates:
  - secret.yaml
# Override chart version so snapshots are stable across releases.
chart:
  version: "99.0.0"
  appVersion: "99.0.0"
tests:
  - it: should contain the api key
    set:
      discord:
        token: mydiscordtoken
    asserts:
      - matchSnapshot: {}

  - it: should not exist when using external secret
    set:
      discord:
        tokenFromSecret: my-discord-secret
    asserts:
      - hasDocuments:
          count: 0
