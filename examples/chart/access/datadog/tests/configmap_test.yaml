suite: Test configmap
templates:
  - configmap.yaml
# Override chart version so snapshots are stable across releases.
chart:
  version: "99.0.0"
  appVersion: "99.0.0"
tests:
  - it: should match the snapshot
    set:
      teleport:
        address: teleport.example.com:1234
      datadog:
        apiEndpoint: https://api.datadoghq.com
        apiKey: test-api-key
        applicationKey: test-application-key
        fallbackRecipient: admin@example.com
        severity: SEV-3
      log:
        output: /var/log/teleport-datadog.log
        severity: DEBUG
    asserts:
      - matchSnapshot: {}

  - it: should render role_to_recipients entries when defined
    set:
      datadog:
        fallbackRecipient: admin@example.com
        roleToRecipients:
          prod-admin: ["sre-oncall", "security@example.com"]
    asserts:
      - matchRegex:
          path: data["teleport-datadog.toml"]
          pattern: '"\*" = \["admin@example\.com"\]'
      - matchRegex:
          path: data["teleport-datadog.toml"]
          pattern: '"prod-admin" = \["sre-oncall","security@example\.com"\]'

  - it: should omit the catch-all recipient when no fallback recipient is set
    set:
      datadog:
        fallbackRecipient: ""
        roleToRecipients:
          prod-admin: ["sre-oncall"]
    asserts:
      - notMatchRegex:
          path: data["teleport-datadog.toml"]
          pattern: '"\*" ='
      - matchRegex:
          path: data["teleport-datadog.toml"]
          pattern: '"prod-admin" = \["sre-oncall"\]'

  - it: should not contain annotations when not defined
    asserts:
      - isNull:
          path: metadata.annotations

  - it: should contain annotations when defined
    set:
      annotations:
        config:
          keyA: valA
          keyB: valB
    asserts:
      - equal:
          path: metadata.annotations
          value:
            keyA: valA
            keyB: valB
