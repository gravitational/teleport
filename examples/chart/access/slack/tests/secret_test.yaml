suite: Test secret
templates:
  - secret.yaml
# Override chart version so snapshots are stable across releases.
chart:
  version: "99.0.0"
  appVersion: "99.0.0"
tests:
  - it: should create bot oauth token with api key
    set:
      slack:
        token: myslacktoken
    asserts:
      - matchSnapshot: {}

  - it: should not create bot oauth token when using external secret
    set:
      slack:
        tokenFromSecret: my-slack-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: should not contain annotations when not defined
    asserts:
      - isNull:
          path: metadata.annotations

  - it: should contain annotations when defined
    set:
      annotations:
        secret:
          keyA: valA
          keyB: valB
    asserts:
      - equal:
          path: metadata.annotations
          value:
            keyA: valA
            keyB: valB
