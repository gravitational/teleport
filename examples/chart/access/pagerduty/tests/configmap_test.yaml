suite: Test deployment
templates:
  - configmap.yaml
# Override chart version so snapshots are stable across releases.
chart:
  version: "99.0.0"
  appVersion: "99.0.0"
tests:
  - it: should match the snapshot (smtp on)
    set:
      teleport:
        address: teleport.example.com:1234
      pagerduty:
        apiKey: test-api-key
        userEmail: example-user@example.com
      log:
        output: /var/log/teleport-pagerduty.log
        severity: DEBUG
    asserts:
      - matchSnapshot: {}
