suite: Test secret
templates:
  - secret.yaml
# Override chart version so snapshots are stable across releases.
chart:
  version: "18.0.0"
  appVersion: "18.0.0"
tests:
  - it: should contain the api key
    set:
      pagerduty:
        apiKey: mypagerdutyapikey
    asserts:
      - matchSnapshot: {}

  - it: should not exist when using external secret
    set:
      pagerduty:
        apiKeyFromSecret: my-pagerduty-secret
    asserts:
      - hasDocuments:
          count: 0
