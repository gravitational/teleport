apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    resources.teleport.dev/scoped: "false"
  name: teleportclassifiersv1.resources.teleport.dev
spec:
  group: resources.teleport.dev
  names:
    kind: TeleportClassifierV1
    listKind: TeleportClassifierV1List
    plural: teleportclassifiersv1
    shortNames:
    - classifierv1
    - classifiersv1
    singular: teleportclassifierv1
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: ClassifierV1 is the Schema for the classifiersv1 API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: Classifier resource definition v1 from Teleport
            properties:
              actions:
                description: Actions configures the effects of every match. Rules
                  can add to these effects but never remove them. If unset and no
                  rule applies, a match is only recorded on the stored session summary.
                nullable: true
                properties:
                  emit_audit_event:
                    description: EmitAuditEvent, if enabled, emits an audit event
                      when a session matches this classifier.
                    x-kubernetes-int-or-string: true
                  flag_for_review:
                    description: FlagForReview, if enabled, marks the session as needing
                      further review on match. Only applies to summaries that carry
                      an EnhancedSummary.
                    x-kubernetes-int-or-string: true
                  risk_level_floor:
                    description: RiskLevelFloor, if set, raises the session's risk
                      level (and risk score) to at least this level on match. It never
                      lowers the risk level. Leaving it unspecified means a match
                      does not change the risk level. Only applies to summaries that
                      carry an EnhancedSummary.
                    x-kubernetes-int-or-string: true
                type: object
              criteria:
                description: Criteria is a natural-language description of what this
                  classifier matches. It is evaluated by the inference model against
                  the session summary and, when available, the per-command analysis.
                type: string
              disabled:
                description: Disabled, if true, excludes the classifier from evaluation
                  without deleting it.
                type: boolean
              filter:
                description: Filter is an optional filter expression using Teleport
                  Predicate Language that selects the sessions this classifier applies
                  to. It supports the same language and matching context as the inference
                  policy filter, e.g., `equals(resource.metadata.labels["env"], "prod")`.
                  If empty, the classifier applies to all sessions of matching kinds.
                type: string
              kinds:
                description: Kinds are session kinds matched by this classifier, e.g.,
                  "ssh", "k8s", "db".
                items:
                  type: string
                nullable: true
                type: array
              rules:
                description: 'Rules escalate the response to a match for a subset
                  of sessions. A rule applies when the criteria matched and the rule''s
                  own filter and criteria both hold. The top-level actions and the
                  actions of every applicable rule combine: risk level floors combine
                  by taking the highest and toggles combine by OR, so a rule can only
                  add effects and order is not significant.'
                items:
                  properties:
                    actions:
                      description: Actions configures the additional effects of a
                        match to which this rule applies. They combine with the top-level
                        actions and with the actions of every other applicable rule.
                      nullable: true
                      properties:
                        emit_audit_event:
                          description: EmitAuditEvent, if enabled, emits an audit
                            event when a session matches this classifier.
                          x-kubernetes-int-or-string: true
                        flag_for_review:
                          description: FlagForReview, if enabled, marks the session
                            as needing further review on match. Only applies to summaries
                            that carry an EnhancedSummary.
                          x-kubernetes-int-or-string: true
                        risk_level_floor:
                          description: RiskLevelFloor, if set, raises the session's
                            risk level (and risk score) to at least this level on
                            match. It never lowers the risk level. Leaving it unspecified
                            means a match does not change the risk level. Only applies
                            to summaries that carry an EnhancedSummary.
                          x-kubernetes-int-or-string: true
                      type: object
                    criteria:
                      description: Criteria is an optional natural-language refinement
                        of the top-level criteria. It is evaluated by the inference
                        model in the same pass as the top-level criteria, and the
                        rule applies only if both match.
                      type: string
                    filter:
                      description: Filter is an optional filter expression using Teleport
                        Predicate Language that narrows the sessions this rule applies
                        to. It uses the same language and matching context as the
                        top-level filter and is evaluated in addition to it.
                      type: string
                    name:
                      description: Name identifies the rule. It must be unique within
                        the classifier and is recorded on the session summary when
                        the rule applies.
                      type: string
                  type: object
                nullable: true
                type: array
            type: object
          status:
            description: Status defines the observed state of the Teleport resource
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of an object's state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              teleportResourceID:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null
