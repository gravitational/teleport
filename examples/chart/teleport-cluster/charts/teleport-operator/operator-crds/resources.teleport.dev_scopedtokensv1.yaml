apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    resources.teleport.dev/scoped: "true"
  name: teleportscopedtokensv1.resources.teleport.dev
spec:
  group: resources.teleport.dev
  names:
    kind: TeleportScopedTokenV1
    listKind: TeleportScopedTokenV1List
    plural: teleportscopedtokensv1
    shortNames:
    - scopedtokenv1
    - scopedtokensv1
    singular: teleportscopedtokenv1
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Resource's scope.
      jsonPath: .scope
      name: scope
      type: string
    - description: The age of this resource
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: ScopedTokenV1 is the Schema for the scopedtokensv1 API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          scope:
            description: Scope is the scope of the token resource.
            type: string
            x-kubernetes-validations:
            - message: Scope is immutable. To create the resource in a different scope
                you must delete it first.
              rule: self == oldSelf
          spec:
            description: ScopedToken resource definition v1 from Teleport
            properties:
              assigned_scope:
                description: The scope to which this token is assigned.  Must be equivalent
                  or descendent to the scope of the token itself.
                type: string
              aws:
                description: The AWS-specific configuration used with the "ec2" and
                  "iam" join methods.
                nullable: true
                properties:
                  allow:
                    description: A list of Rules for allowing use of this token. A
                      node must match at least one allow rule in order to use this
                      token.
                    items:
                      properties:
                        aws_account:
                          description: The AWS account ID.
                          type: string
                        aws_arn:
                          description: The ARN of the joining identity for use with
                            the IAM join method. Supports wildcards "*" and "?".
                          type: string
                        aws_organization_id:
                          description: The organization ID that the joining AWS identity
                            must belong to when using the IAM join method.
                          type: string
                        aws_regions:
                          description: List of AWS regions a node is allowed to join
                            from when using the EC2 join method.
                          items:
                            type: string
                          nullable: true
                          type: array
                        aws_role:
                          description: The ARN of the role the Auth Service will assume
                            in order to call the EC2 API when using the EC2 join method.
                          type: string
                      type: object
                    nullable: true
                    type: array
                  iid_ttl:
                    description: The TTL to use for AWS EC2 Instance Identity Documents
                      used to join the cluster with this token. This should be a duration
                      string such as "8h" or "6mo".
                    type: string
                  integration:
                    description: Integration name which provides credentials for validating
                      join attempts. Currently only in use for validating the AWS
                      Organization ID in the IAM Join method.
                    type: string
                type: object
              azure:
                description: The Azure-specific configuration used with the "azure"
                  join method.
                nullable: true
                properties:
                  allow:
                    description: A list of Rules for allowing use of this token. A
                      node must match at least one allow rule in order to use this
                      token.
                    items:
                      properties:
                        resource_groups:
                          description: A list of Azure resource groups the node is
                            allowed to join from.
                          items:
                            type: string
                          nullable: true
                          type: array
                        subscription:
                          description: The Azure subscription.
                          type: string
                        tenant:
                          description: Tenant is the Azure Tenant ID.
                          type: string
                      type: object
                    nullable: true
                    type: array
                type: object
              azure_devops:
                description: The Azure Devops-specific configuration used with the
                  "azure_devops" join method.
                nullable: true
                properties:
                  allow:
                    description: A list of Rules for allowing use of this token. A
                      node must match at least one allow rule in order to use this
                      token.
                    items:
                      properties:
                        definition_id:
                          description: 'The ID of the AZDO pipeline definition. Example:
                            `1` Mapped from the `def_id` claim.'
                          type: string
                        pipeline_name:
                          description: 'The name of the AZDO pipeline. Example: `my-pipeline`.
                            Mapped out of the `sub` claim.'
                          type: string
                        project_id:
                          description: 'The ID of the AZDO pipeline. Example: `271ef6f7-0000-0000-0000-4b54d9129990`
                            Mapped from the `prj_id` claim.'
                          type: string
                        project_name:
                          description: 'The name of the AZDO project. Example: `my-project`.
                            Mapped out of the `sub` claim.'
                          type: string
                        repository_ref:
                          description: 'The reference of the repository the pipeline
                            is using. Example: `refs/heads/main`. Mapped from the
                            `rpo_ref` claim.'
                          type: string
                        repository_uri:
                          description: 'The URI of the repository the pipeline is
                            using. Example: `https://github.com/gravitational/teleport.git`.
                            Mapped from the `rpo_uri` claim.'
                          type: string
                        repository_version:
                          description: 'The individual commit of the repository the
                            pipeline is using. Example: `e6b9eb29a288b27a3a82cc19c48b9d94b80aff36`.
                            Mapped from the `rpo_ver` claim.'
                          type: string
                        sub:
                          description: 'The subject string that roughly uniquely identifies
                            the workload. Example: `p://my-organization/my-project/my-pipeline`
                            Mapped from the `sub` claim.'
                          type: string
                      type: object
                    nullable: true
                    type: array
                  organization_id:
                    description: The UUID of the Azure DevOps organization that this
                      join token will grant access to. This is used to identify the
                      correct issuer verification of the ID token. This is a required
                      field.
                    type: string
                type: object
              bitbucket:
                description: Configuration specific to the "bitbucket" join method.
                nullable: true
                properties:
                  allow:
                    description: A list of rules. Workloads trying to join must match
                      at least one allow rule for the join attempt to be allowed.
                    items:
                      properties:
                        branch_name:
                          description: The name of the branch on which this pipeline
                            executed.
                          type: string
                        deployment_environment_uuid:
                          description: The UUID of the deployment environment targeted
                            by this pipelines run, if any. These values may be found
                            in the "Pipelines -> OpenID Connect -> Deployment environments"
                            section of the repository settings.
                          type: string
                        repository_uuid:
                          description: The UUID of the repository for which this token
                            was issued. Bitbucket UUIDs must begin and end with braces,
                            e.g. `{...}`. This value may be found in the "Pipelines
                            -> OpenID Connect" section of the repository settings.
                          type: string
                        workspace_uuid:
                          description: The UUID of the workspace for which this token
                            was issued. This value may be found in the "Pipelines
                            -> OpenID Connect" section of the repository settings.
                          type: string
                      type: object
                    nullable: true
                    type: array
                  audience:
                    description: The Bitbucket-specified audience value for this token.
                      It is unique to each Bitbucket repository, and must be set to
                      the value as written in the "Pipelines -> OpenID Connect" section
                      of the repository settings.
                    type: string
                  identity_provider_url:
                    description: A Bitbucket-specified issuer URL for the incoming
                      OIDC tokens. It is unique to each Bitbucket repository, and
                      must be set to the value as written in the "Pipelines -> OpenID
                      Connect" section of the repository settings.
                    type: string
                type: object
              bot:
                description: The bot associated with this join token, if any, as a
                  scope-qualified name of the form `<scope>::<bot-name>` (e.g. "/staging/west::mybot").
                  The scope component must be a descendant of or equivalent to the
                  token's resource scope.  Mutually exclusive with assigned_scope.
                type: string
              bound_keypair:
                description: Configuration specific to the "bound_keypair" join method.
                nullable: true
                properties:
                  onboarding:
                    description: Parameters related to initial onboarding and keypair
                      registration.
                    nullable: true
                    properties:
                      initial_public_key:
                        description: The initial public key is used to preregister
                          a public key generated by `tbot keypair create`. When set,
                          no initial join secret is generated or made available for
                          use, and clients must have the associated private key available
                          to join. If set, `initial_join_secret` and `must_register_before`
                          are ignored. This value is written in SSH authorized_keys
                          format.
                        type: string
                      must_register_before:
                        description: An optional time before which registration via
                          registration join secret must be performed. Attempts to
                          register using a registration secret after this timestamp
                          will not be allowed. This may be modified after creation
                          if necessary to allow the initial registration to take place.
                          This value is ignored if `initial_public_key` is set.
                        format: date-time
                        type: string
                      registration_secret:
                        description: A secret that joining clients may use to register
                          their public key on first join, which may be used instead
                          of preregistering a public key with `initial_public_key`.
                          If `initial_public_key` is set, this value is ignored. Otherwise,
                          if set, this value will be used to populate `.status.bound_keypair.registration_secret`.
                          If unset and no `initial_public_key` is provided, a random
                          secure value will be generated server-side to populate the
                          status field.
                        type: string
                    type: object
                  recovery:
                    description: Parameters related to recovery after identity expiration,
                      including the initial join.
                    nullable: true
                    properties:
                      limit:
                        description: The maximum number of allowed recovery attempts.
                          This value may be raised or lowered after creation to allow
                          additional recovery attempts should the initial limit be
                          exhausted. If `mode` is set to `standard`, recovery attempts
                          will only be allowed if `.status.bound_keypair.recovery_count`
                          is less than this limit. This limit is not enforced if `mode`
                          is set to `relaxed` or `insecure`. This value must be at
                          least 1 to allow for the initial join during onboarding,
                          which counts as a recovery.
                        format: int32
                        type: integer
                      mode:
                        description: 'Mode sets the recovery rule enforcement mode.
                          It may be one of these values: - standard (or unset): all
                          configured rules enforced. The recovery limit and client
                          join state are required and verified. This is the most secure
                          recovery mode. - relaxed: recovery limit is not enforced,
                          but client join state is still required. This effectively
                          allows unlimited recovery attempts, but client join state
                          still helps mitigate stolen credentials. - insecure: neither
                          the recovery limit nor client join state are enforced. This
                          allows any client with the private key to join freely. This
                          is less secure, but can be useful in certain situations,
                          like in otherwise unsupported CI/CD providers. This mode
                          should be used with care, and RBAC rules should be configured
                          to heavily restrict which resources this identity can access.'
                        type: string
                    type: object
                  rotate_after:
                    description: An optional timestamp that forces clients to perform
                      a keypair rotation on the next join or recovery attempt after
                      the given date. If `LastRotatedAt` is unset or before this timestamp,
                      a rotation will be requested. It is recommended to set this
                      value to the current timestamp if a rotation should be triggered
                      on the next join attempt.
                    format: date-time
                    type: string
                type: object
              circleci:
                description: Configuration specific to the "circleci" join method
                nullable: true
                properties:
                  allow:
                    description: Allow is a list of TokenRules, nodes using this token
                      must match one allow rule to use this token. At least one rule
                      is required.
                    items:
                      properties:
                        context_id:
                          description: A unique context identifier. At least one of
                            context_id or project_id is required.
                          type: string
                        project_id:
                          description: A unique project identifier. At least one of
                            project_id or context_id is required.
                          type: string
                      type: object
                    nullable: true
                    type: array
                  organization_id:
                    description: The unique identifier of the organization. Required.
                    type: string
                type: object
              env0:
                description: Configuration specific to the "env0" join method.
                nullable: true
                properties:
                  allow:
                    description: A list of rules allowed by this token. Clients attempting
                      to join must present a JWT matching at least one of these rules.
                    items:
                      properties:
                        deployer_email:
                          description: The email of the person that triggered the
                            deployment, corresponding to `deployerEmail` in an Env0
                            OIDC token.
                          type: string
                        deployment_type:
                          description: The env0 deployment type, such as "deploy",
                            "destroy", etc. Corresponds to `deploymentType` in an
                            Env0 OIDC token.
                          type: string
                        env0_tag:
                          description: A custom tag value corresponding to the JWT's
                            `env0Tag` when `ENV0_OIDC_TAG` is set.
                          type: string
                        environment_id:
                          description: The unique identifier of the Env0 environment,
                            corresponding to `environmentId` in an Env0 OIDC token.
                          type: string
                        environment_name:
                          description: The name of the Env0 environment, corresponding
                            to `environmentName` in an Env0 OIDC token.
                          type: string
                        organization_id:
                          description: A unique organization identifier, corresponding
                            to `organizationId` in an Env0 OIDC token.
                          type: string
                        project_id:
                          description: A unique project identifier, corresponding
                            to `projectId` in an Env0 OIDC token.
                          type: string
                        project_name:
                          description: The name of the project under which the job
                            was run corresponding to `projectName` in an Env0 OIDC
                            token.
                          type: string
                        template_id:
                          description: The unique identifier of the Env0 template,
                            corresponding to `templateId` in an Env0 OIDC token.
                          type: string
                        template_name:
                          description: The name of the Env0 template, corresponding
                            to `templateName` in an Env0 OIDC token.
                          type: string
                        workspace_name:
                          description: The name of the Env0 workspace, corresponding
                            to `workspaceName` in an Env0 OIDC token.
                          type: string
                      type: object
                    nullable: true
                    type: array
                type: object
              gcp:
                description: The GCP-specific configuration used with the "gcp" join
                  method.
                nullable: true
                properties:
                  allow:
                    description: A list of Rules for allowing use of this token. A
                      node must match at least one allow rule in order to use this
                      token.
                    items:
                      properties:
                        locations:
                          description: A list of regions (e.g. "us-west1") and/or
                            zones (e.g. "us-west1-b").
                          items:
                            type: string
                          nullable: true
                          type: array
                        project_ids:
                          description: A list of project IDs (e.g. `<example-id-123456>`).
                          items:
                            type: string
                          nullable: true
                          type: array
                        service_accounts:
                          description: A list of service account emails (e.g. `<project-number>-compute@developer.gserviceaccount.com`).
                          items:
                            type: string
                          nullable: true
                          type: array
                      type: object
                    nullable: true
                    type: array
                type: object
              generic_oidc:
                description: Configuration specific to the "generic_oidc" join method.
                nullable: true
                properties:
                  allow_any:
                    description: Complex rules evaluated using "OR" semantics. If
                      any rules are specified, at least one rule must evaluate to
                      `true` for the join attempt/ to be allowed. These rules are
                      evaluated after `must_match_fields`, if any field matchers are
                      specified in that block.  Note that at least one rule, either
                      in `must_match_fields` or `allow_any`, must be specified for
                      any join attempts to succeed.
                    items:
                      properties:
                        conditions:
                          description: Conditions are simple eq/not_eq/in/not_in conditions
                            that check individual fields. All conditions must be satisfied
                            for a join attempt to be allowed. Mutually exclusive with
                            `expression`.
                          items:
                            properties:
                              attribute:
                                description: The name of the field this condition
                                  should check, separated by "." for nested fields.
                                type: string
                              eq:
                                description: An "equals" operator. Only one operator
                                  may be set within a condition.
                                nullable: true
                                properties:
                                  value:
                                    description: The value to compare the attribute
                                      against.
                                    type: string
                                type: object
                              in:
                                description: An "in" operator. Only one operator may
                                  be set within a condition.
                                nullable: true
                                properties:
                                  values:
                                    description: The list of values to compare the
                                      attribute against.
                                    items:
                                      type: string
                                    nullable: true
                                    type: array
                                type: object
                              not_eq:
                                description: A "not equals" operator. Only one operator
                                  may be set within a condition.
                                nullable: true
                                properties:
                                  value:
                                    description: The value to compare the attribute
                                      against.
                                    type: string
                                type: object
                              not_in:
                                description: A "not in" operator. Only one operator
                                  may be set within a condition.
                                nullable: true
                                properties:
                                  values:
                                    description: The list of values to compare the
                                      attribute against.
                                    items:
                                      type: string
                                    nullable: true
                                    type: array
                                type: object
                            type: object
                          nullable: true
                          type: array
                        expression:
                          description: 'A predicate expression that must evaluate
                            to `true` for the join attempt to be allowed. It is mutually
                            exclusive with `conditions`. TODO: Include name of variable
                            available to the expr in docs'
                          type: string
                      type: object
                    nullable: true
                    type: array
                  audience:
                    description: 'The expected JWT audience value (required). This
                      must match or be included in the list of `aud` values in the
                      JWT provided by the client when joining.  For providers that
                      do not allow you to configure this value yourself (this is technically
                      an OIDC spec violation, but is common), use the value they provide.
                      Otherwise, we recommend using a value that uniquely identifies
                      the Teleport cluster and join token. For example, you can use
                      this scheme: $clusterName/$tokenName  For a cluster named `example.teleport.sh`
                      and a token named `example`, this would result in an audience
                      of `example.teleport.sh/example`. If you prefer, you can also
                      use a UUID instead of the token name. Note that you will need
                      to configure the matching value with the issuer, usually at
                      request time.'
                    type: string
                  insecure_allow_http_issuer:
                    description: If set, disables the requirement that the issuer
                      must use HTTPS.
                    type: boolean
                  issuer:
                    description: The expected `iss` value as written in the JWT you
                      wish to trust. Unless `static_jwks` is configured, this issuer
                      must be accessible over HTTPS to the Teleport cluster and must
                      serve valid OIDC metadata, including discovery configuration
                      and JWKS keys.
                    type: string
                  must_match_fields:
                    description: '"Must match" fields perform simple comparison matches
                      using "AND" semantics. Rules are specified by mirroring the
                      structure of the JWT, using values that are expected to be equal
                      to those on the incoming token. These field matching rules can
                      only be used to compare simple values: strings, numbers, booleans,
                      and nested fields. Complex values, including lists, will need
                      to use `allow_any` expression rules instead.  If any field match
                      rules are specified, all must be equal to corresponding JWT
                      fields for the join attempt to succeed. If complex rules are
                      specified in `allow_any`, those are evaluated after `must_match_fields`.
                      If `must_match_fields` is not specified or is empty, only rules
                      in `allow_any` are evaluated.  These rules can be used as "global"
                      rules that apply to all join attempts. For example, you can
                      use these to ensure all attempts originate from your organization,
                      then use `allow_any` rules to allow individual repositories,
                      pipelines, or workspaces.  Note that at least one rule, either
                      in `must_match_fields` or `allow_any`, must be specified for
                      any join attempts to succeed.'
                    nullable: true
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  static_jwks:
                    description: An optional static JWKS value that can be used to
                      specify JWKS keys when either OIDC discovery is either not supported
                      by the provider or the discovery configuration is not accessible
                      to Teleport. When set, configuration and JWKS keys will not
                      be fetched from the URL contained in `issuer` and JWTs will
                      be validated using the key set specified here.
                    type: string
                  tls_ca:
                    description: A TLS CA certificate that should be used to verify
                      requests for OIDC metadata from the issuer instead of Teleport's
                      CA store, useful if the issuer is not public or otherwise uses
                      a self-signed certificate. If unset, the standard web PKI root
                      certificates will be used to verify the connection to the issuer
                      when fetching OIDC metadata. Note that this value only applies
                      to requests using this token, and will be used instead of and
                      not in addition to the system CA store, and will need to be
                      updated manually if the remote CA is updated.
                    type: string
                type: object
              github:
                description: Configuration specific to the "github" join method.
                nullable: true
                properties:
                  allow:
                    description: allow is a set of claim-matching fields evaluated
                      against the GitHub Actions OIDC token.
                    items:
                      properties:
                        actor:
                          description: 'actor is the personal account that initiated
                            the workflow run.  This field supports "glob-style" matching:
                            - Use ''*'' to match zero or more characters. - Use ''?''
                            to match any single character.'
                          type: string
                        enterprise:
                          description: enterprise name in which the repository is
                            stored.
                          type: string
                        enterprise_id:
                          description: enterprise_id in which the repository is stored.
                          type: string
                        environment:
                          description: 'environment name used by the job.  This field
                            supports "glob-style" matching: - Use ''*'' to match zero
                            or more characters. - Use ''?'' to match any single character.'
                          type: string
                        ref:
                          description: 'ref (git) that triggered the workflow run.  This
                            field supports "glob-style" matching: - Use ''*'' to match
                            zero or more characters. - Use ''?'' to match any single
                            character.'
                          type: string
                        ref_type:
                          description: 'ref_type for example: "branch".'
                          type: string
                        repository:
                          description: 'repository from where the workflow is running.
                            This includes the name of the owner e.g `gravitational/teleport`  This
                            field supports "glob-style" matching: - Use ''*'' to match
                            zero or more characters. - Use ''?'' to match any single
                            character.'
                          type: string
                        repository_owner:
                          description: 'repository_owner is the name of the organization
                            in which the repository is stored.  This field supports
                            "glob-style" matching: - Use ''*'' to match zero or more
                            characters. - Use ''?'' to match any single character.'
                          type: string
                        sub:
                          description: 'sub also known as Subject is a string that
                            roughly uniquely identifies the workload. The format of
                            this varies depending on the type of github action run.  This
                            field supports "glob-style" matching: - Use ''*'' to match
                            zero or more characters. - Use ''?'' to match any single
                            character.'
                          type: string
                        workflow:
                          description: 'workflow name.  This field supports "glob-style"
                            matching: - Use ''*'' to match zero or more characters.
                            - Use ''?'' to match any single character.'
                          type: string
                      type: object
                    nullable: true
                    type: array
                  enterprise_server_host:
                    description: enterprise_server_host allows joining from runners
                      associated with a GitHub Enterprise Server instance. When unconfigured,
                      tokens will be validated against github.com, but when configured
                      to the host of a GHES instance, then the tokens will be validated
                      against host.  This value should be the hostname of the GHES
                      instance, and should not include the scheme or a path. The instance
                      must be accessible over HTTPS at this hostname and the certificate
                      must be trusted by the Auth Service.
                    type: string
                  enterprise_slug:
                    description: enterprise_slug allows the slug of a GitHub Enterprise
                      organisation to be included in the expected issuer of the OIDC
                      tokens. This is for compatibility with the `include_enterprise_slug`
                      option in GHE.  This field should be set to the slug of your
                      enterprise if this is enabled. If this is not enabled, then
                      this field must be left empty. This field cannot be specified
                      if `enterprise_server_host` is specified.  See https://docs.github.com/en/enterprise-cloud@latest/actions/deployment/security-hardening-your-deployments/about-security-hardening-with-openid-connect#customizing-the-issuer-value-for-an-enterprise
                      for more information about customized issuer values.
                    type: string
                  static_jwks:
                    description: static_jwks disables fetching of the GHES signing
                      keys via the JWKS/OIDC endpoints, and allows them to be directly
                      specified. This allows joining from GitHub Actions in GHES instances
                      that are not reachable by the Teleport Auth Service.
                    type: string
                type: object
              gitlab:
                description: Configuration specific to the "gitlab" join method.
                nullable: true
                properties:
                  allow:
                    description: A set of claim-matching fields evaluated against
                      the GitLab CI token.
                    items:
                      properties:
                        ci_config_ref_uri:
                          description: The ref path to the top-level pipeline definition,
                            for example, gitlab.example.com/my-group/my-project//.gitlab-ci.yml@refs/heads/main.
                          type: string
                        ci_config_sha:
                          description: The git commit SHA for the ci_config_ref_uri.
                          type: string
                        deployment_tier:
                          description: The deployment tier of the environment the
                            job specifies
                          type: string
                        environment:
                          description: Limits access by the environment the job deploys
                            to (if one is associated)
                          type: string
                        environment_protected:
                          description: True if the Git ref is protected, false otherwise.
                          type: boolean
                        namespace_path:
                          description: 'Used to limit access to jobs in a group or
                            user''s projects. Example: `mygroup`  This field supports
