apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    resources.teleport.dev/scoped: "true"
  name: teleportscopedrolesv1.resources.teleport.dev
spec:
  group: resources.teleport.dev
  names:
    kind: TeleportScopedRoleV1
    listKind: TeleportScopedRoleV1List
    plural: teleportscopedrolesv1
    shortNames:
    - scopedrolev1
    - scopedrolesv1
    singular: teleportscopedrolev1
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Resource's scope.
      jsonPath: .scope
      name: scope
      type: string
    - description: The age of this resource
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: ScopedRoleV1 is the Schema for the scopedrolesv1 API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          scope:
            description: Scope is the scope of the role resource.
            type: string
            x-kubernetes-validations:
            - message: Scope is immutable. To create the resource in a different scope
                you must delete it first.
              rule: self == oldSelf
          spec:
            description: ScopedRole resource definition v1 from Teleport
            properties:
              app:
                description: The App Access specific configuration for a scoped role.
                nullable: true
                properties:
                  aws:
                    description: AWS contains the AWS configuration for the scoped
                      role.
                    nullable: true
                    properties:
                      role_arns:
                        description: RoleArns specifies the AWS role ARNs to allow
                          for this scoped app.
                        items:
                          type: string
                        nullable: true
                        type: array
                    type: object
                  client_idle_timeout:
                    description: Overrides the defaults block idle timeout specifically
                      for app sessions. Must be a valid Go duration string (e.g. "30m",
                      "1h"). If empty, the defaults block value (or global default)
                      applies.
                    type: string
                  disconnect_expired_cert:
                    description: DisconnectExpiredCert controls whether App sessions
                      are disconnected when the user certificate expires. If empty,
                      the defaults block value (or global default) applies.
                    type: boolean
                  label_expression:
                    description: LabelExpression is an optional predicate expression
                      evaluated against an application's labels.
                    type: string
                  labels:
                    description: The set of application labels used for RBAC.
                    items:
                      properties:
                        name:
                          description: The name of the label.
                          type: string
                        values:
                          description: The values associated with the label.
                          items:
                            type: string
                          nullable: true
                          type: array
                      type: object
                    nullable: true
                    type: array
                  lock:
                    description: Lock configures the role's locking behavior for app
                      sessions. If empty, the defaults block value (or global default)
                      applies.
                    nullable: true
                    properties:
                      mode:
                        description: 'Allowed values: strict or best_effort. Defaults
                          to value cluster wide auth preference if not set.'
                        type: string
                    type: object
                  resources:
                    description: Resources is a list of rules controlling access to
                      an app's resources on each HTTP request.  This version does
                      not implement app.resources on scoped roles and rejects a scoped
                      role that sets it to a non-empty list. An empty list is the
                      same as leaving the field unset. The field is declared so that
                      version skew or a rollback cannot silently drop it and widen
                      a role's access.
                    items:
                      properties:
                        allow_all:
                          description: AllowAll grants unrestricted access to every
                            path and method. It cannot be combined with any other
                            field.
                          type: boolean
                        allow_code:
                          description: AllowCode is the code recorded on the allow
                            audit event when the rule matches. If it is not set, no
                            allow audit event is recorded. A code may not start with
                            the reserved "teleport_" prefix.
                          type: string
                        allow_reason:
                          description: AllowReason is the explanation recorded alongside
                            AllowCode. A rule sets it only together with AllowCode.
                          type: string
                        allow_unsafe:
                          description: 'AllowUnsafe lists options that can extend
                            what the rule allows. They can be unsafe, so use them
                            with care. For example:  `paths: ["/api/v4/projects/{project}/**"]`
                            `allow_unsafe: {encoded: {project: "/"}}`  Set `encoded`
                            only for an application that reads the encoded slash (%2F)
                            as part of one path segment''s content and does not auto-decode
                            it to a literal /.'
                          nullable: true
                          properties:
                            encoded:
                              additionalProperties:
                                type: string
                              description: Encoded maps a capture name to the characters
                                a request path may contain in percent-encoded form
                                inside that captured segment. The only supported value
                                is "/", which allows the encoded slash (%2F or %2f).
                              nullable: true
                              type: object
                          type: object
                        deny_code_hint:
                          description: DenyCodeHint is the code added to the deny
                            decision when the rule's path and method match but the
                            Where predicate does not. A denied request collects a
                            code from every such rule, so one decision can record
                            several codes. A code may not start with the reserved
                            "teleport_" prefix.
                          type: string
                        deny_reason_hint:
                          description: DenyReasonHint is the explanation recorded
                            alongside DenyCodeHint. A rule sets it only together with
                            DenyCodeHint.
                          type: string
                        methods:
                          description: Methods are the HTTP methods the rule matches,
                            compared case-insensitively. A rule may list only GET,
                            HEAD, POST, PUT, PATCH, DELETE, and OPTIONS. An empty
                            list matches any of them.
                          items:
                            type: string
                          nullable: true
                          type: array
                        paths:
                          description: 'Paths are the path patterns the rule matches,
                            for example:  `paths: ["/api/projects/{project}/**"]`  The
                            `{project}` segment is captured, and the rule''s Where
                            reads it as `vars.project`. A rule sets either Paths or
                            AllowAll.'
                          items:
                            type: string
                          nullable: true
                          type: array
                        where:
                          description: 'Where is a predicate over the caller identity
                            and the rule''s path captures, for example matching a
                            captured project against a user''s traits:  `where: contains(user.traits["projects"],
                            vars.project)`'
                          type: string
                      type: object
                    nullable: true
                    type: array
                  resources_expressions:
                    description: ResourcesExpressions is a list of predicates controlling
                      access to an app's resources on each HTTP request. Every AppResource
                      rule can be written as an expression, but not the reverse.  This
                      version does not implement app.resources_expressions on scoped
                      roles and rejects a scoped role that sets it to a non-empty
                      list. An empty list is the same as leaving the field unset.
                      The field is declared so that version skew or a rollback cannot
                      silently drop it and widen a role's access.
                    items:
                      type: string
                    nullable: true
                    type: array
                type: object
              assignable_scopes:
                description: AssignableScopes is a list of scopes to which this role
                  can be assigned. If empty, defaults to being assignable at resource
                  scope and all descendants. Root scoped roles have no default and
                  must specify assignable scopes explicitly.
                items:
                  type: string
                nullable: true
                type: array
              defaults:
                description: Defaults specifies default values for controls common
                  across multiple protocols. If the same control specified in defaults
                  is also specified in a protocol block, the value in the protocol
                  block takes precedence.
                nullable: true
                properties:
                  client_idle_timeout:
                    description: ClientIdleTimeout sets the default idle timeout for
                      access sessions across all protocols that do not specify their
                      own value. Must be a valid Go duration string (e.g. "30m", "1h").
                      The cluster-wide default is used only when neither this nor
                      the protocol's equivalent control is set.
                    type: string
                  disconnect_expired_cert:
                    description: DisconnectExpiredCert defines the default behavior
                      of all protocols when certs expire for a session. The cluster-wide
                      default is used only when neither this nor the protocol's equivalent
                      control is set.
                    type: boolean
                  lock:
                    description: Lock specifies the default locking mode for access
                      sessions across all protocols that do not specify their own
                      value. The cluster-wide default is used only when neither this
                      nor the protocol's equivalent control is set.
                    nullable: true
                    properties:
                      mode:
                        description: 'Allowed values: strict or best_effort. Defaults
                          to value cluster wide auth preference if not set.'
                        type: string
                    type: object
                  session_recording:
                    description: SessionRecording configures the session recording
                      strategy for all protocols that don't explicitly set their session
                      recording mode. If neither this nor the protocol's equivalent
                      control is set, best_effort is used.
                    nullable: true
                    properties:
                      mode:
                        description: 'Mode sets the session recording mode. Allowed
                          values: strict or best_effort.'
                        type: string
                    type: object
                type: object
              evaluation:
                description: Evaluation groups role-level settings that govern how
                  a role is evaluated.
                nullable: true
                properties:
                  mode:
                    description: Mode determines the evaluation mode of the role.
                      Allowed values are 'inclusive' (default) and 'exclusive'. The
                      default inclusive mode allows permissions from multiple matching
                      roles to be combined. When a role is set to exclusive, the first
                      matching role fully determines all permissions and controls
                      for the access attempt.  Inclusive is easier to manage day to
                      day, but exclusive offers tighter control.
                    type: string
                type: object
              kube:
                description: The kubernetes specific configuration for a scoped role.
                nullable: true
                properties:
                  client_idle_timeout:
                    description: Overrides the defaults block idle timeout specifically
                      for kube sessions. Must be a valid Go duration string (e.g.
                      "30m", "1h"). If empty, the defaults block value (or global
                      default) applies.
                    type: string
                  disconnect_expired_cert:
                    description: DisconnectExpiredCert controls whether Kube sessions
                      are disconnected when the user certificate expires. If empty,
                      the defaults block value (or global default) applies.
                    type: boolean
                  groups:
                    description: The list of kubernetes groups this role allows.
                    items:
                      type: string
                    nullable: true
                    type: array
                  label_expression:
                    description: LabelExpression is an optional predicate expression
                      evaluated against a kubernetes server's labels.
                    type: string
                  labels:
                    description: The map of kubernetes cluster labels used for RBAC.
                    items:
                      properties:
                        name:
                          description: The name of the label.
                          type: string
                        values:
                          description: The values associated with the label.
                          items:
                            type: string
                          nullable: true
                          type: array
                      type: object
                    nullable: true
                    type: array
                  lock:
                    description: Lock configures the role's locking behavior for kubernetes
                      sessions. If empty, the defaults block value (or global default)
                      applies.
                    nullable: true
                    properties:
                      mode:
                        description: 'Allowed values: strict or best_effort. Defaults
                          to value cluster wide auth preference if not set.'
                        type: string
                    type: object
                  resources:
                    description: The kubernetes resources this role grants access
                      to.
                    items:
                      properties:
                        api_group:
                          description: The kube API group of the kube resource. It
                            supports wildcards.
                          type: string
                        kind:
                          description: The kube resource type.
                          type: string
                        name:
                          description: The kube resource name. It supports wildcards.
                          type: string
                        namespace:
                          description: The kube resource namespace. It supports wildcards.
                          type: string
                        verbs:
                          description: The allowed kube verbs for interacting with
                            the kube resource.
                          items:
                            type: string
                          nullable: true
                          type: array
                      type: object
                    nullable: true
                    type: array
                  users:
                    description: An optional list of impersonatable kubernetes users
                      this role allows.
                    items:
                      type: string
                    nullable: true
                    type: array
                type: object
              rules:
                description: Rules describes basic resource:verb permissions (e.g.
                  scoped_role:read).
                items:
                  properties:
                    resources:
                      description: Resources is a list of resource kinds (e.g. 'scoped_token')
                        that the below verbs apply to.
                      items:
                        type: string
                      nullable: true
                      type: array
                    verbs:
                      description: Verbs is the list of action verbs (e.g. 'read')
                        that apply to the above resources.
                      items:
                        type: string
                      nullable: true
                      type: array
                  type: object
                nullable: true
                type: array
              ssh:
                description: Ssh specifies controls that govern SSH access.
                nullable: true
                properties:
                  client_idle_timeout:
                    description: ClientIdleTimeout overrides the defaults block idle
                      timeout specifically for SSH sessions. Must be a valid Go duration
                      string (e.g. "30m", "1h"). If empty, the defaults block value
                      (or global default) applies.
                    type: string
                  disconnect_expired_cert:
                    description: DisconnectExpiredCert controls whether SSH sessions
                      are disconnected when the user certificate expires. If empty,
                      the defaults block value (or global default) applies.
                    type: boolean
                  enhanced_recording:
                    description: EnhancedRecording is the set of BPF events to record
                      for enhanced session recording.
                    nullable: true
                    properties:
                      command:
                        description: Command enables session.command in audit logs
                        type: boolean
                      disk:
                        description: Disk enables session.disk in audit logs
                        type: boolean
                      network:
                        description: Network enables session.network in audit logs
                        type: boolean
                    type: object
                  file_copy:
                    description: FileCopy indicates whether remote file operations
                      via SCP or SFTP are allowed over an SSH session. It defaults
                      to allowing the user to download and upload files by default.
                    type: boolean
                  forward_agent:
                    description: ForwardAgent enables SSH agent forwarding.
                    type: boolean
                  host_sudoers:
                    description: Sudoers is a list of entries to include in a users
                      sudoer file
                    items:
                      type: string
                    nullable: true
                    type: array
                  host_user_creation:
                    description: HostUserCreation configures the creation of host
                      users.
                    nullable: true
                    properties:
                      groups:
                        description: Groups is a list of host groups to add the user
                          to.
                        items:
                          type: string
                        nullable: true
                        type: array
                      mode:
                        description: Mode specifies how the host user should be created.
                        type: string
                      shell:
                        description: Shell is the shell to set for the user.
                        type: string
                    type: object
                  label_expression:
                    description: LabelExpression is an optional predicate expression
                      evaluated against an ssh node's labels.
                    type: string
                  labels:
                    description: Labels is the set of node labels used to dynamically
                      select which nodes this role applies to.
                    items:
                      properties:
                        name:
                          description: The name of the label.
                          type: string
                        values:
                          description: The values associated with the label.
                          items:
                            type: string
                          nullable: true
                          type: array
                      type: object
                    nullable: true
                    type: array
                  lock:
                    description: Lock configures the role's locking behavior for SSH
                      sessions. If empty, the defaults block value (or global default)
                      applies.
                    nullable: true
                    properties:
                      mode:
                        description: 'Allowed values: strict or best_effort. Defaults
                          to value cluster wide auth preference if not set.'
                        type: string
                    type: object
                  logins:
                    description: Logins is the list of OS logins this role permits
                      on matching nodes.
                    items:
                      type: string
                    nullable: true
                    type: array
                  max_sessions:
                    description: MaxSessions defines the maximum number of concurrent
                      sessions per connection.
                    format: int64
                    type: integer
                  permit_x11_forwarding:
                    description: PermitX11Forwarding, when true, authorizes use of
                      X11 forwarding over SSH sessions. If not set, X11 forwarding
                      is not permitted.
                    type: boolean
                  port_forwarding:
                    description: SSHPortForwarding configures what types of SSH port
                      forwarding are allowed by a role.
                    nullable: true
                    properties:
                      local:
                        description: Allow for local port forwarding.
                        nullable: true
                        properties:
                          enabled:
                            type: boolean
                        type: object
                      remote:
                        description: Allow for remote port forwarding.
                        nullable: true
                        properties:
                          enabled:
                            type: boolean
                        type: object
                    type: object
                  session_recording:
                    description: SessionRecording configures the session recording
                      strategy for SSH sessions.
                    nullable: true
                    properties:
                      mode:
                        description: 'Mode sets the session recording mode. Allowed
                          values: strict or best_effort.'
                        type: string
                    type: object
                type: object
              workload_identity:
                description: WorkloadIdentity specifies controls that govern issuance
                  using WorkloadIdentity resources.
                nullable: true
                properties:
                  labels:
                    description: Labels is the set of WorkloadIdentity labels used
                      to dynamically select which WorkloadIdentity resources this
                      role permits issuance with. Issuance additionally requires the
                      caller to hold read_no_secrets (and, for the multi-issue RPC,
                      list) rules for the workload_identity kind in the relevant scope.
                    items:
                      properties:
                        name:
                          description: The name of the label.
                          type: string
                        values:
                          description: The values associated with the label.
                          items:
                            type: string
                          nullable: true
                          type: array
                      type: object
                    nullable: true
                    type: array
                type: object
            type: object
          status:
            description: Status defines the observed state of the Teleport resource
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of an object's state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              teleportResourceID:
                format: int64
                type: integer
            type: object
        type: object
        x-kubernetes-validations:
        - message: Scope is immutable. To create the resource in a different scope
            you must delete it first.
          rule: has(self.scope) == has(oldSelf.scope)
    served: true
    storage: true
    subresources:
      status: {}
status:
  acceptedNames:
    kind: ""
    plural: ""
  conditions: null
  storedVersions: null
