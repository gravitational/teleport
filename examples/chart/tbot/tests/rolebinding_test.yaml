suite: Test RoleBinding
templates:
  - rolebinding.yaml
# Override chart version so snapshots are stable across releases.
chart:
  version: "99.0.0"
  appVersion: "99.0.0"
tests:
  - it: should match the snapshot (simple)
    values:
      - ../.lint/simple.yaml
    asserts:
      - matchSnapshot: {}
  - it: should match the snapshot (full)
    values:
      - ../.lint/full.yaml
    asserts:
      - matchSnapshot: {}
  - it: skips creation when explictely disabled
    set:
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0
