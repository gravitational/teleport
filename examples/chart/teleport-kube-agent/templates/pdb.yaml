{{- if .Values.highAvailability.podDisruptionBudget.enabled }}
{{- if .Capabilities.APIVersions.Has "policy/v1" }}
apiVersion: policy/v1
{{- else }}
apiVersion: policy/v1beta1
{{- end }}
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
{{- if .Values.extraLabels.podDisruptionBudget }}
  {{- toYaml .Values.extraLabels.podDisruptionBudget | nindent 4 }}
{{- end }}
spec:
  minAvailable: {{ .Values.highAvailability.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
{{- if not (has .Values.highAvailability.podDisruptionBudget.unhealthyPodEvictionPolicy (list "" "AlwaysAllow" "IfHealthyBudget")) }}
{{- fail "highAvailability.podDisruptionBudget.unhealthyPodEvictionPolicy must be one of: \"\", \"AlwaysAllow\", \"IfHealthyBudget\"" }}
{{- end }}
{{- if (not (empty .Values.highAvailability.podDisruptionBudget.unhealthyPodEvictionPolicy)) }}
{{- if (semverCompare "<1.27.0-0" .Capabilities.KubeVersion.Version) }}
{{- fail "highAvailability.podDisruptionBudget.unhealthyPodEvictionPolicy is not supported on Kubernetes <1.27.0-0. Set value to \"\" to omit." }}
{{- end }}
  unhealthyPodEvictionPolicy: {{ .Values.highAvailability.podDisruptionBudget.unhealthyPodEvictionPolicy }}
{{- end }}
{{- end }}
