{{- if .Values.highAvailability.podDisruptionBudget.enabled }}
{{- if .Capabilities.APIVersions.Has "policy/v1" }}
apiVersion: policy/v1
{{- else }}
apiVersion: policy/v1beta1
{{- end }}
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
{{- if .Values.extraLabels.podDisruptionBudget }}
  {{- toYaml .Values.extraLabels.podDisruptionBudget | nindent 4 }}
{{- end }}
spec:
  minAvailable: {{ .Values.highAvailability.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
{{- $unhealthyPodEvictionPolicy := .Values.highAvailability.podDisruptionBudget.unhealthyPodEvictionPolicy }}
{{- if not (has $unhealthyPodEvictionPolicy (list "" "auto" "AlwaysAllow" "IfHealthyBudget")) }}
{{- fail "highAvailability.podDisruptionBudget.unhealthyPodEvictionPolicy must be one of: \"\", \"auto\", \"AlwaysAllow\", \"IfHealthyBudget\"" }}
{{- end }}
{{- if or (has $unhealthyPodEvictionPolicy (list "AlwaysAllow" "IfHealthyBudget")) (and (eq $unhealthyPodEvictionPolicy "auto") (semverCompare ">=1.27.0-0" .Capabilities.KubeVersion.Version)) }}
  unhealthyPodEvictionPolicy: {{ ternary "AlwaysAllow" $unhealthyPodEvictionPolicy (eq $unhealthyPodEvictionPolicy "auto") }}
{{- end }}
{{- end }}
