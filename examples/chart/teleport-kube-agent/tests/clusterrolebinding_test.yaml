suite: ClusterRoleBinding
templates:
  - clusterrolebinding.yaml
# Override chart version so snapshots are stable across releases.
chart:
  version: "99.0.0"
  appVersion: "99.0.0"
tests:
  - it: creates a ClusterRoleBinding
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ClusterRoleBinding
      - matchSnapshot: {}

  - it: sets ClusterRoleBinding labels when specified
    values:
      - ../.lint/extra-labels.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: teleport-kube-agent
      - equal:
          path: metadata.labels.resource
          value: clusterrolebinding
      - matchSnapshot: {}
