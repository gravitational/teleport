suite: RoleBinding
templates:
  - rolebinding.yaml
# Override chart version so snapshots are stable across releases.
chart:
  version: "18.0.0"
  appVersion: "18.0.0"
tests:
  - it: Create a RoleBinding when upgrading
    release:
      upgrade: true
    set:
      unitTestUpgrade: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: RoleBinding

  - it: creates a RoleBinding
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: RoleBinding
      - matchSnapshot: {}

  - it: sets RoleBinding labels when specified
    values:
      - ../.lint/extra-labels.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: teleport-kube-agent
      - equal:
          path: metadata.labels.resource
          value: rolebinding
      - matchSnapshot: {}
