suite: PodDisruptionBudget
templates:
  - NOTES.txt
tests:
  - it: Warns when omitting non-empty unhealthyPodEvictionPolicy
    capabilities:
      majorVersion: 1
      minorVersion: 26
    values:
      - ../.lint/pdb.yaml
    set:
      highAvailability:
        podDisruptionBudget:
          unhealthyPodEvictionPolicy: AlwaysAllow
    asserts:
      - matchRegexRaw:
          pattern: WARNING

  - it: Does not warn when unhealthyPodEvictionPolicy is empty/omitted
    capabilities:
      majorVersion: 1
      minorVersion: 26
    values:
      - ../.lint/pdb.yaml
    set:
      highAvailability:
        podDisruptionBudget:
          unhealthyPodEvictionPolicy: ""
    asserts:
      - notMatchRegexRaw:
          pattern: WARNING

  - it: Does not warn when unhealthyPodEvictionPolicy is set on k8s 1.27
    capabilities:
      majorVersion: 1
      minorVersion: 27
    values:
      - ../.lint/pdb.yaml
    set:
      highAvailability:
        podDisruptionBudget:
          unhealthyPodEvictionPolicy: AlwaysAllow
    asserts:
      - notMatchRegexRaw:
          pattern: WARNING