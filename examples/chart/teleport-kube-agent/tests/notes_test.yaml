suite: Notes
templates:
  - NOTES.txt
tests:
  - it: warns when unhealthy pod eviction policy is probably unsupported
    capabilities:
      majorVersion: 1
      minorVersion: 26
    set:
      highAvailability:
        podDisruptionBudget:
          unhealthyPodEvictionPolicy: AlwaysAllow
    asserts:
      - matchRegexRaw:
          pattern: WARNING

  - it: warns when unhealthy pod eviction policy requires a feature gate
    capabilities:
      majorVersion: 1
      minorVersion: 26 
    set:
      highAvailability:
        podDisruptionBudget:
          unhealthyPodEvictionPolicy: AlwaysAllow
    asserts:
      - matchRegexRaw:
          pattern: WARNING

  - it: does not warn when unhealthy pod eviction policy is auto configured on Kubernetes 1.26
    capabilities:
      majorVersion: 1
      minorVersion: 26
    set:
      highAvailability:
        podDisruptionBudget:
          unhealthyPodEvictionPolicy: auto
    asserts:
      - notMatchRegexRaw:
          pattern: WARNING

  - it: does not warn when unhealthy pod eviction policy is omitted on Kubernetes 1.26
    capabilities:
      majorVersion: 1
      minorVersion: 26
    set:
      highAvailability:
        podDisruptionBudget:
          unhealthyPodEvictionPolicy: ""
    asserts:
      - notMatchRegexRaw:
          pattern: WARNING