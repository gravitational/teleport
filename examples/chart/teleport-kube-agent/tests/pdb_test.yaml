suite: PodDisruptionBudget
templates:
  - pdb.yaml
tests:
  - it: should create a PDB when enabled in values (pdb.yaml)
    values:
      - ../.lint/pdb.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodDisruptionBudget
      - matchSnapshot: {}

  - it: sets PodDisruptionBudget labels when specified
    values:
      - ../.lint/pdb.yaml
      - ../.lint/extra-labels.yaml
    asserts:
      - equal:
          path: metadata.labels.app\.kubernetes\.io/name
          value: teleport-kube-agent
      - equal:
          path: metadata.labels.resource
          value: poddisruptionbudget
      - matchSnapshot: {}

  - it: enables unhealthyPodEvictionPolicy automatically for k8s = 1.27
    capabilities:
      majorVersion: 1
      minorVersion: 27
    values:
      - ../.lint/pdb.yaml
    set:
      highAvailability:
        podDisruptionBudget:
          unhealthyPodEvictionPolicy: auto
    asserts:
      - equal:
          path: spec.unhealthyPodEvictionPolicy
          value: AlwaysAllow
      - matchSnapshot: {}

  - it: omits unhealthyPodEvictionPolicy for k8s < 1.27
    capabilities:
      majorVersion: 1
      minorVersion: 26 
    values:
      - ../.lint/pdb.yaml
    set:
      highAvailability:
        podDisruptionBudget:
          unhealthyPodEvictionPolicy: ""
    asserts:
      - isNull:
          path: spec.unhealthyPodEvictionPolicy
      - matchSnapshot: {}

  - it: renders an explicit unhealthyPodEvictionPolicy on k8s < 1.27
    capabilities:
      majorVersion: 1
      minorVersion: 26
    values:
      - ../.lint/pdb.yaml
    set:
      highAvailability:
        podDisruptionBudget:
          unhealthyPodEvictionPolicy: IfHealthyBudget
    asserts:
      - equal:
          path: spec.unhealthyPodEvictionPolicy
          value: IfHealthyBudget
      - matchSnapshot: {}

  - it: honors user-provided unhealthyPodEvictionPolicy
    capabilities:
      majorVersion: 1
      minorVersion: 27
    values:
      - ../.lint/pdb.yaml
    set:
      highAvailability:
        podDisruptionBudget:
          unhealthyPodEvictionPolicy: IfHealthyBudget
    asserts:
      - equal:
          path: spec.unhealthyPodEvictionPolicy
          value: IfHealthyBudget
      - matchSnapshot: {}
