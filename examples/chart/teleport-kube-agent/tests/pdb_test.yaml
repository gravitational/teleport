suite: PodDisruptionBudget
templates:
  - pdb.yaml
# Override chart version so snapshots are stable across releases.
chart:
  version: "99.0.0"
  appVersion: "99.0.0"
tests:
  - it: should create a PDB when enabled in values (pdb.yaml)
    values:
      - ../.lint/pdb.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodDisruptionBudget
      - matchSnapshot: {}

  - it: sets PodDisruptionBudget labels when specified
    values:
      - ../.lint/pdb.yaml
      - ../.lint/extra-labels.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: teleport-kube-agent
      - equal:
          path: metadata.labels.resource
          value: poddisruptionbudget
      - matchSnapshot: {}
