  ## Build
  - &env_value_rules
    path_regex: \.environments/stage/build/gpg-signing\.sops\.yaml
    # Don't invalidate the file if unencrypted content changes
    mac_only_encrypted: true
    # Input/output defaults for CLI piping
    input_type: yaml
    output_type: yaml
    # Keys
    age: age1draaeuw9qtg9rt69v4kn8mnu3kzl42snm6h85wfjsqxrtg6v4vls5zas3x
    kms: arn:aws:kms:us-west-2:603330915152:key/3ce72a8c-b9bb-40e5-9fee-a11ad82a0d2d
