# All environment value secrets should include the following age key
# for break-glass, emergency access in the event that the KMS key is
# deleted and nobody catches it in time. The private key is stored in
# the "Critical Infrastructure" 1password vault, under the name
# "Age key for release secrets". In the event of emergency, contact
# Roman, RJ, or Sasha for access to the key.
#
# Key: age1draaeuw9qtg9rt69v4kn8mnu3kzl42snm6h85wfjsqxrtg6v4vls5zas3x
