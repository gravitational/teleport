steps:
  - name: public.ecr.aws/gravitational/teleport-buildbox:teleport13
    id: pull-buildbox-image
    args: ["echo", "done"]

  - name: public.ecr.aws/gravitational/teleport-buildbox:teleport13
    id: checkout
    entrypoint: /bin/bash
    args:
      - "-c"
      - "go run .cloudbuild/ci/checkout.go -workspace=/tmp/teleport -target=$_BASE_BRANCH"

  - name: public.ecr.aws/gravitational/teleport-buildbox:teleport13
    id: lint
    dir: /tmp/teleport
    args: [ "make", "lint" ]

options:
  volumes:
    - name: oss_teleport
      path: /tmp/teleport

  machineType: 'E2_HIGHCPU_32'
