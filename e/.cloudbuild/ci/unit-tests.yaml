steps:
  - name: quay.io/gravitational/teleport-buildbox:go1.17.2
    id: pull-buildbox-image
    args: ["echo", "done"]

  - name: quay.io/gravitational/teleport-buildbox:go1.17.2
    id: checkout
    secretEnv:
      - WEBASSETS_DEPLOYMENT_KEY
    entrypoint: /bin/bash
    args:
      - "-c"
      - "go run .cloudbuild/ci/checkout.go -workspace=/tmp/teleport -target=$_BASE_BRANCH"

  # Run the unit tests. Actual content of this job depends on the changes 
  # detected in the PR
  - name: quay.io/gravitational/teleport-buildbox:go1.17.2
    id: run-tests
    dir: /tmp/teleport/.cloudbuild/scripts
    entrypoint: bash 
    args: 
      - -c
      - go run ./cmd/unit-tests -w=/tmp/teleport -t=$_BASE_BRANCH -c=HEAD
    timeout: 15m
      
availableSecrets:
  secretManager:
  - versionName: projects/771512790633/secrets/webassets-e-deployment-key/versions/2
    env: WEBASSETS_DEPLOYMENT_KEY

timeout: 20m

options:
  volumes:
    - name: oss_teleport
      path: /tmp/teleport

  machineType: 'E2_HIGHCPU_32'
  
