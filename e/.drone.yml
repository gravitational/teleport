kind: pipeline
type: kubernetes
name: push-build-linux-amd64-fips

environment:
  RUNTIME: go1.19.4
  UID: 1000
  GID: 1000

trigger:
  event:
    include:
      - push
    exclude:
      - pull_request
  branch:
    include:
      - master
