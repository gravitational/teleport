---
kind: pipeline
type: kubernetes
name: push-build-linux-amd64

environment:
  RUNTIME: go1.19.4
  UID: 1000
  GID: 1000

trigger:
  event:
    include:
      - push
    exclude:
      - pull_request
  branch:
    include:
      - master
      - branch/*
  repo:
    include:
      - gravitational/*

workspace:
  path: /go

clone:
  disable: true

steps:
  - name: Check out code
    image: docker:git
    environment:
      GITHUB_PRIVATE_KEY:
        from_secret: GITHUB_PRIVATE_KEY
    commands:
      - mkdir -p /go/src/github.com/gravitational/teleport/e /go/cache
      - cd /go/src/github.com/gravitational/teleport
      # check out teleport code from the matching upstream branch name
      # (this is the best indicator of the correct target branch)
      - |
        git init && git remote add origin https://github.com/gravitational/teleport
        git fetch origin +refs/heads/${DRONE_COMMIT_BRANCH}:
        git checkout ${DRONE_COMMIT_BRANCH}
      # write private key
      - mkdir -m 0700 /root/.ssh && echo -n "$GITHUB_PRIVATE_KEY" > /root/.ssh/id_rsa && chmod 600 /root/.ssh/id_rsa
      - ssh-keyscan -H github.com > /root/.ssh/known_hosts 2>/dev/null && chmod 600 /root/.ssh/known_hosts
      # do a recursive submodule checkout to get both webassets and webassets/e
      # this is allowed to fail because pre-4.3 Teleport versions don't use the webassets submodule
      - git submodule update --init --recursive webassets || true
      # now manually clone the teleport.e repo and check out the correct commit hash
      # this ensures that tests will run against the changed teleport.e code
      - cd /go/src/github.com/gravitational/teleport/e
      - |
        git init && git remote add origin ${DRONE_REMOTE_URL}
        git fetch origin
        git checkout -qf ${DRONE_COMMIT_SHA}
      - rm -f /root/.ssh/id_rsa

  - name: Build artifacts
    image: docker
    environment:
      UID: 1000
      GID: 1000
      GOCACHE: /go/cache
      GOPATH: /go
      OS: linux
      ARCH: amd64
    volumes:
      - name: dockersock
        path: /var/run
    commands:
      - apk add --no-cache make
      - chown -R $UID:$GID /go
      - cd /go/src/github.com/gravitational/teleport
      - make -C build.assets release OS=$OS ARCH=$ARCH

  - name: Send Slack notification
    image: plugins/slack
    settings:
      webhook:
        from_secret: SLACK_WEBHOOK_DEV_TELEPORT
      template: |
        *{{#success build.status}}✔{{ else }}✘{{/success}} {{ uppercasefirst build.status }}: Build #{{ build.number }}* (type: `{{ build.event }}`)
        `${DRONE_STAGE_NAME}` artifact build failed.
        *Warning:* This is a genuine failure to build the Teleport binary from `{{ build.branch }}` (likely due to a bad merge or commit) and should be investigated immediately.
        Commit: <https://github.com/{{ repo.owner }}/{{ repo.name }}/commit/{{ build.commit }}|{{ truncate build.commit 8 }}>
        Branch: <https://github.com/{{ repo.owner }}/{{ repo.name }}/commits/{{ build.branch }}|{{ repo.owner }}/{{ repo.name }}:{{ build.branch }}>
        Author: <https://github.com/{{ build.author }}|{{ build.author }}>
        <{{ build.link }}|Visit Drone build page ↗>
    when:
      status: [failure]

services:
  - name: Start Docker
    image: docker:dind
    privileged: true
    volumes:
      - name: dockersock
        path: /var/run

volumes:
  - name: dockersock
    temp: {}

