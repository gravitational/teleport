name: Unit Tests UI
run-name: Unit Tests UI - ${{ github.run_id }} - @${{ github.actor }}

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - 'web/**'
  workflow_call:
    inputs:
      oss-teleport-repo:
        description: "The name of the OSS teleport repo to build"
        required: false
        default: "gravitational/teleport"
        type: string

      oss-teleport-ref:
        description: 'Git SHA, tag or branch of the revision of OSS teleport to build'
        required: true
        default: 'master'
        type: string

jobs:
  test:
    name: Test UI
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout OSS Teleport
        uses: actions/checkout@v3
        with:
          repository: ${{ inputs.oss-teleport-repo }}
          ref: ${{ inputs.oss-teleport-ref }}

      - name: Checkout Enterprise Teleport
        uses: actions/checkout@v3
        with:
          path: e

      - name: Setup Node Toolchain
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install Yarn dependencies
        run: yarn

      - name: Run tests
        run: yarn test
