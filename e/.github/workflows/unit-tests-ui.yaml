name: Unit Tests UI
run-name: Unit Tests UI - ${{ github.run_id }} - @${{ github.actor }}

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - 'web/**'
  merge_group:

jobs:
  test:
    name: Test UI
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout OSS Teleport
        uses: actions/checkout@v4
        with:
          repository: gravitational/teleport
          ref: master

      - name: Checkout Enterprise Teleport
        uses: actions/checkout@v4
        with:
          path: e

      - name: Determine Toolchain Versions
        run: |
          echo NODE_VERSION=$(make -s -C build.assets print-node-version) >> $GITHUB_ENV

      - name: Print versions
        run: |
          echo "node: ${NODE_VERSION}"    

      - name: Setup Node Toolchain
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Yarn dependencies
        run: yarn

      - name: Run tests
        run: yarn test
