# Build Teleport Operator OCI images for amd64, arm64 and arm architectures.
name: Build Operator OCI Images
run-name: Build Operator OCI Images
on:
  workflow_call:
    inputs:
      oss-teleport-repo:
        description: |
          The name of the OSS teleport repo to checkout
        type: string
        default: "gravitational/teleport"

      oss-teleport-ref:
        description: |
          Git SHA, tag or branch of the revision of OSS teleport to build
        required: true
        type: string

      teleport-version:
        description: |
          The semver version of Teleport versionthat we're building for.
        type: string

      build-role-arn:
        description: |
          The ARN of the role used to store the resulting image(s) in ECR
        type: string
        default: arn:aws:iam::146628656107:role/teleport-oci-tag-build-gha

      dest-image-prefix:
        description: |
          Registry hostname and namespace prefix for where the built images will be pushed.
        type: string
        default: 146628656107.dkr.ecr.us-west-2.amazonaws.com/gravitational

      architectures:
        description:
          Space-separated list of architectures to build the image for. Must be Docker
          architectures - amd64, arm, arm64, etc.
        type: string
        default: "amd64 arm64 arm"

jobs:
  build-image:
    name: Build OCI Images
    runs-on: ubuntu-22.04-16core
    steps:
      - name: Checkout Teleport
        uses: gravitational/teleport.e/.github/actions/checkout-teleport@master
        with:
          oss-teleport-repo: ${{ inputs.oss-teleport-repo }}
          oss-teleport-ref: ${{ inputs.oss-teleport-ref }}
          edition: oss
          repo-access-app-id: ${{ secrets.DEPLOY_APP_ID }}
          repo-access-app-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}

      - name: Parameterize build
        id: params
        env:
          ARCHS: ${{ inputs.architectures }}
          VERSION: ${{ inputs.teleport-version }}
          IMAGE_PREFIX: ${{ inputs.dest-image-prefix }}
        run: |
          read -ra architectures <<<"${ARCHS}" # safely read into array to prevent globbing
          base_tag="${IMAGE_PREFIX}/teleport-operator:${VERSION}"
          printf -v platforms ',linux/%s' "${architectures[@]}"
          printf -v tags "${base_tag}-%s," "${architectures[@]}"
          tags+="${base_tag}"

          {
            echo "platforms=${platforms:1}"
            echo "tags=${tags}"
          } >> "$GITHUB_OUTPUT"

      # Log into Docker Hub to increase rate limits
      - name: Login to Docker Hub
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Assume Build AWS role
        uses: aws-actions/configure-aws-credentials@010d0da01d0b5a38af31e9c3470dbfdabdecca3a # v4.0.1
        with:
          aws-region: us-west-2
          role-to-assume: ${{ inputs.build-role-arn }}
          role-session-name: "gha-teleport-operator-oci-build-${{ github.run_number}}-${{ inputs.teleport-version }}"
          role-duration-seconds: 3600

      - name: Log into Destination ECR Registry
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Build OCI Image
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          push: true
          context: .
          file: ./integrations/operator/Dockerfile.gha
          platforms: ${{ steps.params.outputs.platforms }}
          tags: ${{ steps.params.outputs.tags }}
