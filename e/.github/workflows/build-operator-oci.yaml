# Build Teleport Operator OCI images for amd64, arm64 and arm architectures.
name: Build Operator OCI Images
run-name: Build Operator OCI Images
on:
  workflow_call:
    inputs:
      oss-teleport-repo:
        description: |
          The name of the OSS teleport repo to checkout
        type: string
        default: "gravitational/teleport"

      oss-teleport-ref:
        description: |
          Git SHA, tag or branch of the revision of OSS teleport to build
        required: true
        type: string

      teleport-version:
        description: |
          The semver version of Teleport version that we're building for.
        type: string

      architectures:
        description:
          Space-separated list of architectures to build the image for. Must be Docker
          architectures - amd64, arm, arm64, etc.
        type: string
        default: "amd64 arm64 arm"

      environment:
        description: GitHub environment to build in.
        type: string
        default: build-prod

jobs:
  build-image:
    name: Build OCI Images
    runs-on: ubuntu-22.04-16core
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout Teleport
        uses: gravitational/teleport.e/.github/actions/checkout-teleport@master
        with:
          oss-teleport-repo: ${{ inputs.oss-teleport-repo }}
          oss-teleport-ref: ${{ inputs.oss-teleport-ref }}
          edition: oss
          repo-access-app-id: ${{ secrets.DEPLOY_APP_ID }}
          repo-access-app-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}

      - name: Parameterize build
        id: params
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
          TELEPORT_VERSION: ${{ inputs.teleport-version || inputs.oss-teleport-ref }}
        run: |
          # Convert architectures into docker platform args
          read -ra arches <<<"${ARCHITECTURES}" # safely read into array to prevent globbing
          {
            echo 'platforms<<EOF'
            printf 'linux/%s\n' "${arches[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "teleport-version=${TELEPORT_VERSION#v}" >> "$GITHUB_OUTPUT"

      # Log into Docker Hub to increase rate limits
      - name: Login to Docker Hub
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Assume Build AWS role
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.BUILD_OPERATOR_OCI_AWS_ROLE }}
          role-session-name: "gha-build-operator-oci-${{ github.run_attempt }}"
          role-duration-seconds: 3600

      - name: Log into Destination ECR Registry
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@0d103c3126aa41d772a8362f6aa67afac040f80c # v3.1.0

      - name: Check if Image Exists
        id: check
        env:
          IMAGE: ${{ vars.OPERATOR_PENDING_ECR_REPO }}:${{ steps.params.outputs.teleport-version }}
        run: |
          if docker manifest inspect "${IMAGE}" >/dev/null 2>&1; then
            echo "Skipping build/push as image already exists: ${IMAGE}" >> "$GITHUB_STEP_SUMMARY"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build OCI Image
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@af5a7ed5ba88268d5278f7203fb52cd833f66d6e # v5.2.0
        with:
          push: true
          context: .
          file: ./integrations/operator/Dockerfile.gha
          platforms: ${{ steps.params.outputs.platforms }}
          tags: ${{ vars.OPERATOR_PENDING_ECR_REPO }}:${{ steps.params.outputs.teleport-version }}
