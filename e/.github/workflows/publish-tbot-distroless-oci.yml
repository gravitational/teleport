name: Publish Distroless Tbot Images
on:
  workflow_call:
    inputs:
      pending-registry:
        description: |
          Registry and namespace prefix for the repository holding the
          pending release images, formatted for use with Docker (that is,
          like an URI, not the AWS ARN).
        type: string
        default: 146628656107.dkr.ecr.us-west-2.amazonaws.com/gravitational

      release-source-tag:
        description: The semver version tag of the Teleport revision that we're building.
        type: string
        required: true

      promotion-role-arn:
        description: ARN of the role that grants promotion rights.
        type: string
        default: arn:aws:iam::146628656107:role/teleport-oci-promotion-gha

      validation-key-url:
        description: URL of the key used to validate internal Teleport images.
        type: string
        default: awskms:///arn:aws:kms:us-west-2:146628656107:alias/teleport-oci-pending-build-signing

      production-signing-key-url:
        description: URL of the key used to sign the production images as Official Teleport images.
        type: string
        default: awskms:///arn:aws:kms:us-west-2:146628656107:alias/teleport-oci-production-signing

      workflow-tag:
        description: Tag used to identify workflow runs spawned by this event.
        type: string

  # The workflow_dispatch event duplicates the workflow_call input parameters, without descriptions.
  workflow_dispatch:
    inputs:
      pending-registry:
        type: string
        default: 146628656107.dkr.ecr.us-west-2.amazonaws.com/gravitational
      release-source-tag:
        type: string
        required: true
      promotion-role-arn:
        type: string
        default: arn:aws:iam::146628656107:role/teleport-oci-promotion-gha
      validation-key-url:
        type: string
        default: awskms:///arn:aws:kms:us-west-2:146628656107:alias/teleport-oci-pending-build-signing
      production-signing-key-url:
        type: string
        default: awskms:///arn:aws:kms:us-west-2:146628656107:alias/teleport-oci-production-signing
      workflow-tag:
        type: string

run-name: 'Promote Tbot OCI images for ${{ inputs.release-source-tag }}'

jobs:
  configure:
    name: Configure Build
    runs-on: ubuntu-latest
    outputs:
      teleport-version: ${{ steps.version.outputs.full }}
      dest-image-tags: ${{ steps.version.outputs.labels }}
    steps:
      - name: ${{ inputs.workflow-tag }}
        if: inputs.workflow-tag != ''
        run: echo ${{ inputs.workflow-tag }}
      # Generates a list of tags that will be applied to the promoted image. In the
      # case of a "normal" release (identified by a version tag with no pre-release
      # suffix) the promoted image is assumed to take over all of the more-significant
      # release numbers, as well as its own (e.g 11.2.3 implies tags of 11 and 11.2).
      #
      # A version tag with a pre-release sufffix will only be promoted as itself, in
      # order to allow things like RCs and Betas to be promoted without overriding any
      # existing release.
      - name: Parse version
        id: version
        uses: gravitational/teleport.e/.github/actions/parse-version@master
        with:
          version: ${{ inputs.release-source-tag }}
  promote-images:
    needs: configure
    permissions:
      contents: read
      id-token: write  # required for aws-actions/configure-aws-credentials
    strategy:
      matrix:
        release: ['oss', 'fips']
        include:
          - release: 'fips'
            repo-infix: '-fips'
    uses: ./.github/workflows/oci-image-promote.yml
    with:
      pending-registry: ${{ inputs.pending-registry }}
      pending-repository: tbot${{ matrix.repo-infix }}-distroless
      pending-tag: ${{ needs.configure.outputs.teleport-version }}
      validation-key-url: ${{ inputs.validation-key-url }}
      production-registry: public.ecr.aws
      production-registry-region: us-east-1
      production-repository: gravitational/tbot${{ matrix.repo-infix }}-distroless
      production-tags: "${{ needs.configure.outputs.dest-image-tags }}"
      production-signing-key-url: ${{ inputs.production-signing-key-url }}
      promotion-role-arn: ${{ inputs.promotion-role-arn }}
