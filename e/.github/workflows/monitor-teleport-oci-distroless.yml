# Defines a workflow that scans all of the Major-Version Distroless Teleport 
# OCI container images with trivy and injects the scan results results into
# the teleport.e GitHub Security Tab
#
name: Monitor Teleport Distroless OCI Container Images

on:
  schedule:
    # Run daily at 7.17 am UTC. 7am UTC is 0:00 PDT, and the 17 
    # minute offset is not important; just a random offset to
    # stagger jobs.
    - cron: '17 7 * * *'

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        teleport-major-version: [13, 14, 15]
        arch: ['amd64', 'arm64']
        mode: ['debug', 'production']
        release: ['oss', 'enterprise', 'fips']
        include:
          - mode: 'production'
            repo-debug-suffix: ''
          - mode: 'debug'
            repo-debug-suffix: '-debug'
          - release: 'oss'
            repo-enterprise-infix: ''
          - release: 'enterprise'
            repo-enterprise-infix: '-ent'
          - release: 'fips'
            repo-enterprise-infix: '-ent-fips'
    permissions:
      actions: read
      contents: read
      security-events: write  # to upload SARIF results
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          image-ref: 'public.ecr.aws/gravitational/teleport${{ matrix.repo-enterprise-infix }}-distroless${{ matrix.repo-debug-suffix }}:${{ matrix.teleport-major-version }}'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'teleport-distroless-${{ matrix.release }}-${{ matrix.arch }}-${{ matrix.mode }}-v${{ matrix.teleport-major-version }}'
