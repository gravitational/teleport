name: Flaky Tests Detector
run-name: Flaky Tests Detector - ${{ github.run_id }} - @${{ github.actor }}

on:
  pull_request:

permissions:
  pull-requests: read
  issues: read

jobs:
  flaky-test:
    name: Flaky Tests Detector
    if: ${{ !startsWith(github.head_ref, 'dependabot/') }}
    runs-on: ubuntu-22.04-16core

    permissions:
      contents: read
      packages: read
      id-token: write # required for AWS credentials

    container:
      image: ghcr.io/gravitational/teleport-buildbox:teleport19
      options: --cap-add=SYS_ADMIN --privileged

    steps:
      - name: Checkout Teleport
        uses: gravitational/teleport.e/.github/actions/checkout-teleport@master
        with:
          oss-teleport-ref: ${{ github.base_ref }}
          edition: enterprise
          ent-teleport-ref: ${{ github.event.pull_request.head.ref }}
          ent-fetch-depth: 0

      - name: Generate GitHub Token
        id: generate_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.REVIEWERS_APP_ID }}
          private-key: ${{ secrets.REVIEWERS_PRIVATE_KEY }}

      - name: Checkout shared-workflows
        uses: actions/checkout@v4
        with:
          repository: gravitational/shared-workflows
          path: .github/shared-workflows
          ref: dd8f30e8fd5dd1d1655b9d27049e5d0f6f4f9ef2 # workflows/v0.0.3

      - name: Find excluded tests
        id: find_excluded
        run: cd .github/shared-workflows/bot && go run main.go -workflow=exclude-flakes -token="${{ steps.generate_token.outputs.token }}" -reviewers="${{ secrets.reviewers }}"

      - name: Run base difftest
        uses: ./.github/actions/difftest
        with:
          flags: --skip="${{ steps.find_excluded.outputs.FLAKE_SKIP }}" -e "lib/operatortest/**/*" -e "tooling/**/*" -e "tests/integration/**/*"
          target: test-go
          path: .
          directory: e

      - name: Upload test metrics
        if: always()
        continue-on-error: true # Do not fail the workflow
        uses: ./e/.github/actions/upload-test-metrics
