name: Build Teleport Spacelift Runner Images
on:
  workflow_dispatch:
    inputs: 
      oss-teleport-repo:
        description: |
          The name of the OSS teleport repo to checkout
        required: false
        type: string
        default: "gravitational/teleport"

      oss-teleport-ref:
        description: |
          Git SHA, tag or branch of the revision of OSS teleport to build
        required: true
        type: string

      source-tag:
        description: |
          The semver version of Teleport that we're building for. If not set 
          will be inferred from the `oss-teleport-ref` by assuming that it's
          a standard Teleport release tag in the form vX.Y.Z.
        type: string
        default: ""

      build-role-arn:
        description: |
          The ARN of the role used to sign and store the resulting image(s) in
          ECR
        required: true
        type: string
        default: arn:aws:iam::146628656107:role/teleport-oci-tag-build-gha

      signing-key-url:
        description: |
          URL of the KMS key used to sign the resulting images. Must be
          readable from the role specified by `build-role-arn`.
        required: true
        type: string
        default: awskms:///arn:aws:kms:us-west-2:146628656107:alias/teleport-oci-pending-build-signing

      dest-repo-prefix:
        description: |
          Registry and namespace prefix for the destination repository,
          formatted for use with Docker (that is, like a URI, not the AWS
          ARN). 
        type: string
        required: true
        default: 146628656107.dkr.ecr.us-west-2.amazonaws.com/gravitational

      workflow-tag:
        description: |
          Tag used to identify workflow runs spawned by this event
        type: string
        default: ""

run-name: Build Images for Teleport Spacelift Runner ${{ inputs.source-tag }}

jobs:
  identity:
    runs-on: ubuntu-latest
    if: inputs.workflow-tag != ''
    steps:
      - name: ${{ inputs.workflow-tag }}
        run: echo ${{ inputs.workflow-tag }}

  configure:
    name: Configure Build
    runs-on: ubuntu-latest
    outputs:
      teleport_version: ${{ steps.version.outputs.teleport_version }}
      buildbox: ${{ steps.get-buildbox.outputs.buildbox }}
      base_image: ${{ steps.get-base-image.outputs.base_image }}
    steps:
      - name: Parse version tag
        id: version
        env:
          VERSION: ${{ inputs.source-tag || inputs.oss-teleport-ref }}
        run: echo "teleport_version=${VERSION#v}" >> "$GITHUB_OUTPUT"
      - name: Checkout OSS Teleport
        uses: gravitational/teleport.e/.github/actions/checkout-teleport@master
        with:
          oss-teleport-repo: ${{ inputs.oss-teleport-repo }}
          oss-teleport-ref: ${{ inputs.oss-teleport-ref }}
          edition: oss
          repo-access-app-id: ${{ secrets.DEPLOY_APP_ID }}
          repo-access-app-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
      - name: Get buildbox image ref
        id: get-buildbox
        run: |
          BUILDBOX="$(make -s -C ./build.assets/ show-buildbox-centos7-image)"
          echo "buildbox: $BUILDBOX"
          echo "buildbox=$BUILDBOX" >> $GITHUB_OUTPUT
      - name: Get base image ref
        id: get-base-image
        run: |
          BASE_IMAGE="$(make -s -C ./integrations/teleport-spacelift-runner show-base-image)"
          echo "base_image: $BASE_IMAGE"
          echo "base_image=$BASE_IMAGE" >> $GITHUB_OUTPUT

  build-docker-images:
    name: Build OCI container images
    needs: configure
    permissions:
      id-token: write  # required for aws-actions/configure-aws-credentials
      security-events: write  # required for trivy scan
      contents: read
      actions: read
    uses: ./.github/workflows/oci-image-build.yml
    with:
      # Integrations don't have an enterprise version
      teleport-release: oss
      base-image: ${{ needs.configure.outputs.base_image }}
      skip-base-image-verify: true
      oss-teleport-repo: ${{ inputs.oss-teleport-repo }}
      oss-teleport-ref: ${{ inputs.oss-teleport-ref }}
      source-tag: ${{ inputs.source-tag }}
      teleport-version: ${{ needs.configure.outputs.teleport_version }}
      dest-image-registry: ${{ inputs.dest-repo-prefix }}
      dest-image-repo: teleport-spacelift-runner
      dest-image-tags: ${{ needs.configure.outputs.teleport_version }}
      build-role-arn: ${{ inputs.build-role-arn }}
      signing-key-url: ${{ inputs.signing-key-url }}
      allow-overwrites: false
      image-build-args: |
        BUILDBOX=${{ needs.configure.outputs.buildbox }}
      image-build-context: ./teleport/.
      image-build-dockerfile: ./integrations/teleport-spacelift-runner/Dockerfile
    secrets:
      deploy-access-app-id: ${{ secrets.DEPLOY_APP_ID }}
      deploy-access-app-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
