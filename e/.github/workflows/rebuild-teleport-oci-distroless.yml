# Defines a workflow that, given a major version of Teleport:
#  1. Finds the newest released version of that series of Teleport
#  2. Rebuilds all the distroless oci container images for that
#     build of Teleport, and
#  3. Pushes them to production
#
# This is intended to be run on a schedule from a parent workflow.

name: Rebuild Distroless OCI Image
on:
  workflow_dispatch:
    inputs:
      oss-teleport-repo:
        description: |
          The name of the OSS teleport repo to checkout
        required: false
        type: string
        default: "gravitational/teleport"

      teleport-release-tag:
        description: |
          The semver version of the teleport release to rebuild, including
          the leading `v`
        type: string

      slack-notify-channel:
        description: The slack channel ID of where to send failure notifications.
        type: string
        default: C0351AUPJ8K # internal-tools

      environment:
        description: |
          GitHub Actions environment in which to run the rebuild. Can be either
          `stage/oci-rebuild` or `prod/oci-rebuild`.
        type: string
        default: stage/oci-rebuild

  workflow_call:
    inputs:
      oss-teleport-repo:
        description: |
          The name of the OSS teleport repo to checkout
        required: false
        type: string
        default: "gravitational/teleport"

      teleport-release-tag:
        description: |
          The semver version of the teleport release to rebuild, including
          the leading `v`
        type: string

      slack-notify-channel:
        description: The slack channel ID of where to send failure notifications.
        type: string
        default: C0351AUPJ8K # internal-tools

      environment:
        description: |
          GitHub Actions environment in which to run the rebuild. Can be either
          `stage/oci-rebuild` or `prod/oci-rebuild`.
        type: string
        default: stage/oci-rebuild

run-name: Rebuild Distroless Images for Teleport ${{ inputs.teleport-release-tag }}

jobs:
  configure:
    name: Configure Build
    runs-on: ubuntu-latest
    outputs:
      teleport_version: ${{ steps.version.outputs.full }}
      image_tags: ${{ steps.version.outputs.labels }}
    steps:
      - name: Parse version
        id: version
        uses: gravitational/teleport.e/.github/actions/parse-version@master
        with:
          version: ${{ inputs.teleport-release-tag }}

  rebuild-image:
    name: Rebuild OCI container images for ${{ inputs.teleport-release-tag }}
    needs: configure
    permissions:
      id-token: write  # required for aws-actions/configure-aws-credentials
      contents: read
      actions: read
    strategy:
      max-parallel: 2 # temp limit until we get limits increased on teleport-prod
      matrix:
        mode: ['debug', 'production']
        release: ['oss', 'enterprise', 'fips']
        include:
          # This is the default architecture set for all matrix items unless
          # specified.
          - architectures: |
              arm
              arm64
              amd64

          - mode: 'production'
            base-image: 'gcr.io/distroless/cc-debian12:latest'
            repo-debug-suffix: ''
          - mode: 'debug'
            base-image: 'gcr.io/distroless/cc-debian12:debug'
            repo-debug-suffix: '-debug'

          - release: 'oss'
            repo-enterprise-infix: ''
          - release: 'enterprise'
            repo-enterprise-infix: '-ent'
          # FIPS release is currently amd64 and arm64-only
          - release: 'fips'
            repo-enterprise-infix: '-ent-fips'
            dockerfile-suffix: '-fips'
            architectures: |
              amd64
              arm64

    uses: ./.github/workflows/oci-image-build.yml
    with:
      teleport-release: ${{ matrix.release }}
      base-image: ${{ matrix.base-image }}
      oss-teleport-repo: ${{ inputs.oss-teleport-repo }}
      oss-teleport-ref: ${{ inputs.teleport-release-tag }}
      source-tag: ${{ inputs.teleport-release-tag }}
      teleport-version: ${{ needs.configure.outputs.teleport_version }}
      dest-image-registry-region: us-east-1
      dest-image-repo: teleport${{ matrix.repo-enterprise-infix }}-distroless${{ matrix.repo-debug-suffix }}
      dest-image-tags: ${{ needs.configure.outputs.image_tags }}
      environment: ${{ inputs.environment }}
      image-build-args: |
        TELEPORT_VERSION=${{ needs.configure.outputs.teleport_version }}
      image-build-dockerfile: Dockerfile-distroless${{ matrix.dockerfile-suffix }}
      architectures: ${{ matrix.architectures }}
    secrets:
      deploy-access-app-id: ${{ secrets.DEPLOY_APP_ID }}
      deploy-access-app-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}

  slack-on-fail:
    runs-on: ubuntu-latest
    needs:
      - configure
      - rebuild-image
    if: always()
    steps:
      - name: Slack Notify Failure
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.TOOLING_ALERTS_SLACK_TOKEN }}
          payload: |
            {
              "channel": "${{ inputs.slack-notify-channel }}",
              "username": "OCI Rebuild",
              "text": "*OCI Rebuild failure*",
              "mrkdwn": true,
              "parse": "none",
              "unfurl_links": false,
              "unfurl_media": false,
              "attachments": [
                {
                  "color": "danger",
                  "title": "OCI Rebuild for ${{ inputs.teleport-release-tag }} failed",
                  "title_link": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              ]
            }
