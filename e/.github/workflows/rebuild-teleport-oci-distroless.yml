# Defines a workflow that, given a major version of Teleport:
#  1. Finds the newest released version of that series of Teleport
#  2. Rebuilds tall the dostroless oci container images for that 
#     build of Teleport, and
#  3. Pushes them to production
#
# This is intended to be run on a schedule from a parent workflow.

name: Rebuild Distroless OCI Image
on:
  workflow_dispatch:
    inputs: 
      oss-teleport-repo:
        description: |
          The name of the OSS teleport repo to checkout
        required: false
        type: string
        default: "gravitational/teleport"

      teleport-release-tag:
        description: |
          The semver version of the teleport release to rebuild, including
          the leading `v`
        type: string

      artifact-storage-bucket-name:
        description: |
          Name of the S3 bucket holding the debian package artifacts
          built by Drone
        required: true
        type: string
        default: dronestorage.gravitational.io

      artifact-storage-access-role-arn:
        description: |
          ARN of the role used to access the artifact storage bucket, for 
          retreiving artifacts built by Drone.
        required: true
        type: string
        default: arn:aws:iam::126027368216:role/tf-teleport-oci-tag-build-gha

      promote-role-arn:
        description: |
          The ARN of the role used to sign and store the resulting image(s) in
          the public ECR
        required: true
        type: string
        default: arn:aws:iam::146628656107:role/teleport-oci-promotion-gha

      signing-key-url:
        description: |
          URL of the KMS key used to sign the resulting images. Must be
          readable from the role specified by `build-role-arn`.
        required: true
        type: string
        default:  awskms:///arn:aws:kms:us-west-2:146628656107:alias/teleport-oci-production-signing

      dest-registry:
        description: |
          Registry and namespace prefix for the destination repository,
          formatted for use with Docker (that is, like a URI, not the AWS
          ARN). 
        type: string
        required: true
        default: public.ecr.aws

run-name: Rebuild Distroless Images for Teleport ${{ inputs.teleport-release-tag }}

jobs:
  configure:
    name: Configure Build
    runs-on: ubuntu-latest
    outputs:
      teleport_version: ${{ steps.version.outputs.full }}
      image_tags: ${{ steps.tags.outputs.tags  }}
    steps:
      - name: Parse version tag
        id: version
        shell: bash
        run: |
          version=${{ inputs.teleport-release-tag }}
          version="${version#v}"

          if ! [[ "${version}" =~ [^0-9]*([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.+-]+)? ]]; then
                  echo bad version
                  exit 1
          fi

          set -- "${BASH_REMATCH[@]:1}" # get regex groups as $1, $2, ... etc
          echo full=${version} >> $GITHUB_OUTPUT
          echo major=$1 >> $GITHUB_OUTPUT
          echo minor=$2 >> $GITHUB_OUTPUT
          echo patch=$3 >> $GITHUB_OUTPUT
          echo prerelease=$4 >> $GITHUB_OUTPUT

      - name: Generate image tags
        id: tags
        shell: bash
        run: |
          tags="${{ steps.version.outputs.major }}"
          tags+="  ${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}"
          tags+="  ${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}.${{ steps.version.outputs.patch }}"
          echo tags=$tags >> $GITHUB_OUTPUT

  rebuild-image:
    name: Rebuild OCI container images for ${{ inputs.teleport-release-tag }}
    needs: configure
    permissions:
      id-token: write  # required for aws-actions/configure-aws-credentials
      security-events: write # required for trivy scan
      contents: read
      actions: read
    strategy:
      matrix:
        mode: ['debug', 'production']
        release: ['oss', 'enterprise', 'fips']
        include:
          # This is the default architecture set for all matrix items unless
          # specified.
          - architectures: |
              arm
              arm64
              amd64

          - mode: 'production'
            base-image: 'gcr.io/distroless/cc-debian12:latest'
            repo-debug-suffix: ''
          - mode: 'debug'
            base-image: 'gcr.io/distroless/cc-debian12:debug'
            repo-debug-suffix: '-debug'

          - release: 'oss'
            repo-enterprise-infix: ''
          - release: 'enterprise'
            repo-enterprise-infix: '-ent'            
          # FIPS release is currently amd64 and arm64-only
          - release: 'fips'
            repo-enterprise-infix: '-ent-fips'
            architectures: |
              amd64
              arm64

    uses: ./.github/workflows/oci-image-build.yml
    with:
      teleport-release: ${{ matrix.release }}
      base-image: ${{ matrix.base-image }}
      oss-teleport-repo: ${{ inputs.oss-teleport-repo }}
      oss-teleport-ref: ${{ inputs.teleport-release-tag }}
      dronestorage-bucket-name: ${{ inputs.artifact-storage-bucket-name }}
      dronestorage-access-role-arn: ${{ inputs.artifact-storage-access-role-arn }}
      source-tag: ${{ inputs.teleport-release-tag }}
      teleport-version: ${{ needs.configure.outputs.teleport_version }}
      dest-image-registry: ${{ inputs.dest-registry }}
      dest-image-registry-region: us-east-1
      dest-image-repo: gravitational/teleport${{ matrix.repo-enterprise-infix }}-distroless${{ matrix.repo-debug-suffix }}
      dest-image-tags: ${{ needs.configure.outputs.image_tags }}
      build-role-arn: ${{ inputs.promote-role-arn }}
      signing-key-url: ${{ inputs.signing-key-url }}
      image-build-args: |
        TELEPORT_VERSION=${{ needs.configure.outputs.teleport_version }}
      scan-image: false
      architectures: ${{ matrix.architectures }}
    secrets:
      deploy-access-app-id: ${{ secrets.DEPLOY_APP_ID }}
      deploy-access-app-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
