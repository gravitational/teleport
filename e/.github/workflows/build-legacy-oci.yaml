# Build Teleport Debian-based legacy OCI images for OSS, Enterprise and FIPS.

name: Build legacy OCI Images
on:
  workflow_call:
    inputs:
      oss-teleport-repo:
        description: |
          The name of the OSS teleport repo to checkout
        type: string
        default: "gravitational/teleport"

      oss-teleport-ref:
        description: |
          Git SHA, tag or branch of the revision of OSS teleport to build
        required: true
        type: string

      teleport-version:
        description: |
          The semver version of Teleport versionthat we're building for.
        type: string

      environment:
        description: |
          GitHub Actions environment in which to run the build. Should be either
          `build` or `promote`.
        type: string
        default: promote

jobs:
  build-image:
    name: Build OCI Images
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ARCHITECTURES: 'amd64 arm64 arm'
      FIPS_ARCHITECTURES: 'amd64'
      OSS_TAG: ${{ vars.ECR_PRIVATE_REGISTRY }}/gravitational/teleport:${{ inputs.teleport-version }}
      ENT_TAG: ${{ vars.ECR_PRIVATE_REGISTRY }}/gravitational/teleport-ent:${{ inputs.teleport-version }}
      FIPS_TAG: ${{ vars.ECR_PRIVATE_REGISTRY }}/gravitational/teleport-ent:${{ inputs.teleport-version }}-fips
    steps:
      - name: Parameterize build
        id: params
        run: |
          # Convert architectures into docker platform args using multiline outputs to
          # be used as the `platform` arg to docker build:
          # platforms<<EOF
          # linux/amd64
          # linux/arm64
          # linux/arm
          # EOF
          # fips-platforms<<EOF
          # linux/amd64
          # EOF
          read -ra arches <<<"${ARCHITECTURES}"
          read -ra fips_arches <<<"${FIPS_ARCHITECTURES}"
          {
            echo 'platforms<<EOF'
            printf 'linux/%s\n' "${arches[@]}"
            echo 'EOF'
            echo 'fips-platforms<<EOF'
            printf 'linux/%s\n' "${fips_arches[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Checkout Teleport
        uses: gravitational/teleport.e/.github/actions/checkout-teleport@master
        with:
          oss-teleport-repo: ${{ inputs.oss-teleport-repo }}
          oss-teleport-ref: ${{ inputs.oss-teleport-ref }}
          edition: oss
          repo-access-app-id: ${{ secrets.DEPLOY_APP_ID }}
          repo-access-app-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}

      - name: Assume artifact download role
        uses: aws-actions/configure-aws-credentials@010d0da01d0b5a38af31e9c3470dbfdabdecca3a # v4.0.1
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.ARTIFACT_DOWNLOAD_AWS_ROLE }}
          role-session-name: "gha-teleport-oci-legacy-download-${{ github.run_number}}-${{ inputs.teleport-version }}"
          role-duration-seconds: 3600

      - name: Download Teleport deb artifacts
        env:
          S3_PATH: s3://${{ vars.ARTIFACT_SOURCE_BUCKET }}/teleport/tag/${{ inputs.teleport-version }}
          VERSION: ${{ inputs.teleport-version }}
        run: |
          mkdir ./build

          read -ra arches <<<"${ARCHITECTURES}"
          for arch in "${arches[@]}"; do
            aws s3 cp "${S3_PATH}/teleport_${VERSION}_${arch}.deb" ./build
            aws s3 cp "${S3_PATH}/teleport-ent_${VERSION}_${arch}.deb" ./build
          done

          read -ra fips_arches <<<"${FIPS_ARCHITECTURES}"
          for arch in "${fips_arches[@]}"; do
            aws s3 cp "${S3_PATH}/teleport-ent_${VERSION}-fips_${arch}.deb" ./build
          done

      # Log into Docker Hub to increase rate limits
      - name: Login to Docker Hub
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Assume Build AWS role
        uses: aws-actions/configure-aws-credentials@010d0da01d0b5a38af31e9c3470dbfdabdecca3a # v4.0.1
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.OCI_TAG_BUILD_AWS_ROLE }}
          role-session-name: "gha-teleport-oci-legacy-build-${{ github.run_number}}-${{ inputs.teleport-version }}"
          role-duration-seconds: 3600

      - name: Log into Destination ECR Registry
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Build OSS OCI Multi-arch Image
        uses: docker/build-push-action@4a13e500e55cf31b7a5d59a38ab2040ab0f42f56 # v5.1.0
        with:
          push: true
          context: ./build
          file: ./build.assets/charts/Dockerfile
          target: teleport
          platforms: ${{ steps.params.outputs.platforms }}
          tags: ${{ env.OSS_TAG }}
          build-args: |
            DEB_BASE=teleport_${{ inputs.teleport-version }}

      - name: Push OSS OCI Single-arch Images
        env:
          IMAGE: ${{ env.OSS_TAG }}
        run: |
          read -ra arches <<<"${ARCHITECTURES}"
          for arch in "${arches[@]}"; do
            docker pull --platform "linux/${arch}" "${IMAGE}"
            docker tag "${IMAGE}" "${IMAGE}-${arch}"
            docker push "${IMAGE}-${arch}"
          done

      - name: Build Enterprise OCI Multi-arch Image
        uses: docker/build-push-action@4a13e500e55cf31b7a5d59a38ab2040ab0f42f56 # v5.1.0
        with:
          push: true
          context: ./build
          file: ./build.assets/charts/Dockerfile
          target: teleport
          platforms: ${{ steps.params.outputs.platforms }}
          tags: ${{ env.ENT_TAG }}
          build-args: |
            DEB_BASE=teleport-ent_${{ inputs.teleport-version }}

      - name: Push Enterprise OCI Single-arch Images
        env:
          IMAGE: ${{ env.ENT_TAG }}
        run: |
          read -ra arches <<<"${ARCHITECTURES}"
          for arch in "${arches[@]}"; do
            docker pull --platform "linux/${arch}" "${IMAGE}"
            docker tag "${IMAGE}" "${IMAGE}-${arch}"
            docker push "${IMAGE}-${arch}"
          done

      - name: Build Enterprise FIPS OCI Multi-arch Image
        uses: docker/build-push-action@4a13e500e55cf31b7a5d59a38ab2040ab0f42f56 # v5.1.0
        with:
          push: true
          context: ./build
          file: ./build.assets/charts/Dockerfile
          target: teleport-fips
          platforms: ${{ steps.params.outputs.fips-platforms }}
          tags: ${{ env.FIPS_TAG }}
          build-args: |
            DEB_BASE=teleport-ent_${{ inputs.teleport-version }}-fips

      - name: Push Enterprise FIPS OCI Single-arch Images
        env:
          IMAGE: ${{ env.FIPS_TAG }}
        run: |
          read -ra fips_arches <<<"${FIPS_ARCHITECTURES}"
          for arch in "${fips_arches[@]}"; do
            docker pull --platform "linux/${arch}" "${IMAGE}"
            docker tag "${IMAGE}" "${IMAGE}-${arch}"
            docker push "${IMAGE}-${arch}"
          done
