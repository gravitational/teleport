name: Build multiarch buildbox images
run-name: Build multiarch buildbox images
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BUILDBOX_PREFIX: ghcr.io/gravitational

jobs:
  build-base:
    name: Build centos7 devtoolset buildbox images

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - arch: arm
            runner: 
              group: prod
              labels: ['self-hosted', 'linux', 'arm64']
            platform: linux/arm/v7
          - arch: arm64
            runner: 
              group: prod
              labels: ['self-hosted', 'linux', 'arm64']
            platform: linux/arm64
          - arch: 386
            runner: ubuntu-latest
            platform: linux/386
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout OSS Teleport
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # We need to keep env vars in sync, so, we can't use standard build actions
      - name: Build & push buildbox image
        run: |
          make -C build.assets PLATFORM=${{ matrix.platform }} ARCH=${{ matrix.arch }} build-multiarch

      - name: Docker push the latest built image
        run: docker push $(docker images -a --format '{{.Repository}}:{{.Tag}}'| head -1)
