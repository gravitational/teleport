---
name: Deploy OS packages to repos
run-name: Deploy OS packages to ${{ inputs.repo-type }} repos

on:
  workflow_dispatch:
    inputs:
      repo-type:
        description: "The type of OS package repo that the package should be deployed to"
        required: true
        type: choice
        options:
          - apt
          - yum
      environment:
        description: "Environment to deploy the package to"
        type: environment
        required: true
      package-name-filter:
        description: "Filter that limits what packages will be deployed. This is evalulated in a shell context, applied following the s3 sync include rules."
        default: "*"
        type: string
        required: true
      artifact-tag:
        description: "The tag associated with the artifact to deploy (eg. v1.2.3)"
        type: string
        required: true
      version-channel:
        description: "The version channel of the repos that the artifacts should be added to. Semver values will be truncated to major version. Examples: \"v1.2.3\" (truncated to \"v1\"), \"cloud\"."
        type: string
        required: true
      # This is here to facilitate the addition of new release channels when/if the OPRT supports them
      release-channel:
        description: "The release channel that the artifact should be deployed to"
        type: choice
        required: true
        options:
          - stable
        default: stable
      package-to-test:
        description: "The package to install and test during the smoke test"
        type: string
        required: false
      do-teleport-package-tests:
        description: "True if Teleport-specific smoke tests should be run, false otherwise"
        type: boolean
        required: true
        default: true
      # This is a workaround so that the actor who initiated a workflow run via a workflow dispatch event can determine the run ID of the started workflow run
      workflow-tag:
        description: "This field adds the provided value to a run step, allowing the calling actor to associate the started run with the GHA run ID."
        type: string
        required: false

jobs:
  determine-runner:
    name: Determine what runner the job should be sent to
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.output-step.outputs.runner }}
    steps:
      - name: Set the label output
        id: output-step
        env:
          RUNNER_GROUP: prod
          REPO_TYPE: ${{ inputs.repo-type }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          case "$ENVIRONMENT" in
            "promote" | "production")
              RUNNER_LABEL_ENVIRONMENT="prod"
            ;;
            "build" | "staging")
              RUNNER_LABEL_ENVIRONMENT="dev"
            ;;
            *)
              echo "Unknown environment '$ENVIRONMENT', aborting"
              exit 1
            ;;
          esac

          # The runner group in the label value is due to a very "interesting" decision by GH. See
          # https://github.com/gravitational/cloud-terraform/pull/2693 for details.
          RUNNER_LABEL="$REPO_TYPE-$RUNNER_LABEL_ENVIRONMENT-runner-$RUNNER_GROUP"
          # This "--arg" arg is a bit verbose but is the JQ recommended way of passing environment
          # variables to ensure that they are properly JSON escaped
          # x64 arch is required because the Aptly repo does not support arm64/other ISAs
          RUNNER="$(\
            jq --compact-output --null-input \
            --arg RUNNER_LABEL "$RUNNER_LABEL" \
            '{"labels": ["self-hosted", "x64", $RUNNER_LABEL]}' \
          )"
          echo "runner=$RUNNER" >> "$GITHUB_OUTPUT"
          {
            echo "### Runner target" 
            echo '```json'
            echo "$RUNNER" | jq .
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: ${{ inputs.workflow-tag }}
        run: |
          # This is a do-nothing step so that agents calling this workflow can identify the run ID associated
          # with the run they started

  deploy:
    name: Deploy packages to ${{ inputs.repo-type }} repo
    # Note that the value of this string is arbitrary as long as it contains the `${{ inputs.repo-type }}`
    # and `${{ inputs.environment }}` expressions
    concurrency:
      group: Only allow a single ${{ inputs.repo-type }} package deployment at a time for ${{ inputs.environment }}
      cancel-in-progress: false
    timeout-minutes: 2880 # 2 days. Value is set this high for DR but in most cases should not be needed.
    needs:
      - determine-runner
    permissions:
      contents: read
      id-token: write   # Required for aws-actions/configure-aws-credentials
    environment: ${{ inputs.environment }}
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    outputs:
      # This is the actual name of the version channel used in the repo component. It's calculated here and
      # used when installing pacakges for smoke tests.
      component-version-channel: ${{ steps.component-version-channel.outputs.component-version-channel }}
    env:
      TOOL_BINARY_PATH: os-package-repo-tool
      DOWNLOAD_DIRECTORY: /tmp/artifacts
      GNUPGHOME: /tmp/gnupg
      CACHE_PATH: /mnt/oprt-cache
    steps:
      - name: Disallow prerelease artifacts from being deployed to production repos
        if: inputs.environment == 'production' || inputs.environment == 'promote'
        uses: actions/github-script@v6
        with: 
          script: |
            if ("${{ inputs.artifact-tag }}".indexOf("-") > -1)
              core.setFailed("Prerelease artifacts may not be deployed to production repos");
      - name: Derive and set version channel
        id: component-version-channel
        if: inputs.package-to-test != ''
        env:
          # This is copy/pasted from https://semver.org/#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
          # with the addition of "v?" to match Teleport's tag naming scheme
          SEMVER_TAG_REGEX: ^v?(?P<major>0|[1-9]\d*)\.(?P<minor>0|[1-9]\d*)\.(?P<patch>0|[1-9]\d*)(?:-(?P<prerelease>(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+(?P<buildmetadata>[0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
          VERSION_CHANNEL: ${{ inputs.version-channel }}
        run: |
          # Check if the artifact version is a semver
          if echo "$VERSION_CHANNEL" | grep --perl-regexp --quiet "$SEMVER_TAG_REGEX"; then
            # Ensure exactly one "v" prefix exists, and trim the first '.' and everything after
            echo "component-version-channel=$(echo "v${VERSION_CHANNEL#v}" | sed -e 's/\..*//')" >> "$GITHUB_OUTPUT"
            exit
          fi

          # If not a semver (such as when it's set to "cloud")
          echo "component-version-channel=$VERSION_CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Derive and set repo type-specific variables for APT
        if: inputs.repo-type == 'apt'
        run: |
          echo "PACKAGE_TYPE=deb" >> "$GITHUB_ENV"
          echo "BUCKET_NAME=${{ vars.APT_S3_BUCKET }}" >> "$GITHUB_ENV"
          echo "TOOL_ARGUMENTS=-aptly-root-dir $CACHE_PATH/aptly" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_AWS_ROLE=${{ vars.APT_DEPLOYMENT_AWS_ROLE }}" >> "$GITHUB_ENV"
          echo "CLOUDFRONT_DISTRIBUTION=${{ vars.APT_CLOUDFRONT_DISTRIBUTION }}" >> "$GITHUB_ENV"
      - name: Derive and set repo type-specific variables for YUM
        if: inputs.repo-type == 'yum'
        run: |
          echo "PACKAGE_TYPE=rpm" >> "$GITHUB_ENV"
          echo "BUCKET_NAME=${{ vars.YUM_S3_BUCKET }}" >> "$GITHUB_ENV"
          echo "TOOL_ARGUMENTS=-cache-dir $CACHE_PATH/createrepo -repo-domain-name ${{ vars.YUM_REPO_BASE_DOMAIN_NAME }}" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_AWS_ROLE=${{ vars.YUM_DEPLOYMENT_AWS_ROLE }}" >> "$GITHUB_ENV"
          echo "CLOUDFRONT_DISTRIBUTION=${{ vars.YUM_CLOUDFRONT_DISTRIBUTION }}" >> "$GITHUB_ENV"
      - name: Log set variables
        run: |
          echo "Set variables:"
          env
      - name: Log general runner information
        run: |
          echo "OS info:"
          cat /etc/os-release
          uname -a

          echo
          echo "EC2 instance info:"
          TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
          curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/dynamic/instance-identity/document

          echo
          echo
          echo "APT repo info:"
          sudo apt update

          echo
          echo "Disk info:"
          df -hT
      # Future TODO package the tool as an action or separate workflow
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version-file: "./tooling/os-package-repo-tool/go.mod"
          cache-dependency-path: "./tooling/os-package-repo-tool/go.sum"
          check-latest: true
      - name: Log installed Go version
        run: go version
      - name: Build tool
        run: |
          sudo apt install -y gcc
          CGO_ENABLED=1 go build -race -o "$(pwd)/$TOOL_BINARY_PATH" -C "./tooling/os-package-repo-tool/" "./src/"
      - name: Install the required runtime dependencies
        run: |
          # Exit on error, and error on unset vars
          set -o errexit
          set -o nounset

          # Createrepo
          sudo apt install -y createrepo-c

          # Verify the install
          createrepo_c --version

          # GPG >=2.2
          sudo apt satisfy -y "gnupg2 (>= 2.2)"

          # Verify the install
          gpg --version

          # Aptly
          # The version available from Ubuntu repos is old, so install it based on Aptly docs here
          APTLY_KEYRING_PATH="/usr/share/keyrings/aptly-archive-keyring.asc"
          APTLY_DOMAIN_NAME="repo.aptly.info"
          sudo curl -s https://www.aptly.info/pubkey.txt -o "$APTLY_KEYRING_PATH"
          # Note that the Aptly repo does not appear to support HTTPS
          echo "deb [signed-by=$APTLY_KEYRING_PATH] http://$APTLY_DOMAIN_NAME squeeze main" \
            | sudo tee /etc/apt/sources.list.d/aptly.list > /dev/null
          # Ensure that Aptly is always installed from Aptly repo rather than Ubuntu repos
          cat << EOF | sudo tee /etc/apt/preferences.d/aptly
          Package: aptly
          Pin: origin $APTLY_DOMAIN_NAME
          Pin-Priority: 900
          EOF
          sudo apt update
          sudo apt install -y aptly bzip2

          # Verify the install
          aptly version

          # AWS CLI
          # Ubuntu 22.04 latest version of the CLI is v1, so v2 is installed manually based on the AWS docs
          # Download the release
          AWSCLI_DOWNLOAD_PATH="/tmp/awscli.zip"
          curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "$AWSCLI_DOWNLOAD_PATH"

          # Extract and install
          EXTRACT_DIR="/tmp/awscli-extract"
          unzip "$AWSCLI_DOWNLOAD_PATH" -d "$EXTRACT_DIR"
          sudo "$EXTRACT_DIR/aws/install"

          # Cleanup
          rm -rf "$AWSCLI_DOWNLOAD_PATH" "$EXTRACT_DIR"

          # Verify the install
          aws --version

      # Download the artifacts
      - name: Assume AWS role for downloading the artifacts
        uses: aws-actions/configure-aws-credentials@010d0da01d0b5a38af31e9c3470dbfdabdecca3a # v4.0.1
        with:
          role-skip-session-tagging: true
          aws-region: us-west-2
          role-to-assume: ${{ vars.ARTIFACT_DOWNLOAD_AWS_ROLE }}
          role-session-name: "gha-oprt-artifact-download-${{ github.run_number }}"
          role-duration-seconds: 900
      - name: Define the version number used in the artifact download key
        run: |
          echo "Setting artifact download version..."
          FULL_TAG="${{ inputs.artifact-tag }}"
          echo "ARTIFACT_DOWNLOAD_VERSION=${FULL_TAG#v}" | tee -a "$GITHUB_ENV"
      - name: Download artifacts to the download directory
        run: |
          echo "Creating download directory..."
          mkdir -pv "$DOWNLOAD_DIRECTORY"

          FILTER="${{ inputs.package-name-filter }}.${PACKAGE_TYPE}*"
          S3_PATH="s3://${{ vars.ARTIFACT_SOURCE_BUCKET }}/teleport/tag/${ARTIFACT_DOWNLOAD_VERSION}/"
          echo
          echo "Downloading files matching '$FILTER' from '$S3_PATH' to '$DOWNLOAD_DIRECTORY'..."
          aws s3 sync --no-progress --delete --exclude "*" --include "$FILTER" "$S3_PATH" "$DOWNLOAD_DIRECTORY"

          echo
          echo "Downloaded files:"
          ls -lAht "$DOWNLOAD_DIRECTORY"

          # Record packages for job summary
          echo "PACKAGES<<EOF" >> "$GITHUB_ENV"
          ls "$DOWNLOAD_DIRECTORY"/*.${PACKAGE_TYPE} >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

          echo ""
          [ "$(ls -A "$DOWNLOAD_DIRECTORY")" ] && echo "Found $(ls -lA | wc -l) artifacts for $ARTIFACT_DOWNLOAD_VERSION" || (echo "No artifacts found for $ARTIFACT_DOWNLOAD_VERSION!"; exit 1)
      # Publish the package
      - name: Assume AWS role for deploying ${{ inputs.repo-type }} artifacts
        uses: aws-actions/configure-aws-credentials@010d0da01d0b5a38af31e9c3470dbfdabdecca3a # v4.0.1
        with:
          role-skip-session-tagging: true
          aws-region: us-west-2
          role-to-assume: ${{ env.DEPLOYMENT_AWS_ROLE }}
          role-session-name: "gha-os-package-repo-tool-deploy-${{ github.run_number }}"
          role-duration-seconds: 3600  # 1 hour, the max that the Terraform module allows. DR takes a long time (6 hrs+) so this will cause DR to fail the first time.
      - name: Setup GPG signing key
        uses: ./.github/actions/load-gpg-key
        with:
          gpg-signing-archive: ${{ secrets.GPG_SIGNING_ARCHIVE }}
          gnupghome: ${{ env.GNUPGHOME }}
      - name: Ensure the environment cache path exists
        run: |
          OWNER="$(id -un):$(id -gn)"
          echo "Creating the ${{ inputs.environment }} environment cache path at $CACHE_PATH, owned by $OWNER"
          mkdir -pv -m0770 "$CACHE_PATH"
          sudo chown -v "$OWNER" "$CACHE_PATH"

          # Clear out files to trigger DR
          # Do not uncomment this unless you know what you are doing!
          # rm -rf "$CACHE_PATH"/*
      - name: Publish the ${{ inputs.artifact-tag }} version artifacts to the ${{ inputs.repo-type }} repo in ${{ inputs.environment }} environment
        env:
          LOG_LEVEL: 6
        run: >
            "./$TOOL_BINARY_PATH" ${{ inputs.repo-type }}
            -bucket "$BUCKET_NAME"
            -local-bucket-path "$CACHE_PATH/bucket-contents"
            -version-channel "${{ inputs.version-channel }}"
            -release-channel "${{ inputs.release-channel }}"
            -artifact-path "$DOWNLOAD_DIRECTORY"
            -log-level "$LOG_LEVEL"
            $TOOL_ARGUMENTS # This is not quoted as it should be expanded by the shell
      - name: Log runner state post-job
        run: |
          # Log information that may have changed during job execution so that we can catch future issues before they happen
          echo "Disk info:"
          df -hT
      - name: Set job summary
        run: |
          PACKAGES=($PACKAGES)  # Turn into an array
          echo "### Uploaded ${#PACKAGES[@]} packages uploaded to ${{ inputs.release-channel }}/${{ inputs.version-channel }} \
            in ${{ inputs.repo-type }} repo stored in S3 bucket at $BUCKET_NAME" | tee -a "$GITHUB_STEP_SUMMARY"
          for package in "${PACKAGES[@]}"
          do
            echo "* $(basename "$package")" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Invalidate the CDN cache
        env:
          TIMEOUT_SECONDS: 600
          WAIT_TIME_SECONDS: 5
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION" \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output "text" \
          )
          echo "Created cache invalidation $INVALIDATION_ID for Cloudfront distribution $CLOUDFRONT_DISTRIBUTION"

          ELAPSED_TIME_SECONDS=0
          while true; do
            INVALIDATION_STATUS=$(aws cloudfront get-invalidation \
              --distribution-id "$CLOUDFRONT_DISTRIBUTION" \
              --id "$INVALIDATION_ID" \
              --query "Invalidation.Status" \
              --output "text" \
            )

            if [ "$INVALIDATION_STATUS" != "InProgress" ]; then
              break
            fi
            
            if [ "$ELAPSED_TIME_SECONDS" -gt "$TIMEOUT_SECONDS" ]; then
              echo "Cache invalidation still in progress after timeout ($TIMEOUT_SECONDS seconds) elapsed!"
              exit 1
            fi

            echo "Cache invalidation still in progress ($ELAPSED_TIME_SECONDS seconds passed). Waiting $WAIT_TIME_SECONDS seconds before checking again..."
            sleep "$WAIT_TIME_SECONDS"
            ELAPSED_TIME_SECONDS=$(( ELAPSED_TIME_SECONDS + WAIT_TIME_SECONDS ))
          done

          if [ "$INVALIDATION_STATUS" != "Completed" ]; then
            echo "Cache invalidation failed! Full invalidation information:"
            aws cloudfront get-invalidation \
              --distribution-id "$CLOUDFRONT_DISTRIBUTION" \
              --id "$INVALIDATION_ID"
              exit 1
          fi

          echo "Cache invalidation succeeded!"
      - name: ${{ inputs.repo-type }}-${{ inputs.environment }}
        run: |
          # This is a do-nothing step so that agents calling this workflow can determine what concurrency group
          # this run is using

  
  # These jobs are designed to be a very final test to verify that we didn't just publish a broken release
  # They are very much not a catch-all even of the few basic tests they run - but if they fail, something
  # is really broken.
  apt-debian-smoke-test:
    name: Test packages deployed to APT repo on Debian
    if: inputs.repo-type == 'apt' && inputs.package-to-test != ''
    needs: deploy
    runs-on: ubuntu-latest
    # A container is used here to maintain consistency in the testing methodology for both APT and YUM
    strategy:
      fail-fast: false
      matrix:
        # Multiple images are used to test for the ever recurring libc version issue
        container-image: ["ubuntu:22.04", "ubuntu:20.04", "ubuntu:18.04", "debian:10", "debian:11", "debian:12"]
    container:
      image: ${{ matrix.container-image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Log package to test
        run: echo "${{ inputs.package-to-test }}"
      # Note: These values are intentionally hard-coded here to prevent false positives or negatives due
      #       to a value in one of our code/IaC repos changing without the change propegating everywhere.
      - name: Derive and set Github environment-specific variables for production
        if: inputs.environment == 'production' || inputs.environment == 'promote'
        run: |
          echo "APT_REPO_DOMAIN_NAME=apt.releases.teleport.dev" >> "$GITHUB_ENV"
      - name: Derive and set Github environment-specific variables for development
        if: inputs.environment == 'staging' || inputs.environment == 'build'
        run: |
          echo "APT_REPO_DOMAIN_NAME=apt.releases.development.teleport.dev" >> "$GITHUB_ENV"
      - name: Log set variables
        run: |
          echo "Set variables:"
          env
      - name: Setup for package install
        env:
          ARTIFACT_TAG: ${{ inputs.artifact-tag }}
        run: |
          # The container images are missing a couple of minor things needed for the install instructions
          # on the downloads page
          # sudo is not available in the image, so create a simple do-nothing script to replace it
          SUDO_PATH="/usr/bin/sudo"
          echo '$@' > "$SUDO_PATH"
          chmod +x "$SUDO_PATH"
          sudo echo "Running this with pseudo-sudo"

          # Install curl
          apt update
          apt install -y curl

          # Install apt-file
          apt install -y apt-file

          # Set the package version
          echo "PACKAGE_VERSION=${ARTIFACT_TAG#v}" >> "$GITHUB_ENV"
      - name: Prepare to install the package
        env:
          RELEASE_CHANNEL: ${{ inputs.release-channel }}
          VERSION_CHANNEL: ${{ needs.deploy.outputs.component-version-channel }}
          PACKAGE_TO_TEST: ${{ inputs.package-to-test }}
        run: |
          # Install teleport based off of instructions from https://goteleport.com/docs/installation/#linux
          # This is designed to be changed as little as possible from the source
          sudo curl https://$APT_REPO_DOMAIN_NAME/gpg \
            -o /usr/share/keyrings/teleport-archive-keyring.asc
          source /etc/os-release
          echo "deb [signed-by=/usr/share/keyrings/teleport-archive-keyring.asc] \
            https://$APT_REPO_DOMAIN_NAME/${ID?} ${VERSION_CODENAME?} $RELEASE_CHANNEL/$VERSION_CHANNEL" \
            | sudo tee /etc/apt/sources.list.d/teleport.list > /dev/null
          sudo apt-get update
      - name: Log package pre-install information
        env:
          PACKAGE_TO_TEST: ${{ inputs.package-to-test }}
        run: |
          # Setup
          apt-file update > /dev/null

          # Log data
          echo "Available versions of package:"
          apt-cache policy "$PACKAGE_TO_TEST"

          echo "Package files:"
          apt-file list "$PACKAGE_TO_TEST"
      - name: Install the package
        if: inputs.do-teleport-package-tests
        env:
          PACKAGE_TO_TEST: ${{ inputs.package-to-test }}
        run: |
          sudo apt-get install -y "$PACKAGE_TO_TEST=$PACKAGE_VERSION"
      - name: Log Teleport version
        if: inputs.do-teleport-package-tests
        run: teleport version
      - name: Verify installed Teleport version matches provided artifact version
        if: inputs.do-teleport-package-tests
        env:
          ARTIFACT_TAG: ${{ inputs.artifact-tag }}
        run: |
          REPORTED_VERSION=$(teleport version --raw)
          if [ "$REPORTED_VERSION" != "${ARTIFACT_TAG#v}" ]; then
            echo "Installed version ($REPORTED_VERSION) does not match uploaded artifact version (${ARTIFACT_TAG#v})!!!"
            exit 406  # Picking this number as Googling "error code 406" will show that it is a "not acceptable" error
          fi
  yum-rhel-smoke-test:
    name: Test packages deployed to YUM repo on RHEL
    if: inputs.repo-type == 'yum' && inputs.package-to-test != ''
    needs: deploy
    runs-on: ubuntu-latest
    # A container is used here to maintain consistency in the testing methodology for both APT and YUM
    strategy:
      fail-fast: false
      matrix:
        # Multiple images are used to test for the ever recurring libc version issue
        container-image: 
          - centos:7
          # These are the closest we can easily get to rhel 7/8/9
          - registry.access.redhat.com/ubi7:7.9
          - registry.access.redhat.com/ubi8:8.7
          - registry.access.redhat.com/ubi9:9.1
    container:
      image: ${{ matrix.container-image }}
    defaults:
      run:
        shell: bash
    steps:
      # Note: These values are intentionally hard-coded here to prevent false positives or negatives due
      #       to a value in one of our code/IaC repos changing without the change propegating everywhere.
      - name: Derive and set Github environment-specific variables for production
        if: inputs.environment == 'production' || inputs.environment == 'promote'
        run: |
          echo "YUM_REPO_DOMAIN_NAME=yum.releases.teleport.dev" >> "$GITHUB_ENV"
          echo "FORCE_INSTALL_PROD_PUBLIC_KEY=false" >> "$GITHUB_ENV"
      - name: Derive and set Github environment-specific variables for development
        if: inputs.environment == 'staging' || inputs.environment == 'build'
        run: |
          echo "YUM_REPO_DOMAIN_NAME=yum.releases.development.teleport.dev" >> "$GITHUB_ENV"
          # This is required as the RPMs are signed by the prod key, not the dev key
          # Without this yum will fail due to a signing key mismatch
          echo "FORCE_INSTALL_PROD_PUBLIC_KEY=true" >> "$GITHUB_ENV"
      - name: Log set variables
        run: |
          echo "Set variables:"
          env
      - name: Setup for package install
        env:
          ARTIFACT_TAG: ${{ inputs.artifact-tag }}
        run: |
          # The container images are missing a couple of minor things needed for the install instructions
          # on the downloads page
          # sudo is not available in the image, so create a simple do-nothing script to replace it
          SUDO_PATH="/usr/bin/sudo"
          echo '$@' > "$SUDO_PATH"
          chmod +x "$SUDO_PATH"
          sudo echo "Running this with pseudo-sudo"

          # Install yum-utils for yum-config-manager
          yum install -y yum-utils

          # Add the prod signing key specifically if required in a dev context to deal with prod-signed RPMs
          if $FORCE_INSTALL_PROD_PUBLIC_KEY; then
            rpm --import https://yum.releases.teleport.dev/gpg
          fi

          # Set the package version
          echo "PACKAGE_VERSION=$(echo "${ARTIFACT_TAG#v}" | sed 's/-/_/g')" >> "$GITHUB_ENV"
      - name: Prepare to install the package
        env:
          RELEASE_CHANNEL: ${{ inputs.release-channel }}
          VERSION_CHANNEL: ${{ needs.deploy.outputs.component-version-channel }}
          PACKAGE_TO_TEST: ${{ inputs.package-to-test }}
        run: |
          # Install teleport based off of instructions from https://goteleport.com/docs/installation/#linux
          # This is designed to be changed as little as possible from the source
          source /etc/os-release

          # The UBI images use a slightly different from normal format for VERSION_ID so it must be accounted for here
          VERSION_ID=$(echo $VERSION_ID | cut -d'.' -f1)

          sudo yum-config-manager --add-repo $(rpm --eval "https://${YUM_REPO_DOMAIN_NAME}/$ID/$VERSION_ID/Teleport/%{_arch}/$RELEASE_CHANNEL/$VERSION_CHANNEL/teleport-yum.repo")
      - name: Log package pre-install information
        env:
          PACKAGE_TO_TEST: ${{ inputs.package-to-test }}
        run: |
          echo "Available versions of package:"
          yum --showduplicates -y list available "$PACKAGE_TO_TEST"

          echo "Deployed package version:"
          yum --showduplicates -y list available "$PACKAGE_TO_TEST-$PACKAGE_VERSION"

          echo "Package files:"
          repoquery -l "$PACKAGE_TO_TEST-$PACKAGE_VERSION"
      - name: Install the package
        if: inputs.do-teleport-package-tests
        env:
          PACKAGE_TO_TEST: ${{ inputs.package-to-test }}
        run: |
          sudo yum install -y "$PACKAGE_TO_TEST-$PACKAGE_VERSION"
      - name: Log Teleport version
        if: inputs.do-teleport-package-tests
        run: teleport version
      - name: Verify installed Teleport version matches provided artifact version
        if: inputs.do-teleport-package-tests
        env:
          ARTIFACT_TAG: ${{ inputs.artifact-tag }}
        run: |
          REPORTED_VERSION=$(teleport version --raw)
          if [ "$REPORTED_VERSION" != "${ARTIFACT_TAG#v}" ]; then
            echo "Installed version ($REPORTED_VERSION) does not match uploaded artifact version (${ARTIFACT_TAG#v})!!!"
            exit 406  # Picking this number as Googling "error code 406" will show that it is a "not acceptable" error
          fi
  zypper-suse-smoke-test:
    name: Test packages deployed to Zypper repo on SUSE
    # Zypper changes are deployed via yum logic which is why the repo type checks for "yum" here
    if: inputs.repo-type == 'yum' && inputs.package-to-test != ''
    needs: deploy
    runs-on: ubuntu-latest
    # A container is used here to maintain consistency in the testing methodology for both APT, YUM, and Zypper
    strategy:
      fail-fast: false
      matrix:
        # Multiple images are used to test for the ever recurring libc version issue
        container-image: 
          # SUSE Linux Enterprise Edition
          - registry.suse.com/suse/sles12sp5:latest # The other tags are too specific so latest is used instead
          - registry.suse.com/bci/bci-base:15.5
    container:
      image: ${{ matrix.container-image }}
    defaults:
      run:
        shell: bash
    steps:
      # Note: These values are intentionally hard-coded here to prevent false positives or negatives due
      #       to a value in one of our code/IaC repos changing without the change propegating everywhere.
      - name: Derive and set Github environment-specific variables for production
        if: inputs.environment == 'production' || inputs.environment == 'promote'
        run: |
          echo "ZYPPER_REPO_DOMAIN_NAME=zypper.releases.teleport.dev" >> "$GITHUB_ENV"
          echo "FORCE_INSTALL_PROD_PUBLIC_KEY=false" >> "$GITHUB_ENV"
      - name: Derive and set Github environment-specific variables for development
        if: inputs.environment == 'staging' || inputs.environment == 'build'
        run: |
          echo "ZYPPER_REPO_DOMAIN_NAME=zypper.releases.development.teleport.dev" >> "$GITHUB_ENV"
          # This is required as the RPMs are signed by the prod key, not the dev key
          # Without this zypper will fail due to a signing key mismatch
          echo "FORCE_INSTALL_PROD_PUBLIC_KEY=true" >> "$GITHUB_ENV"
      - name: Log set variables
        run: |
          echo "Set variables:"
          env
      - name: Setup for package install
        env:
          ARTIFACT_TAG: ${{ inputs.artifact-tag }}
        run: |
          # The container images are missing a couple of minor things needed for the install instructions
          # on the downloads page
          # sudo is not available in the image, so create a simple do-nothing script to replace it
          SUDO_PATH="/usr/bin/sudo"
          echo '$@' > "$SUDO_PATH"
          chmod +x "$SUDO_PATH"
          sudo echo "Running this with pseudo-sudo"

          # Add the prod signing key specifically if required in a dev context to deal with prod-signed RPMs
          # This logic is required because the SLES containers do not have curl, wget, or pre-existing package
          # repos available. RPM also seems to have some sort of root CA trust issue as well, despite openssl
          # working.
          if $FORCE_INSTALL_PROD_PUBLIC_KEY; then
            GPG_KEY_PATH="/tmp/teleport.gpg"
            openssl s_client -quiet -connect zypper.releases.teleport.dev:443 -servername zypper.releases.teleport.dev <<EOF 2>/dev/null | sed '1,/^\r$/d' > "$GPG_KEY_PATH"
          GET /gpg HTTP/1.0
          Host: zypper.releases.teleport.dev

          EOF
            rpm --import "$GPG_KEY_PATH"
            rm "$GPG_KEY_PATH"
          fi

          # Set the package version
          # Note that if we ever republish a tag then the `-1` at the end will refer to the original version
          echo "PACKAGE_VERSION=$(echo "${ARTIFACT_TAG#v}" | sed 's/-/_/g')-1" >> "$GITHUB_ENV"
      - name: Prepare to install the package
        env:
          RELEASE_CHANNEL: ${{ inputs.release-channel }}
          VERSION_CHANNEL: ${{ needs.deploy.outputs.component-version-channel }}
        run: |
          # Install teleport based off of instructions from https://goteleport.com/docs/installation/#linux
          # This is designed to be changed as little as possible from the source
          source /etc/os-release
          VERSION_ID=$(echo $VERSION_ID | cut -d'.' -f1)

          # This is required on container images specifically
          GPG_KEY_PATH="/tmp/teleport.gpg"
          openssl s_client -quiet -connect "$ZYPPER_REPO_DOMAIN_NAME:443" -servername "$ZYPPER_REPO_DOMAIN_NAME" <<EOF 2>/dev/null | sed '1,/^\r$/d' > "$GPG_KEY_PATH"
          GET /gpg HTTP/1.0
          Host: ${ZYPPER_REPO_DOMAIN_NAME}

          EOF
          rpm --import "$GPG_KEY_PATH"
          rm "$GPG_KEY_PATH"

          sudo zypper addrepo --refresh --repo $(rpm --eval "https://${ZYPPER_REPO_DOMAIN_NAME}/$ID/$VERSION_ID/Teleport/%{_arch}/$RELEASE_CHANNEL/$VERSION_CHANNEL/teleport-zypper.repo")
      - name: Log package cache information
        env:
          PACKAGE_TO_TEST: ${{ inputs.package-to-test }}
        run: |
          zypper search -s "$PACKAGE_TO_TEST"
      - name: Install the package
        if: inputs.do-teleport-package-tests
        env:
          PACKAGE_TO_TEST: ${{ inputs.package-to-test }}
        run: |
          sudo zypper install -y "$PACKAGE_TO_TEST=$PACKAGE_VERSION"
      - name: Log Teleport version
        if: inputs.do-teleport-package-tests
        run: teleport version
      - name: Verify installed Teleport version matches provided artifact version
        if: inputs.do-teleport-package-tests
        env:
          ARTIFACT_TAG: ${{ inputs.artifact-tag }}
        run: |
          REPORTED_VERSION=$(teleport version --raw)
          if [ "$REPORTED_VERSION" != "${ARTIFACT_TAG#v}" ]; then
            echo "Installed version ($REPORTED_VERSION) does not match uploaded artifact version (${ARTIFACT_TAG#v})!!!"
            exit 406  # Picking this number as Googling "error code 406" will show that it is a "not acceptable" error
          fi
