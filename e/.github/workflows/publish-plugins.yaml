---
name: Publish Teleport Plugins

on:
  workflow_call:
    inputs:
      oss-teleport-repo:
        description: The name of the OSS teleport repo to checkout.
        type: string
        default: gravitational/teleport

      oss-teleport-ref:
        description: Git SHA, tag or branch of the revision of OSS teleport to build.
        type: string
        required: true

      teleport-version:
        description: |
          The semver version of Teleport version that we're building for.
        type: string

      environment:
        description: GitHub environment to publish to.
        type: string
        default: publish-stage

jobs:
  publish:
    runs-on: ubuntu-latest
    # Unfortuntely this cannot be set as a global env var as they are not evaluated until runtime
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      ARTIFACT_TAG: ${{ inputs.teleport-version }}
      LOCAL_ARTIFACTS_PATH: /tmp/artifacts
      LOCAL_TERRAFORM_REGISTRY_PATH: /tmp/terraform-registry
      ENVIRONMENT_NAME: ${{ inputs.environment }}
    steps:
      # This is needed to download the Terraform promotion tool, and for makefiles
      - name: Checkout Teleport
        uses: gravitational/teleport.e/.github/actions/checkout-teleport@master
        with:
          oss-teleport-repo: ${{ inputs.oss-teleport-repo }}
          oss-teleport-ref: ${{ inputs.oss-teleport-ref }}
          edition: enterprise
          repo-access-app-id: ${{ secrets.DEPLOY_APP_ID }}
          repo-access-app-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}

      - name: Setup tooling Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "./e/tooling/plugins/go.mod"
          cache-dependency-path: "./e/tooling/plugins/go.sum"
          check-latest: true

      # Sync artifacts down (required by everything)
      - name: Assume AWS role for uploading the artifacts
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-skip-session-tagging: true
          aws-region: us-west-2
          role-to-assume: ${{ vars.ARTIFACT_DOWNLOAD_AWS_ROLE }}
          role-session-name: "tag-publish-plugins-artifact-download-${{ github.run_attempt }}"
          role-duration-seconds: 900

      - name: Download artifacts from S3
        env:
          PENDING_BUCKET: ${{ vars.ARTIFACT_SOURCE_BUCKET }}
        run: |
          aws s3 cp "s3://$PENDING_BUCKET/teleport-plugins/tag/$ARTIFACT_TAG/" "$LOCAL_ARTIFACTS_PATH" --recursive

      # Terraform promotion
      - name: Assume AWS role for syncing the Terraform artifacts
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-skip-session-tagging: true
          aws-region: us-west-2
          role-to-assume: ${{ vars.TERRAFORM_PUBLISHING_SYNC_AWS_ROLE }}
          role-session-name: "tag-publish-plugins-terraform-publishing-sync-${{ github.run_attempt }}"
          role-duration-seconds: 900

      - name: Download the Terraform repo from S3
        env:
          TERRAFORM_REGISTRY_BUCKET: ${{ vars.TERRAFORM_REGISTRY_BUCKET }}
        run: |
          aws s3 cp "s3://$TERRAFORM_REGISTRY_BUCKET/" "$LOCAL_TERRAFORM_REGISTRY_PATH" --recursive

      - name: Run the terraform-publish tool
        env:
          TERRAFORM_REGISTRY_URL: ${{ vars.TERRAFORM_REGISTRY_URL }}
          SIGNING_KEY: ${{ secrets.TERRAFORM_SIGNING_KEY }}
        run: |
          go run -C e/tooling/plugins ./cmd/promote-terraform \
            --tag "$ARTIFACT_TAG" \
            --artifact-directory-path "$LOCAL_ARTIFACTS_PATH" \
            --registry-directory-path "$LOCAL_TERRAFORM_REGISTRY_PATH" \
            --protocol 6 \
            --registry-url "$TERRAFORM_REGISTRY_URL" \
            --namespace gravitational \
            --name teleport

      - name: Upload the Terraform repo to S3
        env:
          TERRAFORM_REGISTRY_BUCKET: ${{ vars.TERRAFORM_REGISTRY_BUCKET }}
        run: |
          aws s3 sync "$LOCAL_TERRAFORM_REGISTRY_PATH" "s3://$TERRAFORM_REGISTRY_BUCKET/"

  # Image publishing
  images-setup:
    name: Setup for image publishing
    runs-on: ubuntu-latest
    outputs:
      teleport-version: ${{ steps.version.outputs.full }}
      dest-image-tags: ${{ steps.version.outputs.labels }}
    steps:
      # Generates a list of tags that will be applied to the published image. In the
      # case of a "normal" release (identified by a version tag with no pre-release
      # suffix) the published image is assumed to take over all of the more-significant
      # release numbers, as well as its own (e.g 11.2.3 implies tags of 11 and 11.2).
      #
      # A version tag with a pre-release sufffix will only be published as itself, in
      # order to allow things like RCs and Betas to be published without overriding any
      # existing release.
      - name: Parse version
        id: version
        uses: gravitational/teleport.e/.github/actions/parse-version@master
        with:
          version: ${{ inputs.teleport-version }}

  publish-images:
    needs: images-setup
    permissions:
      contents: read
      id-token: write  # required for aws-actions/configure-aws-credentials
    strategy:
      matrix:
        plugins:
          # Access plugins
          - discord
          - email
          - jira
          - mattermost
          - msteams
          - pagerduty
          - slack
          # Event handler
          - event-handler
        image-type:
          - name: production  # The `name` field is just here for documentation
            repo-suffix: ''
          - name: debug
            repo-suffix: '-debug'
    uses: ./.github/workflows/oci-image-publish.yml
    with:
      repository: teleport-plugin-${{ matrix.plugins }}${{ matrix.image-type.repo-suffix }}
      pending-tag: ${{ needs.images-setup.outputs.teleport-version }}
      production-tags: ${{ needs.images-setup.outputs.dest-image-tags }}
      environment: ${{ inputs.environment }}
