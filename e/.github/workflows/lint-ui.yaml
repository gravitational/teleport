name: Lint UI
run-name: Lint UI - ${{ github.run_id }} - @${{ github.actor }}

on:
  push:
    branches:
      - master
  pull_request:

  merge_group:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout
        # Only checkout if not a pull request. dorny/paths-filter accesses changed files
        # on a PR via the API and does not need a checked-out repo.
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: changes
        with:
          base: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
          ref: ${{ github.event.pull_request.head.ref || github.event.merge_group.head_ref }}
          filters: |
            changed:
              - '.github/workflows/lint-ui.yaml'
              - 'web/**'

  lint:
    name: Prettier, ESLint, & TSC
    needs: changes
    if: ${{ !startsWith(github.head_ref, 'dependabot/') && needs.changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gravitational/teleport-buildbox:teleport19
    steps:
      - name: Checkout OSS Teleport
        uses: actions/checkout@v4
        with:
          repository: gravitational/teleport
          # base_ref is only available for pull_request triggers
          # for merge_group triggers we need to pull from the event payload
          ref: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}

      - name: Checkout Enterprise Teleport
        uses: actions/checkout@v4
        with:
          path: e

      - name: Print Node version
        run: |
          node --version

      - name: Install JS dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Build WASM
        run: pnpm build-wasm

      - name: Run Type Check
        run: pnpm type-check

      - name: Run lint
        run: pnpm lint

      - name: Run Storybook smoke test
        run: pnpm storybook-smoke-test
