name: Lint UI
run-name: Lint UI - ${{ github.run_id }} - @${{ github.actor }}

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - 'web/**'
  workflow_call:
    inputs:
      oss-teleport-ref:
        description: 'Git SHA, tag or branch of the revision of OSS teleport to build'
        required: true
        default: 'master'
        type: string

jobs:
  lint:
    name: Prettier, ESLint, & TSC
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout OSS Teleport
        uses: actions/checkout@v3
        with:
          repository: gravitational/teleport
          ref: ${{ inputs.oss-teleport-ref }}

      - name: Checkout Enterprise Teleport
        uses: actions/checkout@v3
        with:
          path: e

      - name: Setup Node Toolchain
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install Yarn dependencies
        run: yarn

      - name: Run lint
        run: yarn lint

      - name: Run Type Check
        run: yarn type-check
