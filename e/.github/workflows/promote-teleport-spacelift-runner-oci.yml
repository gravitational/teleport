name: Promote Teleport Spacelift Runner Images
on:
  workflow_dispatch:
    inputs:
      pending-registry:
        description: |
          Registry and namespace prefix for the repository holding the
          pending release images, formatted for use with Docker (that is,
          like an URI, not the AWS ARN). 
        type: string
        required: true
        default: 146628656107.dkr.ecr.us-west-2.amazonaws.com/gravitational

      release-source-tag:
        description: "The semver version tag of the Teleport revision that we're building."
        required: true
        type: string

      promotion-role-arn:
        description: |
          ARN of the role that grants promotion rights
        required: true
        type: string
        default: arn:aws:iam::146628656107:role/teleport-oci-promotion-gha

      validation-key-url:
        description: |
          URL of the key used to validate internal Teleport images.
        required: true
        type: string
        default: awskms:///arn:aws:kms:us-west-2:146628656107:alias/teleport-oci-pending-build-signing

      production-signing-key-url:
        description: |
          URL of the key used to sign the production images as Official Teleport images.
        required: true
        type: string
        default: awskms:///arn:aws:kms:us-west-2:146628656107:alias/teleport-oci-production-signing

      workflow-tag:
        description: |
          Tag used to identify workflow runs spawned by this event
        type: string
        default: ""

run-name: 'Promote OCI images for Teleport Spacelift Runner ${{ inputs.release-source-tag }}'

jobs:
  identity:
    runs-on: ubuntu-latest
    if: inputs.workflow-tag != ''
    steps:
      - name: ${{ inputs.workflow-tag }}
        run: echo ${{ inputs.workflow-tag }}

  configure:
    name: Configure Build
    runs-on: ubuntu-latest
    outputs:
      teleport-version: ${{ steps.version.outputs.full }}
      teleport-version-major: ${{ steps.version.outputs.major }}
      teleport-version-minor: ${{ steps.version.outputs.minor }}
      teleport-version-patch: ${{ steps.version.outputs.patch }}
      teleport-version-prerelease: ${{ steps.version.outputs.prerelease }}
      dest-image-tags: ${{ steps.version.outputs.image_tags }}
    steps:
      # Generates a list of tags that will be applied to the promoted image. In the
      # case of a "normal" release (identified by a version tag with no pre-release
      # suffix) the promoted image is assumed to take over all of the more-significant
      # release numbers, as well as its own (e.g 11.2.3 implies tags of 11 and 11.2).
      #
      # A version tag with a pre-release suffix will only be promoted as itself, in
      # order to allow things like RCs and Betas to be promoted without overriding any
      # existing release.
      - name: Generate Tags
        id: version
        run: |
          version=${{ inputs.release-source-tag }}
          version="${version#v}"

          if ! [[ "${version}" =~ [^0-9]*([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.+-]+)? ]]; then
                  echo bad version
                  exit 1
          fi

          set -- "${BASH_REMATCH[@]:1}" # get regex groups as $1, $2, ... etc
          tags="${version}"
          [[ -z "$4" ]] && tags+=" $1.$2 $1" # add major.minor and major tags if not prerelease

          echo full=${version} >> $GITHUB_OUTPUT
          echo major=$1 >> $GITHUB_OUTPUT
          echo minor=$2 >> $GITHUB_OUTPUT
          echo patch=$3 >> $GITHUB_OUTPUT
          echo prerelease=$4 >> $GITHUB_OUTPUT
          echo image_tags=${tags} >> $GITHUB_OUTPUT

  promote-images:
    needs: configure
    permissions:
      id-token: write  # required for aws-actions/configure-aws-credentials
      contents: read
    uses: ./.github/workflows/oci-image-promote.yml
    with:
      pending-registry: ${{ inputs.pending-registry }}
      pending-repository: teleport-spacelift-runner
      pending-tag: ${{ needs.configure.outputs.teleport-version }}
      validation-key-url: ${{ inputs.validation-key-url }}
      production-registry: public.ecr.aws
      production-registry-region: us-east-1
      production-repository: gravitational/teleport-spacelift-runner
      production-tags: "${{ needs.configure.outputs.dest-image-tags }}"
      production-signing-key-url: ${{ inputs.production-signing-key-url }}
      promotion-role-arn: ${{ inputs.promotion-role-arn }}
