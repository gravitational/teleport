name: Build MacOS (Darwin) AMD64

on:
  workflow_call:
    inputs:
      oss-teleport-repo:
        description: 'The name of the OSS Teleport repo to checkout'
        required: false
        default: "gravitational/teleport"
        type: string

      oss-teleport-ref:
        description: 'Git SHA, tag or branch of the revision of OSS teleport to build'
        required: true
        type: string

      ent-teleport-ref:
        description: |
          Git SHA, tag or branch of the revision of Enterprise teleport to build. If no
          value is supplied this workflow will use whatever reference is specified in
          the OSS teleport submodule record.
        required: false
        default: ""
        type: string

      release-version:
        description: |
          Override the build version from what is in the Makefile.
          Use this override to specify a tag for build debugging purposes.
        type: string
        default: ""

      release:
        description: 'Release level to build. Currently supports `oss` and `enterprise`'
        required: true
        type: string

      save-artifacts:
        description: 'Should the build export the build artifacts'
        required: false
        type: boolean
        default: false

      build-packages:
        description: |
          Build Mac packages for Teleport, tsh and Teleport Connect.
          Packages are not build for push builds. Release builds do
          build packages.
        required: false
        type: boolean
        default: false

      environment:
        description: |
          GitHub Actions environment in which to run the build. Can be either
          `promote` or `build`. The default `promote` can only be used for
          `master` and `branch/*` branches. `build` should be used for testing
          workflow changes on a dev branch.
        required: false
        type: string
        default: promote

jobs:
  build-release-artifacts:
    environment: ${{ inputs.environment }}
    runs-on: macos-12-xl
    permissions:
      contents: read
    env:
      GOMODCACHE: /tmp/gomodcache
      GOCACHE: /tmp/gocache
    steps:
      # --- Checkout ----------------------------------------------------------
      # TODO(camh/tcsc): Factor repo checkout steps into separate action.
      # Deduplicate across workflows.
      - id: fetch-token
        name: Fetch installation token
        uses: tibdex/github-app-token@v1
        continue-on-error: true
        with:
          app_id: ${{ secrets.DEPLOY_APP_ID }}
          private_key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          repository: ${{ inputs.oss-teleport-repo }}

      - id: select-access-token
        name: Select access token
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.fetch-token.outputs.token }}
        run: |
          echo token=${APP_TOKEN:-${GITHUB_TOKEN}} >> $GITHUB_OUTPUT

      - id: checkout-oss
        name: Checkout OSS Teleport
        uses: actions/checkout@v3
        with:
          repository: ${{ inputs.oss-teleport-repo }}
          ref: ${{ inputs.oss-teleport-ref }}
          token: ${{ steps.select-access-token.outputs.token }}

      - id: determine-enterprise-ref
        name: Determine Enterprise Teleport reference
        if: inputs.release == 'enterprise'
        env:
          e_ref: ${{ inputs.ent-teleport-ref }}
        run: |
          echo ref=${e_ref:-$(git rev-parse @:e)} >> $GITHUB_OUTPUT

      - name: Checkout Enterprise Teleport
        if: inputs.release == 'enterprise'
        uses: actions/checkout@v3
        with:
          repository: gravitational/teleport.e
          path: e
          ref: ${{ steps.determine-enterprise-ref.outputs.ref }}

      # --- Setup -------------------------------------------------------------
      - name: Determine Toolchain Versions and cache paths
        run: |
          echo NODE_VERSION=$(make -C build.assets print-node-version) >> $GITHUB_ENV
          echo GOLANG_VERSION=$(make -C build.assets print-go-version | sed 's/^go//') >> $GITHUB_ENV
          echo RUST_VERSION=$(make -C build.assets print-rust-version) >> $GITHUB_ENV
          echo PKG_CONFIG_PATH="$(build.assets/build-fido2-macos.sh pkg_config_path)" >> $GITHUB_ENV

      - name: Print versions
        run: |
          echo "make: $(make --version)"
          echo "node: ${NODE_VERSION}"
          echo "go: ${GOLANG_VERSION}"
          echo "rust: ${RUST_VERSION}"

      - name: Install Node Toolchain
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup yarn
        run: |
          corepack enable yarn

      - name: Install Go Toolchain
        uses: actions/setup-go@v3
        with:
          go-version: ${{ env.GOLANG_VERSION }}

      - name: Configure Rust Toolchain
        run: |
          rustup override set ${{ env.RUST_VERSION }}

      - name: Setup keychain
        env:
          APP_KEY: ${{ secrets.APPLE_APPLICATION_PRIVATE_KEY }}
          APP_KEY_PASSWORD: ${{ secrets.APPLE_APPLICATION_PRIVATE_KEY_PASSWORD }}
          INST_KEY: ${{ secrets.APPLE_INSTALLER_PRIVATE_KEY }}
          INST_KEY_PASSWORD: ${{ secrets.APPLE_INSTALLER_PRIVATE_KEY_PASSWORD }}
        run: |
          ./build.assets/keychain-setup.sh -a APP_KEY -A APP_KEY_PASSWORD -i INST_KEY -I INST_KEY_PASSWORD -v

      # --- Build -------------------------------------------------------------
      - name: Build FIDO2
        run: |
          build.assets/build-fido2-macos.sh build

      - name: Build Teleport
        env:
          APPLE_USERNAME: ${{ vars.APPLE_USERNAME }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APPLICATION_PASSWORD }}
          ENVIRONMENT_NAME: ${{ vars.ENVIRONMENT_NAME }}
          TELEPORT_VERSION: ${{ inputs.release-version }}
        run: |
          echo "Building for environment: ${ENVIRONMENT_NAME}"
          make release OS=darwin ARCH=amd64 FIDO2=yes TOUCHID=yes PIV=yes ${TELEPORT_VERSION:+VERSION=${TELEPORT_VERSION}}
          mkdir -p build/artifacts
          cp teleport-*.tar.gz build/artifacts
          if [ "${{ inputs.release }}" == 'enterprise' ]; then
              cp e/teleport-*.tar.gz build/artifacts
          fi

      - name: Build Teleport Package
        if: inputs.build-packages
        env:
          APPLE_USERNAME: ${{ vars.APPLE_USERNAME }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APPLICATION_PASSWORD }}
          ENVIRONMENT_NAME: ${{ vars.ENVIRONMENT_NAME }}
          OSS_TARBALL_PATH: ${{ github.workspace }}/build/artifacts
          TELEPORT_VERSION: ${{ inputs.release-version }}
        run: |
          make pkg ARCH=amd64 OS=darwin ${TELEPORT_VERSION:+VERSION=${TELEPORT_VERSION}}
          cp build/teleport-*.pkg build/artifacts
          if [ "${{ inputs.release }}" == 'enterprise' ]; then
              cp e/build/teleport-*.pkg build/artifacts
          fi

      - name: Build tsh Package
        if: inputs.build-packages
        env:
          APPLE_USERNAME: ${{ vars.APPLE_USERNAME }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APPLICATION_PASSWORD }}
          ENVIRONMENT_NAME: ${{ vars.ENVIRONMENT_NAME }}
          OSS_TARBALL_PATH: ${{ github.workspace }}/build/artifacts
          TELEPORT_VERSION: ${{ inputs.release-version }}
        run: |
          make pkg-tsh ARCH=amd64 OS=darwin ${TELEPORT_VERSION:+VERSION=${TELEPORT_VERSION}}
          cp build/tsh-*.pkg build/artifacts

      - name: Prepare tsh Package for Teleport Connect
        if: inputs.build-packages
        env:
          TELEPORT_VERSION: ${{ inputs.release-version }}
        run: |
          mkdir -p build/pkg
          cd build/pkg
          pkgutil --expand-full ../tsh-*.pkg tsh
          echo "CONNECT_TSH_APP_PATH=$PWD/tsh/Payload/tsh.app" >> $GITHUB_ENV

      - name: Build Teleport Connect
        env:
          APPLE_USERNAME: ${{ vars.APPLE_USERNAME }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APPLICATION_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
          CONNECT_TSH_BIN_PATH: ${{ github.workspace }}/build/tsh
          ENVIRONMENT_NAME: ${{ vars.ENVIRONMENT_NAME }}
          TELEPORT_VERSION: ${{ inputs.release-version }}
        run: |
          # Make CONNECT_TSH_APP_PATH override CONNECT_TSH_BIN_PATH by unsetting
          # the latter if the former is set (by the previous step).
          [ -n "${CONNECT_TSH_APP_PATH:-}" ] && unset CONNECT_TSH_BIN_PATH
          make release-connect ${TELEPORT_VERSION:+VERSION=${TELEPORT_VERSION}}
          if [ "${{ inputs.build-packages }}" = 'true' ]; then
            cp web/packages/teleterm/build/release/*.dmg build/artifacts
          fi

      # --- Upload ------------------------------------------------------------
      - name: Checksum artifacts
        if: inputs.save-artifacts
        run: |
          cd build/artifacts
          for f in *; do
            shasum -a 256 "$f" > "$f.sha256"
            cat "$f.sha256"
          done

      - name: Upload artifacts
        if: inputs.save-artifacts
        uses: actions/upload-artifact/@v3
        with:
          name: release
          path: build/artifacts
          retention-days: 1
