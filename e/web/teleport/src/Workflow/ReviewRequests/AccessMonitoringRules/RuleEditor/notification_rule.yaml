kind: access_monitoring_rule
version: v1
metadata:
  # define the name of your rule here:
  name: {{rule.metadata.name}}
spec:
  subjects:
  - access_request

  # condition is a predicate expression that defines what
  # conditions should be met to trigger the access monitoring
  # rule.
  condition: {{rule.condition}}

  # notification configures notification routing rules.
  notification:
    # name of integration eg: slack or mattermost
    name: {{rule.notification.name}}

    # recipients specifies the list of recipients to be
    # notified when the access monitoring rule is triggered.
    recipients: {{rule.notification.recipients}}
