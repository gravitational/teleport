kind: access_monitoring_rule
version: v1
metadata:
  # define the name of your rule here:
  name: {{rule.metadata.name}}
spec:
  subjects:
  - access_request

  # condition is a predicate expression that defines what
  # conditions should be met to trigger the access monitoring
  # rule.
  condition: {{rule.condition}}

  # desired_state specifies the desired reconciled state of the access request
  # after the rule is applied.
  # Set `reviewed` to enable automatic reviews.
  desired_state: {{rule.desired_state}}

  # notification configures notification routing rules.
  notification:
    # name of integration eg: slack or mattermost
    name: {{rule.notification.name}}

    # recipients specifies the list of recipients to be
    # notified when the access monitoring rule is triggered.
    recipients: {{rule.notification.recipients}}

  # automatic_review configures automatic review rules.
  automatic_review:
    # integration is the name of external integration that will monitor
    # automatic review rules. Set 'builtin' to monitor rules with Teleport.
    integration: {{rule.automatic_review.integration}}

    # decision is the proposed state of the access review submission.
    # This can be either 'APPROVED' or 'DENIED'.
    decision: {{rule.automatic_review.decision}}
