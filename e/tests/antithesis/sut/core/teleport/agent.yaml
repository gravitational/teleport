version: v3
teleport:
  nodename: agent
  data_dir: /var/lib/teleport
  auth_token: agent-token
  proxy_server: antithesis.teleport.local:3080
  log:
    output: stderr
    severity: INFO

auth_service:
  enabled: false

proxy_service:
  enabled: false

ssh_service:
  enabled: true
  public_addr: agent:3022
  labels:
    test_template: ssh

app_service:
  enabled: true
  apps:
    - name: alpha
      uri: http://app-alpha:80
      public_addr: app-alpha.antithesis.teleport.local
      labels:
        app: alpha
    - name: alpha-tcp
      uri: tcp://app-alpha:80
      public_addr: app-alpha-tcp.antithesis.teleport.local
      labels:
        app: alpha-tcp

db_service:
  enabled: true
  resources:
    - labels:
        test_template: db
        type: dynamic
  databases:
    - name: static
      description: Antithesis Postgres Database Access static test target
      protocol: postgres
      uri: pgtest:5432
      tls:
        mode: verify-full
        ca_cert_file: /certs/rootCA.pem
      static_labels:
        test_template: db
        type: static

kubernetes_service:
  enabled: true
  kubeconfig_file: /kubeconfig/k3s.yaml
  labels:
    test_template: kube
