version: v3
teleport:
  data_dir: /var/lib/teleport
  auth_token: proxy-token
  auth_server: auth:3025
  log:
    output: stderr
    severity: INFO

auth_service:
  enabled: false

proxy_service:
  enabled: true
  web_listen_addr: 0.0.0.0:3080
  public_addr: antithesis.teleport.local:3080
  ssh_public_addr: antithesis.teleport.local:3080
  tunnel_public_addr: antithesis.teleport.local:3080
  peer_listen_addr: 0.0.0.0:3021
  https_keypairs:
    - cert_file: /certs/teleport.pem
      key_file: /certs/teleport-key.pem

ssh_service:
  enabled: false
