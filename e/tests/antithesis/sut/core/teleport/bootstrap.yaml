kind: role
version: v8
metadata:
  name: resource-allow
spec:
  allow:
    app_labels:
      '*': ['*']
    db_labels:
      '*': ['*']
    group_labels:
      '*': ['*']
    kubernetes_labels:
      '*': ['*']
    linux_desktop_labels:
      '*': ['*']
    windows_desktop_labels:
      '*': ['*']
    rules:
      - resources: ['*']
        verbs: ['*']
---
kind: role
version: v8
metadata:
  name: resource-deny
spec:
  allow:
    rules:
      # Without this tbot will fail to emit the identity
      - resources: [remote_cluster]
        verbs: [list, read]
  deny:
    rules:
      - resources:
          - role
          - user
          - auth_connector
          - oidc
          - saml
          - github
          - trusted_cluster
          - access_request
          - access_plugin_data
          - session
          - session_tracker
          - instance
          - event
          - workload_identity
          - bot
          - lock
          - network_restrictions
          - auth_server
          - proxy
          - node
          - app
          - db
          - kube_cluster
          - token
          - cert_authority
          - git_server
          - cluster_name
          - cluster_config
          - cluster_auth_preference
          - session_recording_config
          - cluster_audit_config
          - cluster_networking_config
        verbs: ['*']
---
kind: role
version: v8
metadata:
  name: resource-read-only
spec:
  allow:
    app_labels:
      '*': ['*']
    db_labels:
      '*': ['*']
    group_labels:
      '*': ['*']
    kubernetes_labels:
      '*': ['*']
    linux_desktop_labels:
      '*': ['*']
    windows_desktop_labels:
      '*': ['*']
    rules:
      - resources: ['*']
        verbs: ['list', 'read']
  deny:
    rules:
      - resources: ['*']
        verbs: ['create', 'update', 'delete']
---
kind: role
version: v8
metadata:
  name: node-allow
spec:
  allow:
    logins: ['root']
    node_labels:
      '*': ['*']
---
kind: role
version: v8
metadata:
  name: node-deny
spec:
  deny:
    node_labels:
      '*': ['*']
---
kind: role
version: v8
metadata:
  name: app-allow
spec:
  allow:
    app_labels:
      '*': ['*']
---
kind: role
version: v8
metadata:
  name: app-mint
spec:
  allow:
    app_labels:
      '*': ['*']
    rules:
      # Allow role reads to mint cert.
      - resources: [role]
        verbs: [read]
---
kind: role
version: v8
metadata:
  name: app-deny
spec:
  allow:
    rules:
      # Allow role reads to mint cert.
      - resources: [role]
        verbs: [read]
  deny:
    app_labels:
      '*': ['*']
---
kind: role
version: v8
metadata:
  name: db-allow
spec:
  allow:
    db_labels:
      "*": "*"
    db_names:
      - postgres
    db_users:
      - testuser
    rules:
      - resources: [db]
        verbs: ['*']
---
kind: role
version: v8
metadata:
  name: db-deny
spec:
  deny:
    db_labels:
      "*": "*"
    rules:
      - resources: [db]
        verbs: ['*']
---
kind: token
version: v2
metadata:
  name: workload-admin-token
spec:
  roles: [Bot]
  join_method: token
  bot_name: workload-admin
---
kind: token
version: v2
metadata:
  name: workload-allowed-token
spec:
  roles: [Bot]
  join_method: token
  bot_name: workload-allowed
---
kind: token
version: v2
metadata:
  name: workload-denied-token
spec:
  roles: [Bot]
  join_method: token
  bot_name: workload-denied
---
kind: token
version: v2
metadata:
  name: workload-crud-denied-token
spec:
  roles: [Bot]
  join_method: token
  bot_name: workload-crud-denied
