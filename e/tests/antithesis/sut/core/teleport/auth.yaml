version: v3
teleport:
  data_dir: /var/lib/teleport
  log:
    output: stderr
    severity: INFO
  storage:
    type: postgresql
    conn_string: "postgresql://teleport@pg:5432/teleport_backend?sslcert=/certs/bk/client.crt&sslkey=/certs/bk/client.key&sslrootcert=/certs/bk/ca.crt&sslmode=verify-full&pool_max_conns=10"
    change_feed_conn_string: "postgresql://teleport@pg:5432/teleport_backend?sslcert=/certs/bk/client.crt&sslkey=/certs/bk/client.key&sslrootcert=/certs/bk/ca.crt&sslmode=verify-full"
    audit_events_uri:
      - "postgresql://teleport@pg:5432/teleport_audit?sslcert=/certs/bk/client.crt&sslkey=/certs/bk/client.key&sslrootcert=/certs/bk/ca.crt&sslmode=verify-full&pool_max_conns=10"
    audit_sessions_uri: file:///var/lib/teleport/log/records

auth_service:
  enabled: true
  license_file: /license/license.pem
  proxy_listener_mode: multiplex
  tunnel_strategy:
    type: proxy_peering
  session_recording_config:
    mode: node
  cluster_name: antithesis.teleport.local
  tokens:
    - "proxy:proxy-token"
    - "node,app,db,kube:agent-token"

proxy_service:
  enabled: false

ssh_service:
  enabled: false
