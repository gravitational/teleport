events {}

stream {
    upstream teleport_proxies {
        # Resolve service names through the container runtime's configured
        # resolver at startup. This works under both Docker and Podman-based
        # Antithesis runs, where Docker's 127.0.0.11 resolver is unavailable.
        server proxy1:3080 max_fails=0;
        server proxy2:3080 max_fails=0;
    }

    server {
        listen 3080;
        proxy_pass teleport_proxies;
        proxy_connect_timeout 5s;
        proxy_timeout 300s;
    }
}
