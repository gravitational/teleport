# TYPE  DATABASE        USER            CIDR-ADDRESS            METHOD
local   all             all                                     trust

# Admin-only channel so the `first_` provisioning command can log in with a
# password to append db-client CA and reload
hostssl all             postgres        ::/0                    scram-sha-256
hostssl all             postgres        0.0.0.0/0               scram-sha-256

# Real db_service traffic: mTLS only, CN of the client cert maps to the
# Postgres role being requested
hostssl all             all             ::/0                    cert
hostssl all             all             0.0.0.0/0               cert
