syntax = "proto3";

package teleport.llm.v1;

import "google/protobuf/timestamp.proto";
import "teleport/header/v1/metadata.proto";

option go_package = "github.com/gravitational/teleport/api/gen/proto/go/teleport/llm/v1;llmv1";

// LLMEndpointQuota is resource tracks a LLM endpoint quota usage.
message LLMEndpointQuota {
  // Kind is the kind of resource represented. This is always `llm_endpoint_quota`.
  string kind = 1;
  // SubKind is the sub_kind of the resource. Always "".
  string sub_kind = 2;
  // Version is the version of the resource. Always "v1".
  string version = 3;
  // Metadata about this resource.
  teleport.header.v1.Metadata metadata = 4;
  // Spec defines the user-provided configuration.
  LLMEndpointQuotaSpec spec = 5;
  // Status is set by the server as results of operations. These should not
  // be modified by users.
  LLMEndpointQuotaStatus status = 6;
}

// LLMEndpointQuotaSpec defines the user-provided configuration for the endpoint
// quota.
message LLMEndpointQuotaSpec {}

// LLMEndpointQuotaStatus is set by the server as results of operations. These
// should not be modified by users.
message LLMEndpointQuotaStatus {
  // Window is a time window where tokens are consumed.
  message Window {
    // Name of the interval type name of this window. For example, "lifetime".
    //
    // It must match the supported values from app configuration.
    string interval_name = 1;
    // Time when the window started.
    google.protobuf.Timestamp starts_at = 2;
    // Time when the window ends.
    google.protobuf.Timestamp ends_at = 3;
    // Number of input tokens consumed in the window.
    uint64 input_tokens = 4;
    // Number of output tokens consumed in the window.
    uint64 output_tokens = 5;
  }

  // List of current active windows.
  repeated Window active_windows = 1;
}
