syntax = "proto3";

package teleport.userexternalcredentials.v1;

import "teleport/userexternalcredentials/v1/user_external_credentials.proto";

option go_package = "github.com/gravitational/teleport/api/gen/proto/go/teleport/userexternalcredentials/v1;userexternalcredentialsv1";

// UserExternalCredentialService provides methods to manage double-encrypted
// external credentials for users.
service UserExternalCredentialService {
  // GetUserExternalCredentials retrieves the caller's credentials.
  rpc GetUserExternalCredentials(GetUserExternalCredentialsRequest) returns (GetUserExternalCredentialsResponse);

  // SyncUserExternalCredentials syncs credentials to a target session by
  // re-encrypting with the target's public key.
  rpc SyncUserExternalCredentials(SyncUserExternalCredentialsRequest) returns (SyncUserExternalCredentialsResponse);

  // RefreshOAuthTokens refreshes an expired OAuth access token.
  rpc RefreshOAuthTokens(RefreshOAuthTokensRequest) returns (RefreshOAuthTokensResponse);

  // DecryptUserExternalCredential decrypts an auth-encrypted credential blob.
  rpc DecryptUserExternalCredential(DecryptUserExternalCredentialRequest) returns (DecryptUserExternalCredentialResponse);

  // ListUserExternalCredentials returns a page of credentials matching the
  // filter. The user field in the filter is required.
  rpc ListUserExternalCredentials(ListUserExternalCredentialsRequest) returns (ListUserExternalCredentialsResponse);
}

// GetUserExternalCredentialsRequest is a request to retrieve the caller's
// credentials.
message GetUserExternalCredentialsRequest {}

// GetUserExternalCredentialsResponse contains the credentials resource.
message GetUserExternalCredentialsResponse {
  // credentials is the full UserExternalCredentials resource.
  UserExternalCredentials credentials = 1;
}

// SyncUserExternalCredentialsRequest is a request to sync credentials for
// another session.
message SyncUserExternalCredentialsRequest {
  // credentials is the updated UserExternalCredentials resource.
  // The metadata.revision must match the current revision for CAS.
  UserExternalCredentials credentials = 1;
}

// SyncUserExternalCredentialsResponse is the response for SyncUserExternalCredentials.
message SyncUserExternalCredentialsResponse {}

// RefreshOAuthTokensRequest is a request to refresh an expired access token.
message RefreshOAuthTokensRequest {
  // auth_encrypted_refresh_token is the auth-encrypted refresh token blob.
  // The resource kind and name are extracted from the decrypted payload
  // envelope.
  bytes auth_encrypted_refresh_token = 1;
}

// RefreshOAuthTokensResponse contains the new auth-encrypted access token after
// a successful refresh.
message RefreshOAuthTokensResponse {
  // credential is the refreshed credential with updated double-encrypted
  // access token blob and expiry.
  Credential credential = 1;
}

// DecryptUserExternalCredentialRequest is a request to decrypt a credential.
message DecryptUserExternalCredentialRequest {
  // auth_encrypted_blob is the auth-encrypted payload to decrypt.
  //
  // For OAuthTokens, this is the auth-encrypted access token blob.
  bytes auth_encrypted_blob = 1;
  // user_certificate is the DER-encoded user TLS certificate with route to the
  // requested resource (e.g. RouteToGit cert).
  bytes user_certificate = 2;
}

// DecryptUserExternalCredentialResponse contains the decrypted plaintext.
message DecryptUserExternalCredentialResponse {
  // plaintext is the decrypted credential value.
  bytes plaintext = 1;
}

// ListUserExternalCredentialsRequest is a request to list credentials matching
// the filter.
message ListUserExternalCredentialsRequest {
  // page_size is the maximum number of items to return.
  int32 page_size = 1;
  // page_token is the page token from a previous ListUserExternalCredentials
  // response, if any.
  string page_token = 2;
  // filter narrows the returned credentials to a subset. If not set, all of
  // the caller's credentials are returned.
  EncryptionKeyID filter = 3;
}

// ListUserExternalCredentialsResponse is the response for
// ListUserExternalCredentials.
message ListUserExternalCredentialsResponse {
  // credentials is the list of credentials matching the filter.
  repeated UserExternalCredentials credentials = 1;
  // next_page_token is the token for the next page. Empty if there are no more
  // results.
  string next_page_token = 2;
}
