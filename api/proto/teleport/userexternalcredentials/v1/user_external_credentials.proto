syntax = "proto3";

package teleport.userexternalcredentials.v1;

import "google/protobuf/timestamp.proto";
import "teleport/header/v1/metadata.proto";

option go_package = "github.com/gravitational/teleport/api/gen/proto/go/teleport/userexternalcredentials/v1;userexternalcredentialsv1";

// UserExternalCredentials holds a user's double-encrypted credentials for
// external services, along with the encryption key used to protect them.
//
// This resource should only store temporary credentials like OAuth tokens. It
// should NOT be used for long-lived secrets like passwords, API keys, or
// personal access tokens. This resource is not supported by Infrastructure as
// Code as it is managed internally by Auth and tied to user session lifecycles.
//
// Backend path: user_external_credentials/<user>/user/<key_id>, or
// user_external_credentials/<user>/delegation/<delegate>/<key_id> for sessions
// of a delegate of the user.
message UserExternalCredentials {
  // kind is the resource kind, always "user_external_credentials".
  string kind = 1;
  // sub_kind is the resource sub-kind, currently unused.
  string sub_kind = 2;
  // version is the resource version.
  string version = 3;
  // metadata is the resource metadata.
  teleport.header.v1.Metadata metadata = 4;
  // spec is the credentials spec.
  UserExternalCredentialsSpec spec = 5;
}

// UserExternalCredentialsSpec holds the encryption key and credentials for a user.
message UserExternalCredentialsSpec {
  // encryption_key_id identifies this resource and determines the backend
  // storage path.
  EncryptionKeyID encryption_key_id = 1;
  // encryption_public_key is the public key (DER-encoded) used to encrypt
  // credentials for this resource's owner.
  bytes encryption_public_key = 2;
  // credentials is the list of double-encrypted credentials.
  repeated Credential credentials = 3;
}

// EncryptionKeyID is the composite identity for a UserExternalCredentials
// resource.
message EncryptionKeyID {
  // user is the Teleport username.
  string user = 1;
  // key_id is the unique identifier for the encryption key for user sessions.
  string key_id = 2;
  // delegate is the Teleport username of the delegate (e.g. the bot of a beam)
  // when the session belongs to a delegate of the user. Empty for the user's
  // own sessions.
  string delegate = 3;
}

// Credential is a single double-encrypted credential.
message Credential {
  // resource_kind is the kind of resource (e.g. "git_server").
  string resource_kind = 1;
  // resource_name is the name of the resource (e.g. "github-my-org").
  string resource_name = 2;
  // credential holds the double-encrypted credential data.
  oneof credential {
    OAuthTokens oauth = 3;
  }
}

// OAuthTokens holds double-encrypted OAuth tokens.
message OAuthTokens {
  // access_token_blob is the double-encrypted access token.
  bytes access_token_blob = 1;
  // refresh_token_blob is the double-encrypted refresh token.
  bytes refresh_token_blob = 2;
  // access_token_expiry is when the access token expires.
  google.protobuf.Timestamp access_token_expiry = 3;
  // refresh_token_expiry is when the refresh token expires.
  google.protobuf.Timestamp refresh_token_expiry = 4;
}

// MCPOAuthCredential is a user's OAuth credential for an MCP server.
//
// Backend path: mcp_oauth_credentials/<user>/<app>, or
// scoped/mcp_oauth_credentials/<encoded scope>/<user>/<app> for a scoped app.
message MCPOAuthCredential {
  // kind is the resource kind, always "mcp_oauth_credential".
  string kind = 1;
  // sub_kind is the resource sub-kind, currently unused.
  string sub_kind = 2;
  // version is the resource version.
  string version = 3;
  // metadata is the resource metadata. The name is the name of the MCP server.
  teleport.header.v1.Metadata metadata = 4;
  // spec is the credential spec.
  MCPOAuthCredentialSpec spec = 5;
  // scope is the scope of the MCP server, empty if it isn't scoped.
  string scope = 6;
}

// MCPOAuthCredentialSpec holds the credential.
message MCPOAuthCredentialSpec {
  // encrypted is the credential encrypted by Auth.
  bytes encrypted = 1;
}
