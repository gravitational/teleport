syntax = "proto3";

package teleport.userexternalcredentials.v1;

import "teleport/header/v1/metadata.proto";

option go_package = "github.com/gravitational/teleport/api/gen/proto/go/teleport/userexternalcredentials/v1;userexternalcredentialsv1";

// CredentialEncryptionKey is a singleton resource holding the cluster's
// Auth-layer encryption key for user external credentials. This is an internal
// resource only used by Auth.
//
// Storage path: user_credential_encryption_key
message CredentialEncryptionKey {
  // kind is the resource kind, always "credential_encryption_key".
  string kind = 1;
  // sub_kind is the resource sub-kind, currently unused.
  string sub_kind = 2;
  // version is the resource version.
  string version = 3;
  // metadata is the resource metadata.
  teleport.header.v1.Metadata metadata = 4;
  // spec is the encryption key spec.
  CredentialEncryptionKeySpec spec = 5;
}

// CredentialEncryptionKeySpec holds the key material.
message CredentialEncryptionKeySpec {
  // private_key is the private key reference. For HSM/KMS-backed keys, this
  // is the key handle or ARN. For software keys, this is the PKCS#8 DER
  // encoded private key.
  //
  // The public key is NOT persisted. It is derived at runtime from the keystore
  // (e.g. via KMS GetPublicKey).
  bytes private_key = 1;
  // private_key_type indicates which keystore backend manages this key.
  // Valid values match types.PrivateKeyType enum names: "RAW", "PKCS11",
  // "GCP_KMS", "AWS_KMS".
  string private_key_type = 2;
}
