syntax = "proto3";

package teleport.identitycenter.v1;

import "teleport/header/v1/metadata.proto";
import "teleport/label/v1/label.proto";

option go_package = "github.com/gravitational/teleport/api/gen/proto/go/teleport/identitycenter/v1;identitycenterv1";

// Resource represents a discovered AWS resource that Identity Center can
// grant access to
message Resource {
  string kind = 1;
  string sub_kind = 2;
  string version = 3;
  teleport.header.v1.Metadata metadata = 4;
  ResourceSpec spec = 5;
}

// ResourceSpec holds information about an AWS resource
message ResourceSpec {
  // Arn is the resource's ARN
  string arn = 1;

  // Name is a human-readable name for the resource
  string name = 2;

  // Account is the ID of the AWS account that holds the resource
  string account = 3;

  // Region is the AWS region that hosts the resource. May be empty for
  // region-less resources like S3 buckets.
  string region = 4;

  // Resource holds resource-type specifics for the resource
  oneof resource {
    S3Resource s3 = 5;
  }
}

// S3Resource holds extra information about an S3 resource
message S3Resource {}

// AccessPolicy describes a set of allowed actions on an AWS resource
message AccessPolicy {
  string kind = 1;
  string sub_kind = 2;
  string version = 3;
  teleport.header.v1.Metadata metadata = 4;
  AccessPolicySpec spec = 5;
}

// PolicyStatement holds an AWS policy statement
message PolicyStatement {
  // Name is the name of the policy statement. Equivalent to a SID in an AWS IAM
  // Policy.
  string name = 1;

  // Action is a list of actions affected by the policy statement.
  repeated string action = 2;

  // Effect is the effect of this policy statement on the given resources. Expected
  // values are "Allow" or "Deny"
  string effect = 3;

  // Resource is a list of ARNs (including globs) defining the resources targeted
  // by this statement.
  repeated string resource = 4;
}

// S3PrefixCondition holds a prefix-based content constraint for an S3 bucket
message S3PrefixCondition {
  // Prefix is the content key prefix, omitting the leading bucket ARN.
  string prefix = 1;
  // Actions is a list of AWS IAM policy actions to apply to the content under the
  // specified prefix.
  repeated string actions = 2;
}

// S3AccessCondition describes a set of allow or deny conditions on an S3 bucket.
message S3AccessCondition {
  // Actions is a list of AWS IAM policy actions to allow to the bucket as a whole
  repeated string actions = 1;

  // Content holds a list of content access conditions to the bucket content
  // based on a key prefix
  repeated S3PrefixCondition content = 2;
}

// AccessConstraintCondition holds set of allow or deny conditions on various
// kinds of AWS resources
message AccessPolicyCondition {
  S3AccessCondition s3 = 1;
}

// AccessConstraint describes a set of allowed actions on an AWS resource
message AccessPolicySpec {
  // DisplayName is a short, human-readable name for this constraint.
  string display_name = 1;

  // ResourceLabels describe which managed resources this constraint applies to.
  repeated teleport.label.v1.Label resource_labels = 2;

  // Allow holds the allowed actions for the target resource
  AccessPolicyCondition allow = 3;

  // Allow holds the denied actions for the target resource
  AccessPolicyCondition deny = 4;

  // ExtraStatements holds additional policy statements to be included in the
  // generated policy.
  repeated PolicyStatement extra_statements = 5;
}
