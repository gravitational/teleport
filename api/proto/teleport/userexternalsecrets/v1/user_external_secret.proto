syntax = "proto3";

package teleport.userexternalsecrets.v1;

import "google/protobuf/timestamp.proto";
import "teleport/header/v1/metadata.proto";

option go_package = "github.com/gravitational/teleport/api/gen/proto/go/teleport/userexternalsecrets/v1;userexternalsecretsv1";

// UserSessionCredentials is a single resource per user per session that holds
// the session's encryption key and all double-encrypted secrets. Each secret
// is encrypted with two layers:
// - Inner: Auth encryption (keystore/KMS, only auth can decrypt)
// - Outer: ECIES per-session encryption (only the session holder can decrypt)
//
// Backend path for tsh sessions:
//   user_session_credentials/<user>/user/<uuid5(pubkey)>
// Backend path for delegation sessions:
//   user_session_credentials/<user>/delegation/<delegation_session_id>/<bot_instance_id>
message UserSessionCredentials {
  string kind = 1;
  string sub_kind = 2;
  string version = 3;
  teleport.header.v1.Metadata metadata = 4;
  UserSessionCredentialsSpec spec = 5;
}

// UserSessionCredentialsSpec holds the encryption key and secrets for a session.
message UserSessionCredentialsSpec {
  // user is the Teleport username that owns this session.
  string user = 1;
  // encryption_key holds the session's ECIES P-256 encryption key details.
  EncryptionKey encryption_key = 2;
  // credentials is the list of double-encrypted secrets for this session (max 10).
  repeated Credential credentials = 3;
}

// Credential is a single double-encrypted secret within a session's credentials.
message Credential {
  // resource_kind is the kind of resource (e.g. "git_server").
  string resource_kind = 1;
  // resource_name is the name of the resource (e.g. "github-my-org").
  string resource_name = 2;
  // secret holds the double-encrypted secret data.
  oneof secret {
    OAuthSecret oauth = 3;
  }
}

// EncryptionKey represents a per-session ECIES P-256 encryption key.
message EncryptionKey {
  // key_id is the unique identifier for this key (same as metadata.name).
  string key_id = 1;
  // delegation_session_id is set for delegation sessions (beams).
  // Used for cleanup during beam teardown and backend path resolution.
  string delegation_session_id = 2;
  // bot_instance_id is set for delegation sessions (beams).
  // Together with delegation_session_id, it identifies the backend path.
  string bot_instance_id = 3;
  // public_key is the ECIES P-256 public key (DER-encoded PKIX).
  bytes public_key = 4;
}

// OAuthSecret holds double-encrypted OAuth tokens. Each blob is independently
// double-encrypted: ECIES(KMS(EncryptedPayload{user, payload})).
message OAuthSecret {
  // access_token_blob is the double-encrypted access token.
  bytes access_token_blob = 1;
  // refresh_token_blob is the double-encrypted refresh token.
  bytes refresh_token_blob = 2;
  // access_token_expiry is when the access token expires.
  google.protobuf.Timestamp access_token_expiry = 3;
  // refresh_token_expiry is when the refresh token expires.
  google.protobuf.Timestamp refresh_token_expiry = 4;
}

// EncryptedPayload is the plaintext structure inside the Auth encryption
// envelope. It binds the secret to the owning user and resource to prevent
// cross-user and cross-resource theft.
message EncryptedPayload {
  // user is the Teleport username. Auth verifies this matches the caller.
  string user = 1;
  // payload is the raw secret value (e.g. the access token string).
  bytes payload = 2;
}
