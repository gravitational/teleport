syntax = "proto3";

package teleport.userexternalsecrets.v1;

import "teleport/header/v1/metadata.proto";

option go_package = "github.com/gravitational/teleport/api/gen/proto/go/teleport/userexternalsecrets/v1;userexternalsecretsv1";

// UserEncryptionKey is a per-session ECIES P-256 encryption public key
// registered by a user session. This serves as a registry of active sessions
// that can receive double-encrypted secrets. Auth uses this to know which
// sessions to encrypt for when distributing secrets.
//
// Storage path: user_encryption_key/<user>/<encryption_key_id>
// where encryption_key_id is derived as uuid.NewSHA1(NameSpaceOID, public_key).
// TTL matches the session cert lifetime.
message UserEncryptionKey {
  string kind = 1;
  string sub_kind = 2;
  string version = 3;
  teleport.header.v1.Metadata metadata = 4;
  UserEncryptionKeySpec spec = 5;
  UserEncryptionKeyStatus status = 6;
}

// UserEncryptionKeySpec contains the key details.
message UserEncryptionKeySpec {
  // public_key is the ECIES P-256 public key (PKIX DER). The user is
  // identified by the storage path and metadata, not duplicated here.
  bytes public_key = 1;
}

// UserEncryptionKeyStatus contains dynamic properties. Currently empty.
message UserEncryptionKeyStatus {}
