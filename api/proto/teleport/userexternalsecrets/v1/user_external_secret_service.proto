syntax = "proto3";

package teleport.userexternalsecrets.v1;

import "teleport/userexternalsecrets/v1/user_external_secret.proto";

option go_package = "github.com/gravitational/teleport/api/gen/proto/go/teleport/userexternalsecrets/v1;userexternalsecretsv1";

// UserExternalSecretService provides methods to manage double-encrypted
// external secrets for users.
service UserExternalSecretService {
  // GetUserSessionCredentials returns the session credentials for the calling
  // user's session, identified by encryption key ID or delegation session info.
  rpc GetUserSessionCredentials(GetUserSessionCredentialsRequest) returns (GetUserSessionCredentialsResponse);

  // UpdateUserSessionCredentials performs a conditional update on a session
  // credentials resource. The caller must provide the resource with the correct
  // revision for CAS. Used by tsh cred sync to add secrets to target sessions.
  rpc UpdateUserSessionCredentials(UpdateUserSessionCredentialsRequest) returns (UpdateUserSessionCredentialsResponse);

  // DecryptUserExternalSecret decrypts an auth-encrypted secret blob. The
  // caller must be a trusted service (e.g. proxy). Auth verifies the payload
  // binding (user + resource) before returning the plaintext.
  rpc DecryptUserExternalSecret(DecryptUserExternalSecretRequest) returns (DecryptUserExternalSecretResponse);
}

// GetUserSessionCredentialsRequest is a request to retrieve session credentials.
message GetUserSessionCredentialsRequest {
  // encryption_key_id specifies which session's credentials to fetch.
  // If empty, the key ID is read from the caller's TLS certificate.
  string encryption_key_id = 1;
}

// GetUserSessionCredentialsResponse contains the session credentials resource.
message GetUserSessionCredentialsResponse {
  // credentials is the full UserSessionCredentials resource.
  UserSessionCredentials credentials = 1;
}

// UpdateUserSessionCredentialsRequest is a request to update session credentials.
message UpdateUserSessionCredentialsRequest {
  // credentials is the updated UserSessionCredentials resource.
  // The metadata.revision must match the current revision for CAS.
  UserSessionCredentials credentials = 1;
}

// UpdateUserSessionCredentialsResponse is the response for UpdateUserSessionCredentials.
message UpdateUserSessionCredentialsResponse {
  // credentials is the updated resource with the new revision.
  UserSessionCredentials credentials = 1;
}

// DecryptUserExternalSecretRequest is a request to decrypt a secret.
message DecryptUserExternalSecretRequest {
  // auth_encrypted_blob is the auth-encrypted payload to decrypt.
  bytes auth_encrypted_blob = 1;
}

// DecryptUserExternalSecretResponse contains the decrypted plaintext.
message DecryptUserExternalSecretResponse {
  // plaintext is the decrypted secret value.
  bytes plaintext = 1;
}
