syntax = "proto3";

package teleport.users.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "teleport/legacy/types/types.proto";

option go_package = "github.com/gravitational/teleport/api/gen/proto/go/teleport/users/v1;usersv1";

// UsersService provides methods to manage Teleport users.
service UsersService {
  // GetUser retrieves a user by name or looks up the current user if requested.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // ListUsers gets all existing users.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // CreateUser creates a user if one does not already exist.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  // UpdateUser updates an existing user.
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  // UpsertUser creates a new user or forcefully updates an existing user.
  rpc UpsertUser(UpsertUserRequest) returns (UpsertUserResponse);
  // DeleteUser removes an existing user by name.
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty);
  // ResetUser resets a user's password (if applicable) and MFA devices.
  rpc ResetUser(ResetUserRequest) returns (ResetUserResponse);
}

// Request for GetUser.
message GetUserRequest {
  // Name of the user to retrieve, this take priority over current_user.
  string name = 1;

  // Whether to return the current user. If the name is provided
  // then this field is ignored.
  bool current_user = 2;

  // Specifies whether to load associated secrets(password, mfa devices, etc.).
  bool with_secrets = 3;
}

// Response for GetUser.
message GetUserResponse {
  // The user matching the request filters.
  types.UserV2 user = 1;
}

// Request for ListUsers.
//
// Follows the pagination semantics of
// https://cloud.google.com/apis/design/standard_methods#list.
message ListUsersRequest {
  // The maximum number of items to return.
  // The server may impose a different page size at its discretion.
  int32 page_size = 1;

  // The next_page_token value returned from a previous List request, if any.
  string page_token = 2;

  // Specifies whether to load associated secrets(password, mfa devices, etc.).
  bool with_secrets = 3;

  // Filter matches users.
  types.UserFilter filter = 4;
}

// Response for ListUsers.
message ListUsersResponse {
  // Users that matched the search.
  repeated types.UserV2 users = 1;

  // Token to retrieve the next page of results, or empty if there are no
  // more results in the list.
  string next_page_token = 2;
}

// Request for CreateUser.
message CreateUserRequest {
  // The user resource to create.
  types.UserV2 user = 1;
}

// Response for CreateUser.
message CreateUserResponse {
  // The created user with any server side generated fields populated.
  types.UserV2 user = 1;
}

// Request for UpdateUser.
message UpdateUserRequest {
  // The user resource to update.
  types.UserV2 user = 2;
}

// Response for UpdateUser.
message UpdateUserResponse {
  // The updated user with any server side generated fields populated.
  types.UserV2 user = 1;
}

// Request for UpsertUser.
message UpsertUserRequest {
  // The user resource to upsert.
  types.UserV2 user = 2;
}

// Response for UpsertUser.
message UpsertUserResponse {
  // The upserted user with any server side generated fields populated.
  types.UserV2 user = 1;
}

// Request for DeleteUser.
message DeleteUserRequest {
  // Name of the user to remove.
  string name = 1;
}

// ResetUserKind is the kind of user that was reset.
enum ResetUserKind {
  // RESET_USER_KIND_UNSPECIFIED is the default/unspecified value for ResetUserKind.
  RESET_USER_KIND_UNSPECIFIED = 0;
  // RESET_USER_KIND_LOCAL is a local user.
  RESET_USER_KIND_LOCAL = 1;
  // RESET_USER_KIND_SSO is a single sign-on user.
  RESET_USER_KIND_SSO = 2;
  // RESET_USER_KIND_DELETED is a user that no longer exists, such as an SSO user who is logged out.
  RESET_USER_KIND_DELETED = 3;
}

// ResetUserTokenType is the type of token created by a reset.
enum ResetUserTokenType {
  // RESET_USER_TOKEN_TYPE_UNSPECIFIED is the default/unspecified value for ResetUserTokenType,
  // this will be treated as RESET_USER_TOKEN_TYPE_PASSWORD.
  RESET_USER_TOKEN_TYPE_UNSPECIFIED = 0;
  // RESET_USER_TOKEN_TYPE_PASSWORD is a token for an existing user to set a new password.
  RESET_USER_TOKEN_TYPE_PASSWORD = 1;
  // RESET_USER_TOKEN_TYPE_INVITE is a token for the invitation flow.
  RESET_USER_TOKEN_TYPE_INVITE = 2;
}

// Request for ResetUser.
message ResetUserRequest {
  // Username of the user to reset.
  string name = 1;
  // The type of token to create.
  ResetUserTokenType type = 2;
  // Ttl of the created token.
  // Defaults to 8h for password with a maximum of 24h, and 1h for invite with a maximum of 48h.
  google.protobuf.Duration ttl = 3;
}

// Response for ResetUser.
message ResetUserResponse {
  // Token to set up new credentials with. Only set for local users.
  types.UserTokenV3 password_reset_token = 1;
  // Kind of the user that was reset.
  ResetUserKind user_kind = 2;
  // Number of MFA devices that were removed.
  // This will only be set for SSO and deleted users because local users have theirs removed as part of the password reset.
  int32 mfa_devices_removed = 3;
}
