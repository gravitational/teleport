syntax = "proto3";

package teleport.beams.v1;

import "google/protobuf/timestamp.proto";
import "teleport/beams/v1/beam.proto";
import "teleport/header/v1/metadata.proto";

option go_package = "github.com/gravitational/teleport/api/gen/proto/go/teleport/beams/v1;beamsv1";

// Phase is a reusable Beam base image built by Teleport.
message Phase {
  // Kind is always `phase`.
  string kind = 1;

  // SubKind is always empty.
  string sub_kind = 2;

  // Version is always `v1`.
  string version = 3;

  // Metadata contains the Phase name and ownership labels. Auth generates the
  // name when it is omitted at creation. Names are limited to 54 characters
  // to leave room for a unique suffix in build Beam hostnames.
  teleport.header.v1.Metadata metadata = 4;

  // Spec contains the requested build configuration and parent.
  PhaseSpec spec = 5;

  // Status contains Auth-maintained build state.
  PhaseStatus status = 6;
}

// PhaseSpec contains the requested build configuration and parent.
message PhaseSpec {
  // BuildConfig is opaque builder input stored in this Teleport resource and
  // passed unchanged to build Beams. Teleport does not interpret its contents.
  // It is empty for Phases built without commands, including static, snapshot,
  // and copy Phases.
  string build_config = 1;

  // Parent is the immutable upstream Phase whose latest successful image is
  // used as this Phase's base image. Top-level Phases store "default:v1".
  string parent = 2;
}

// PhaseStrategy controls automatic image rebuilding.
enum PhaseStrategy {
  // PHASE_STRATEGY_UNSPECIFIED is invalid.
  PHASE_STRATEGY_UNSPECIFIED = 0;

  // PHASE_STRATEGY_STATIC is built interactively once and is not rebuilt.
  PHASE_STRATEGY_STATIC = 1;

  // PHASE_STRATEGY_REBUILD is rebuilt from BuildConfig every 24 hours, or
  // after each successful refresh of a non-static upstream Phase.
  PHASE_STRATEGY_REBUILD = 2;

  // PHASE_STRATEGY_SNAPSHOT applies the Phase's rebase-safe snapshot layer to
  // the latest selected base image every 24 hours, or after each successful
  // refresh of a non-static upstream Phase.
  PHASE_STRATEGY_SNAPSHOT = 3;

  // PHASE_STRATEGY_COPY refreshes like SNAPSHOT but contains only protected-path
  // changes. It can be replaced with another COPY snapshot even with children.
  PHASE_STRATEGY_COPY = 4;
}

// PhaseStatus contains Auth-maintained build state.
message PhaseStatus {
  // User identifies the Teleport username of the root user or bot who owns the
  // Phase, even when it was created from a delegated Beam. Delegation limits
  // the permissions used for builds. Caller access is checked separately
  // against resource rules and labels.
  string user = 1;
  // Strategy controls how Auth refreshes this Phase. A Phase with a build
  // configuration uses REBUILD. An interactive build starts as STATIC and can
  // become SNAPSHOT or COPY after a successful snapshot. Once COPY, a Phase
  // can only accept further COPY snapshots, including during replacement.
  PhaseStrategy strategy = 2;
  // State is the state of the most recent build operation.
  PhaseBuildState state = 3;
  // Region fixes both compute and snapshot registry placement for the Phase.
  // Builds, rebases, and Beams using its snapshots must stay in this region.
  string region = 4;
  // Published is the latest successful image and its upstream generation.
  PhasePublishedImage published = 5;
  // Operation describes the current or most recent build attempt. Auth keeps
  // it until the build Beam and its supporting resources are cleaned up. Its
  // ID lets cleanup ignore work from an older attempt.
  PhaseBuildOperation operation = 6;
  // Pending is a successful image that Auth accepted but has not yet given a
  // retention tag. Auth uses it to retry tag publication after an interruption.
  PhasePendingPublication pending = 7;
  // NextBuildAt is when Auth should next start a scheduled refresh or retry a
  // failed build. A Phase that waits for its parent leaves this field empty.
  google.protobuf.Timestamp next_build_at = 8;
  // LastAttemptedUpstreamGeneration identifies the parent image used by the
  // last completed or failed build. A newer parent image can start immediately.
  // Retries using the same parent image remain subject to retry backoff.
  string last_attempted_upstream_generation = 9;
  // LastError is a sanitized description of the most recent build failure.
  string last_error = 10;
  // FailedBuilds contains up to three recent failed rebuild snapshots, newest
  // first. Removing an entry does not delete its registry image.
  repeated FailedPhaseBuild failed_builds = 11;
  // RetiredSnapshots lists retention tags for older images that still need to
  // be deleted. Auth retries this cleanup in the background.
  repeated PhaseSnapshotTag retired_snapshots = 12;
  // ID identifies this particular lifetime of the Phase. Auth generates a new
  // ID when the Phase is created. Snapshot metadata includes it so a deleted
  // Phase name cannot be used to access snapshots from an older Phase.
  string id = 13;
  // Delegation limits which of the owner's current standing roles builds can
  // use. Auth preserves inherited restrictions when creating from a Beam.
  // Replacing the Phase does not change this selection.
  DelegationSpec delegation = 14;
}

// PhasePublishedImage is the latest successful image retained for new Beams.
message PhasePublishedImage {
  // Digest is the latest successful canonical OCI image digest.
  string digest = 1;
  // Generation uniquely identifies this publication and is also its snapshot
  // retention tag. Each publication gets a new ID, even if Digest is unchanged.
  string generation = 2;
  // PublishedAt is when Auth committed this successful publication.
  google.protobuf.Timestamp published_at = 3;
  // UpstreamGeneration identifies the parent image generation included in
  // Digest. It is empty when the parent is "default:v1".
  string upstream_generation = 4;
  // OperationID identifies the build that produced this image. Auth uses it to
  // tell an interrupted checkpointed build from a replacement that never
  // published an image.
  string operation_id = 5;
  // SuppressRebuilds lists child Phase IDs that should not automatically rebase
  // or rebuild to adopt this generation. Explicit replacements remain allowed.
  repeated string suppress_rebuilds = 6;
}

// PhaseBuildOperation records one build or rebase attempt from start through
// cleanup of its build Beam.
message PhaseBuildOperation {
  // ID uniquely identifies this attempt, including before a Beam exists.
  string id = 1;
  // StartedAt is when the build or rebase operation was started.
  google.protobuf.Timestamp started_at = 2;
  // BuildBeam is the build Beam UUID until cleanup completes.
  string build_beam = 3;
  // WorkingDigest is the snapshot used to initialize an interactive build
  // Beam. Its presence distinguishes replacement provisioning from a rebase
  // that Auth can recover without creating a new Phase.
  string working_digest = 4;
  // UpstreamGeneration identifies the generation of the selected base image.
  string upstream_generation = 5;
  // UpstreamImageDigest identifies the image digest of the selected base.
  string upstream_image_digest = 6;
  // ProvisionExpires is the deadline for the request handler to finish
  // provisioning this operation. A controller can recover it after the
  // deadline passes.
  google.protobuf.Timestamp provision_expires = 7;
  // ProvisionProxyRegion preserves the proxy region selected for recovery.
  string provision_proxy_region = 8;
  // ProvisionOverrideRegion preserves the requested compute region for recovery.
  string provision_override_region = 9;
  // ProvisionStreamLogs preserves whether build logs should be streamed.
  bool provision_stream_logs = 10;
  // DeleteOnProvisionFailure marks a newly created Phase that has not finished
  // provisioning. Auth deletes that Phase after a provisioning failure or
  // expired claim. Auth clears this field once provisioning succeeds.
  bool delete_on_provision_failure = 11;
  // Origin identifies who started the operation for quota accounting. Auth sets
  // it to "user" for a user request and to "scheduled" for a controller
  // refresh. Recovery keeps the same value so the operation uses the same quota.
  string origin = 12;
  // SuppressRebuilds is saved with each generation published by this operation.
  // It prevents automatic updates of the listed children while a client
  // applies their replacement configuration.
  repeated string suppress_rebuilds = 13;
  // BuildType records how this build Beam should start. Provisioning recovery
  // uses the same type so file-copy builds never start configured services.
  PhaseBuildType build_type = 14;
}

// PhaseBuildType selects what a build Beam does before its snapshot is saved.
enum PhaseBuildType {
  // PHASE_BUILD_TYPE_UNSPECIFIED is rejected when creating a build.
  PHASE_BUILD_TYPE_UNSPECIFIED = 0;
  // PHASE_BUILD_TYPE_SNAPSHOT opens an interactive development environment.
  PHASE_BUILD_TYPE_SNAPSHOT = 1;
  // PHASE_BUILD_TYPE_REBUILD executes the Phase's command configuration.
  PHASE_BUILD_TYPE_REBUILD = 2;
  // PHASE_BUILD_TYPE_COPY receives files without running configured services.
  PHASE_BUILD_TYPE_COPY = 3;
}

// PhasePendingPublication is a successful image that still needs its registry
// retention tag.
message PhasePendingPublication {
  // Digest is the image that Auth accepted before creating its retention tag.
  string digest = 1;
  // Generation is the unique retention tag for this accepted image. It stays
  // the same when Auth retries publication.
  string generation = 2;
  // Rebase is true when the accepted image can be applied to a newer parent.
  bool rebase = 3;
  // Manual is true when a user published the image without completing the
  // active automatic build.
  bool manual = 4;
  // UpstreamGeneration is the parent image generation included in this image.
  string upstream_generation = 5;
  // Copy is true when the rebase-safe image contains only protected changes.
  bool copy = 6;
}

// FailedPhaseBuild identifies an image from a failed build that remains
// available for inspection until the registry expires it.
message FailedPhaseBuild {
  // Digest is the canonical OCI image digest of the failed build snapshot.
  string digest = 1;
  // Timestamp is when Auth observed the failed build result.
  google.protobuf.Timestamp timestamp = 2;
  // Expiration is the estimated registry expiry time, normally 24 hours after
  // Timestamp.
  google.protobuf.Timestamp expiration = 3;
}

// PhaseBuildState is the state of the most recent Phase build operation.
enum PhaseBuildState {
  // PHASE_BUILD_STATE_UNSPECIFIED means no build has been started.
  PHASE_BUILD_STATE_UNSPECIFIED = 0;

  // PHASE_BUILD_STATE_BUILDING means a build or rebase operation is active.
  PHASE_BUILD_STATE_BUILDING = 1;

  // PHASE_BUILD_STATE_READY means the most recent build succeeded.
  PHASE_BUILD_STATE_READY = 2;

  // PHASE_BUILD_STATE_FAILED means the most recent build failed. The previous
  // published image remains usable when one exists.
  PHASE_BUILD_STATE_FAILED = 3;

  // PHASE_BUILD_STATE_BLOCKED means this Phase still has a usable image but
  // cannot refresh until its parent Phase succeeds.
  PHASE_BUILD_STATE_BLOCKED = 4;

  // PHASE_BUILD_STATE_DELETING prevents new work while Auth removes the Phase's
  // retention tags and build Beam.
  PHASE_BUILD_STATE_DELETING = 5;
}

// PhaseSnapshotTag identifies a retention tag awaiting removal.
message PhaseSnapshotTag {
  // Tag is the generation ID used as the registry retention tag for an older
  // Phase image.
  string tag = 1;
  // DeleteAfter is the earliest time background cleanup may remove this tag.
  // Deleting the Phase removes the tag immediately.
  google.protobuf.Timestamp delete_after = 2;
}
